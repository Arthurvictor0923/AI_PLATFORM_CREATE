<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="lU8xBd4L4OfIQt9z4PJo4j">
<head data-page-node-id="VCAaWE4pNADzCvOJZHkmdO">
<meta charset="UTF-8" data-page-node-id="Gsy9zWUnqZ1G0bTsbmXKSn">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="UY9CHEWf0wrhcQRRIxWM1U">
<title>数据中心 — 北大荒智慧农业协同创新平台</title>
<!--
数据中心 · v16.1（2026-09-15 · 落地《数据中心三类页面前端样式规范》V1.0）
本次只改「数据列表页」的样式与版式，业务逻辑（筛选/专题、搜索、排序、分页、申请使用、登录态）全部保留：
  · 公共导航 + 左筛选与右搜索结果 + 公共页脚；无「首页 / 数据中心」面包屑、无页面标题说明区；
  · 视觉变量统一为深墨青绿体系（--brand #005653 / --page-bg #f4f8f5 / --border #dce5e9 / --footer-bg #00504e）；
  · 左栏 272px（窄桌面 240px，≤1199px 收为抽屉），右栏 minmax(0,1fr)，间距 16px；
  · 图标全部换成同一套线性 SVG（原 emoji 图标已清除，规范禁止 emoji 与彩色剪贴图）；
  · 页脚按规范四区 38% / 15% / 19% / 28%，禁止版权区、备案、邮箱、二维码。
  · v16.1：卡片内一句话简介按要求去掉（DS.desc 字段保留备用）。
-->
<style>
:root{
  /* —— 设计变量（规范 §基础视觉变量）—— */
  --brand:#005653; --brand-hover:#004542;
  --brand-soft:#edf6f2; --page-bg:#f4f8f5;
  --surface:#fff; --text:#10213a;
  --text-secondary:#526078; --text-muted:#6b778c;
  --border:#dce5e9; --footer-bg:#00504e;
  --error:#b42318; --disabled-bg:#f1f3f5;
  --radius-sm:4px; --radius-md:8px;
  --control-height:36px; --header-height:64px;
  --content-max:1800px; --layout-gap:16px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --shadow:0 2px 8px rgba(16,33,58,.06);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-serif:"Source Han Serif SC","Noto Serif SC","STSong","SimSun",serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-ui);font-size:14px;line-height:22px;color:var(--text);
  background:var(--page-bg);-webkit-font-smoothing:antialiased;
  min-height:100dvh;display:flex;flex-direction:column;
}
a{color:var(--brand);text-decoration:none;}
a:hover{color:var(--brand-hover);}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;}
input,select{font:inherit;color:inherit;}
.ico{width:16px;height:16px;flex-shrink:0;display:block;}
.container{width:100%;max-width:var(--content-max);margin:0 auto;padding-inline:clamp(24px,3.65vw,56px);}
.app-main{flex:1;min-width:0;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

/* ==================== 公共导航 ==================== */
.site-header{position:sticky;top:0;z-index:100;height:var(--header-height);background:var(--surface);border-bottom:1px solid var(--border);}
.header-inner{display:flex;align-items:center;gap:var(--s5);height:var(--header-height);}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand span{font-size:22px;line-height:30px;font-weight:600;color:var(--text);white-space:nowrap;}
.main-nav{display:flex;align-items:center;height:var(--header-height);margin-left:var(--s4);flex:1;min-width:0;overflow:hidden;}
.main-nav a,.main-nav button{
  position:relative;display:inline-flex;align-items:center;height:var(--header-height);
  padding:0 16px;font-size:14px;line-height:22px;color:var(--text-secondary);
  white-space:nowrap;background:none;border:0;cursor:pointer;transition:color .2s;
}
.main-nav a:hover,.main-nav button:hover{color:var(--brand);}
.main-nav .active{color:var(--brand);font-weight:600;}
.main-nav .active::after{content:'';position:absolute;left:16px;right:16px;bottom:-1px;height:3px;border-radius:2px 2px 0 0;background:var(--brand);}
.header-actions{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.btn-login{display:inline-flex;align-items:center;justify-content:center;height:var(--control-height);padding:0 16px;font-size:14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text);white-space:nowrap;transition:all .2s;}
.btn-login:hover{color:var(--brand);border-color:var(--brand);}
.btn-brand{display:inline-flex;align-items:center;justify-content:center;height:var(--control-height);padding:0 16px;font-size:14px;font-weight:500;border-radius:var(--radius-sm);background:var(--brand);color:#fff;white-space:nowrap;transition:background .2s;}
.btn-brand:hover{background:var(--brand-hover);color:#fff;}
/* 登录态 */
.u-box{display:flex;align-items:center;gap:8px;position:relative;}
.u-avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.u-name{font-size:14px;color:var(--text);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
.u-name .u-chev{width:13px;height:13px;color:var(--text-muted);}
.u-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:176px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:var(--s1);z-index:200;}
.u-menu.open{display:block;}
.u-mi{display:block;padding:8px 12px;font-size:14px;color:var(--text-secondary);border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;}
.u-mi:hover{background:var(--brand-soft);color:var(--brand);}
.u-mi.out{color:var(--error);}
.u-mi.out:hover{background:#fdf6f4;color:var(--error);}

/* ==================== 主体骨架 ==================== */
.market-layout{
  display:grid;grid-template-columns:272px minmax(0,1fr);gap:var(--layout-gap);
  align-items:start;padding:16px 0 var(--s6);
}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);}

/* ==================== 左栏：筛选 / 专题 ==================== */
.filter-side{
  position:sticky;top:calc(var(--header-height) + 16px);
  max-height:calc(100dvh - var(--header-height) - 16px);overflow-y:auto;
}
.filter-inner{padding:var(--s4) var(--s4) var(--s5);}
.ltabs{display:flex;align-items:center;gap:12px;margin-bottom:var(--s4);}
.lt-seg{flex:1;display:flex;height:34px;border-radius:var(--radius-sm);overflow:hidden;background:var(--disabled-bg);}
.ltab{flex:1;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-secondary);cursor:pointer;border:0;background:transparent;transition:all .15s;}
.ltab:hover{color:var(--brand);}
.ltab.on{background:var(--brand);color:#fff;font-weight:600;}
/* ⭐0917 已移除 .lt-clear 规则（左栏"清空"按钮删除，见 HTML 注释） */

.fgroup{padding-bottom:var(--s3);border-bottom:1px solid var(--border);margin-bottom:var(--s3);}
.fgroup:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0;}
.fgroup-title{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;text-align:left;background:none;border:0;padding:2px 0;}
.fgroup-title::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--brand);flex-shrink:0;}
.fgroup-title .chev{margin-left:auto;width:14px;height:14px;color:var(--text-muted);transition:transform .2s;}
.fgroup.collapsed .chev{transform:rotate(-90deg);}
.fgroup.collapsed .fgroup-body{display:none;}
.fgroup-body{padding-top:2px;}

.fitem{display:flex;align-items:center;gap:10px;width:100%;min-height:32px;padding:4px 4px 4px 16px;border-radius:var(--radius-sm);font-size:14px;line-height:22px;color:var(--text-secondary);cursor:pointer;text-align:left;background:none;border:0;transition:background .12s,color .12s;}
.fitem:hover{background:var(--brand-soft);color:var(--brand);}
.fitem .cbx{position:relative;width:16px;height:16px;flex-shrink:0;border:1px solid #c4d0d5;border-radius:3px;background:#fff;transition:all .12s;}
.fitem.on{color:var(--brand);font-weight:600;}
.fitem.on .cbx{background:var(--brand);border-color:var(--brand);}
.fitem.on .cbx::after{content:'';position:absolute;left:5px;top:2px;width:4px;height:8px;border:2px solid #fff;border-top:0;border-left:0;transform:rotate(45deg);}
.fitem .cnt{margin-left:auto;font-size:12px;color:var(--text-muted);font-weight:400;}
.fitem.on .cnt{color:var(--brand);}
.fitem.more-hide{display:none;}
.more-btn{display:flex;align-items:center;gap:6px;margin-left:16px;min-height:32px;font-size:14px;color:var(--text);background:none;border:0;padding:0;}
.more-btn:hover{color:var(--brand);}
.more-btn .chev{width:14px;height:14px;transition:transform .2s;}
.more-btn.expanded .chev{transform:rotate(180deg);}
.fsel{position:relative;margin:2px 0 0 16px;}
.fsel select{width:100%;height:var(--control-height);padding:0 34px 0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;font-size:14px;color:var(--text);appearance:none;cursor:pointer;}
.fsel select:focus{outline:none;border-color:var(--brand);}
.fsel::after{content:'';position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--text-muted);border-bottom:1.6px solid var(--text-muted);transform:translateY(-70%) rotate(45deg);pointer-events:none;}

/* 专题 Tab */
.zone-list{padding-top:2px;}
.zitem{display:flex;align-items:center;gap:10px;width:100%;padding:10px;margin:2px 0;border-radius:var(--radius-sm);cursor:pointer;text-align:left;background:none;border:1px solid transparent;transition:all .12s;}
.zitem:hover{background:var(--brand-soft);}
.zitem.on{background:var(--brand-soft);border-color:var(--brand);}
.zitem .zi{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.zitem .zi svg{width:20px;height:20px;}
.zitem.on .zi{background:var(--brand);color:#fff;}
.zitem .zn{flex:1;font-size:14px;font-weight:600;color:var(--text);}
.zitem.on .zn{color:var(--brand);}
.zitem .zc{font-size:12px;color:var(--text-muted);}
.zone-ft{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--border);font-size:12px;line-height:18px;color:var(--text-muted);}

/* ==================== 右栏：搜索结果 ==================== */
.result-panel{padding:var(--s4);}
.tool-row{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;}
.drawer-toggle{display:none;align-items:center;gap:6px;height:var(--control-height);padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;font-size:14px;color:var(--text-secondary);}
.search-wrap{position:relative;flex:1 1 240px;min-width:180px;max-width:580px;}
.search-wrap .s-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-muted);pointer-events:none;}
.search-wrap .kw{width:100%;height:var(--control-height);padding:0 12px 0 36px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;font-size:14px;color:var(--text);}
.search-wrap .kw::placeholder{color:var(--text-muted);}
.search-wrap .kw:focus{outline:none;border-color:var(--brand);}
.btn-search{display:inline-flex;align-items:center;justify-content:center;height:var(--control-height);padding:0 22px;font-size:14px;font-weight:500;border-radius:var(--radius-sm);background:var(--brand);color:#fff;flex-shrink:0;}
.btn-search:hover{background:var(--brand-hover);}
.tool-right{margin-left:auto;display:flex;align-items:center;gap:var(--s2);flex-shrink:0;}
.seg-switch{display:inline-flex;align-items:stretch;height:var(--control-height);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:#fff;}
.seg-switch .vs{display:inline-flex;align-items:center;gap:6px;padding:0 14px;font-size:14px;color:var(--text-secondary);background:#fff;border:0;transition:all .15s;}
.seg-switch .vs+.vs{border-left:1px solid var(--border);}
.seg-switch .vs:hover{color:var(--brand);}
.seg-switch .vs.on{background:var(--brand);color:#fff;font-weight:500;}
.seg-switch .vs .ico{width:15px;height:15px;}
.sort-wrap{position:relative;}
.sortbtn{display:inline-flex;align-items:center;gap:8px;height:var(--control-height);padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;font-size:14px;color:var(--text-secondary);}
.sortbtn:hover{color:var(--brand);border-color:var(--brand);}
.sortbtn .chev{width:14px;height:14px;transition:transform .2s;}
.sortbtn.open .chev{transform:rotate(180deg);}
.sortmenu{display:none;position:absolute;top:calc(100% + 6px);right:0;min-width:176px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:var(--s1);z-index:200;}
.sortmenu.open{display:block;}
.sm-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;font-size:14px;color:var(--text-secondary);border-radius:var(--radius-sm);cursor:pointer;}
.sm-item:hover{background:var(--brand-soft);color:var(--brand);}
.sm-item.on{color:var(--brand);font-weight:600;}
.sm-item .ck{opacity:0;display:inline-flex;align-items:center;}
.sm-item .ck svg{width:14px;height:14px;}
.sm-item.on .ck{opacity:1;}
.sm-sep{height:1px;background:var(--border);margin:var(--s1) 0;}
.sm-dir{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;font-size:14px;color:var(--text-secondary);border-radius:var(--radius-sm);cursor:pointer;}
.sm-dir:hover{background:var(--brand-soft);color:var(--brand);}
.sm-dir .dv{color:var(--text);font-weight:500;}

/* 已选条件条 */
.contextbar{display:none;align-items:center;gap:var(--s2);flex-wrap:wrap;padding-top:var(--s3);}
.contextbar.show{display:flex;}
.contextbar .cb-label{font-size:12px;line-height:18px;color:var(--text-muted);white-space:nowrap;}
.contextbar .ctx-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;font-size:12px;line-height:18px;color:var(--brand);background:var(--brand-soft);border:1px solid #cfe3dc;border-radius:var(--radius-sm);white-space:nowrap;}
.contextbar .ctx-chip .x{display:inline-flex;align-items:center;cursor:pointer;opacity:.6;padding:0 1px;}
.contextbar .ctx-chip .x svg{width:11px;height:11px;}
.contextbar .ctx-chip .x:hover{opacity:1;}
.contextbar .ctx-all{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;font-size:12px;color:var(--brand);background:none;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;}
.contextbar .ctx-all:hover{border-color:var(--brand);background:var(--brand-soft);}
/* ⭐0917 「清空」带垃圾桶图标（对齐 0916 参考示意图）；图标 14px 线性、随文字色 */
.contextbar .ctx-all svg{width:14px;height:14px;flex:0 0 14px;}

.count-line{margin:var(--s3) 0;font-size:14px;color:var(--text);}
.count-line b{font-weight:600;color:var(--brand);}

  /* 卡片视图（⭐0916 v17.0：按用户新参考示意图，改为「缩略图 / 纯信息图标 + 标题 / 简介 / 元数据行 / 底部操作行」四段式） */
.view-grid{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--layout-gap);}
.view-grid.active{display:grid;}
.ds-card{display:flex;flex-direction:column;min-height:196px;padding:var(--s4);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);cursor:pointer;transition:border-color .2s,box-shadow .2s;}
.ds-card:hover{border-color:#c2d2d2;box-shadow:var(--shadow);}
.ds-top{display:flex;gap:14px;align-items:flex-start;}
/* 缩略图：与右侧内容同高、统一 16:9，object-fit:cover 裁切 */
.ds-thumb{position:relative;flex:0 0 168px;width:168px;height:112px;border-radius:var(--radius-md);overflow:hidden;background:var(--brand-soft);border:1px solid var(--border);}
.ds-thumb img,.ds-thumb svg.tt{width:100%;height:100%;object-fit:cover;display:block;}
/* 降级态（无影像素材时）：浅绿底 + 居中线性图标 */
.ds-thumb.thumb-tinted{display:flex;align-items:center;justify-content:center;}
.ds-thumb.thumb-tinted .ico-fallback{width:32px;height:32px;color:var(--brand);opacity:.32;}
/* 缩略图内嵌示意表（数据形态＝地面实测 / 业务申报数据 / 结构化表） */
.ds-thumb.tt-tab{background:var(--surface);padding:6px;}
.ds-thumb.tt-tab table{width:100%;border-collapse:collapse;font-size:8px;line-height:13px;table-layout:fixed;}
.ds-thumb.tt-tab th,.ds-thumb.tt-tab td{border:1px solid #e3eced;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ds-thumb.tt-tab th{background:var(--brand-soft);color:var(--text-secondary);font-weight:400;text-align:left;}
.ds-thumb.tt-tab td{color:var(--text-muted);}
.ds-thumb.tt-tab td.em{color:var(--text);}
/* 缩略图图例（数据形态＝遥感反演产品） */
.ds-thumb .tt-leg{display:flex;gap:8px;width:100%;height:100%;padding:10px;background:#f1f6ee;}
.ds-thumb .tt-leg-bar{display:flex;flex-direction:column;flex:0 0 22px;border-radius:3px;overflow:hidden;}
.ds-thumb .tt-leg-bar i{flex:1;}
.ds-thumb .tt-leg-lab{display:flex;flex-direction:column;justify-content:space-between;font-size:9px;line-height:12px;color:var(--text-secondary);}
/* 无缩略图素材时退回纯信息图标（56×56） */
.ds-ic{width:56px;height:56px;border-radius:var(--radius-md);background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ds-ic svg{width:28px;height:28px;}
.ds-hd{flex:1;min-width:0;}
.ds-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:16px;line-height:24px;font-weight:600;color:var(--text);}
.ds-card:hover .ds-name{color:var(--brand);}
/* v17.0：恢复卡片一句话简介（规范 §两列数据卡片「简介」行；0915 曾去除，按新示意图恢复） */
.ds-desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px;font-size:14px;line-height:22px;color:var(--text-secondary);}
.ds-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius-sm);background:var(--brand-soft);color:#0f4a45;font-size:12px;line-height:18px;white-space:nowrap;}
/* 元数据行：区域 · 覆盖时间（按数据形态给对应取值，不虚构精度） */
.ds-fields{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;margin-top:8px;font-size:14px;line-height:22px;color:var(--text-secondary);}
.ds-fields .ff{display:inline-flex;align-items:center;gap:6px;min-width:0;}
.ds-fields .ff .k{color:var(--text-muted);white-space:nowrap;}
.ds-fields .ff .vv{color:var(--text);overflow-wrap:anywhere;}
.ds-meta{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:1px solid var(--border);}
.ds-meta .mi{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;min-width:0;}
.m-item{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:18px;color:var(--text-muted);white-space:nowrap;}
.m-item .ico{width:15px;height:15px;color:var(--text-muted);}
.m-item b{font-weight:500;color:var(--text-secondary);}
.ds-acts{margin-left:auto;display:flex;align-items:center;gap:var(--s4);flex-shrink:0;}
.text-link{display:inline-flex;align-items:center;gap:2px;font-size:14px;color:var(--brand);background:none;border:0;padding:0;white-space:nowrap;}
.text-link .ico{width:14px;height:14px;}
.text-link:hover{text-decoration:underline;}
.apply-btn{display:inline-flex;align-items:center;justify-content:center;height:var(--control-height);padding:0 16px;font-size:14px;font-weight:500;border-radius:var(--radius-sm);background:var(--brand);color:#fff;flex-shrink:0;transition:background .2s;}
.apply-btn:hover{background:var(--brand-hover);}

<script id="bdh-portal-nav-js">
/* 统一一级导航 + 0924 统一登录态（登录后出现「个人中心」入口） */
(function () {
  var CFG = window.__BDH_NAV__ || {};
  var ME = CFG.me || "";
  var SELF = !!CFG.self;

  /* ---- 占位提示兜底：优先复用页面自带的 toast ---- */
  function bdhToast(msg) {
    var f = window.showToast || window.toast;
    if (typeof f === "function") { try { f(msg); return; } catch (e) {} }
    var el = document.getElementById("bdhToast");
    if (!el) {
      el = document.createElement("div");
      el.id = "bdhToast";
      el.style.cssText = "position:fixed;left:50%;bottom:40px;transform:translateX(-50%);padding:10px 20px;"
        + "background:rgba(16,33,58,.92);color:#fff;font-size:14px;border-radius:4px;z-index:600;"
        + "transition:opacity .2s;pointer-events:none;";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = "1";
    clearTimeout(window.__bdhToastTimer);
    window.__bdhToastTimer = setTimeout(function () { el.style.opacity = "0"; }, 2600);
  }
  window.bdhToast = bdhToast;

  /* ================= 统一登录态 ================= */
  function authRoots() {
    var out = [];
    var a = document.querySelector(".header-actions");
    if (a) { out.push(a); }
    var m = document.getElementById("bdhMobileMenu") || document.getElementById("mobileMenu");
    if (m) { out.push(m); }
    return out;
  }
  function visibleLogin(el) { return el.querySelector("[data-bdh-login]:not([data-bdh-hidden])"); }

  function mk(tag, cls, txt) {
    var n = document.createElement(tag);
    n.className = cls;
    if (txt) { n.textContent = txt; }
    return n;
  }
  function mkMe() {
    var a = mk("a", "bdh-me", "个人中心");
    a.setAttribute("data-bdh-me", "");
    a.href = ME;
    return a;
  }
  function mkOut() {
    var b = mk("button", "bdh-logout", "退出");
    b.type = "button";
    b.setAttribute("data-bdh-logout", "");
    return b;
  }
  function mkUser() {
    var s = mk("span", "bdh-user");
    s.setAttribute("data-bdh-user", "");
    s.appendChild(mk("span", "bdh-avatar", "张"));
    s.appendChild(mk("span", "bdh-name", "张研究员"));
    return s;
  }
  function clearMine(el) {
    var ns = el.querySelectorAll("[data-bdh-me],[data-bdh-logout],[data-bdh-user]");
    for (var i = 0; i < ns.length; i++) {
      if (ns[i].parentNode) { ns[i].parentNode.removeChild(ns[i]); }
    }
  }
  function insertAfter(anchor, node) {
    anchor.parentNode.insertBefore(node, anchor.nextSibling);
    return node;
  }
  function syncRoot(el) {
    var mobile = el.classList.contains("mobile-menu");
    if (SELF && !mobile) { return; }                  /* 个人中心页桌面不插自链 */
    if (visibleLogin(el)) { clearMine(el); return; }  /* 未登录 */
    if (el.querySelector("[data-bdh-me]")) { return; }/* 已有入口 */

    /* —— 已登录：补「个人中心」入口 —— */
    var hidden = el.querySelector("[data-bdh-login]");
    var nodes = [mkMe()];
    if (!SELF && hidden) { nodes.push(mkOut()); }     /* 本容器有可复原的登录按钮才给「退出」 */

    if (mobile) {
      var last = hidden;
      if (last) { for (var i = 0; i < nodes.length; i++) { last = insertAfter(last, nodes[i]); } }
      else { for (var k = 0; k < nodes.length; k++) { el.appendChild(nodes[k]); } }
      return;
    }
    var ident = el.querySelector(".u-box, .signed-user, .pc-user, .bdh-user");
    if (!ident) {
      ident = mkUser();
      if (hidden && hidden.parentNode === el) { el.insertBefore(ident, hidden); }
      else { el.insertBefore(ident, el.firstChild); }
    }
    var after = ident;
    for (var j = 0; j < nodes.length; j++) { after = insertAfter(after, nodes[j]); }
  }
  function syncAuth() {
    var roots = authRoots();
    for (var i = 0; i < roots.length; i++) { syncRoot(roots[i]); }
  }
  window.bdhSyncAuth = syncAuth;

  function hideLogins() {
    var bs = document.querySelectorAll("[data-bdh-login]");
    for (var i = 0; i < bs.length; i++) {
      bs[i].setAttribute("data-bdh-hidden", "");
      bs[i].style.display = "none";
    }
  }
  function showLogins() {
    var bs = document.querySelectorAll("[data-bdh-login]");
    for (var i = 0; i < bs.length; i++) {
      bs[i].removeAttribute("data-bdh-hidden");
      bs[i].style.display = "";
    }
  }
  /* doLogout() 会写回旧式登录按钮（.btn-login / onclick=doLogin）⇒ 归一化 */
  function normalizeLogins() {
    var sel = ".header-actions .btn-login,.header-actions .header-btn-login,"
      + ".header-actions a[onclick*='doLogin'],.header-actions button[onclick*='doLogin'],"
      + ".header-actions #login,.header-actions [onclick*='showLoginEntry']";
    var bs = document.querySelectorAll(sel);
    for (var i = 0; i < bs.length; i++) {
      bs[i].setAttribute("data-bdh-login", "");
      bs[i].removeAttribute("onclick");
      bs[i].classList.add("login-link");
    }
  }
  function signIn() {
    if (typeof window.doLogin === "function") { try { window.doLogin(); } catch (e) {} }
    normalizeLogins();
    hideLogins();
    document.body.classList.add("bdh-signed");
    syncAuth();
  }
  function signOut() {
    if (typeof window.doLogout === "function") { try { window.doLogout(); } catch (e) {} }
    normalizeLogins();
    showLogins();
    document.body.classList.remove("bdh-signed");
    syncAuth();
  }
  window.bdhSignIn = signIn;

  /* 包装页面自带登录/登出/重渲染：任何入口登录完都补上「个人中心」 */
  (function () {
    var wrap = function (name, after) {
      var orig = window[name];
      if (typeof orig !== "function") { return; }
      window[name] = function () {
        var r = orig.apply(this, arguments);
        try { after(); } catch (e) {}
        return r;
      };
    };
    wrap("doLogin", function () {
      normalizeLogins(); hideLogins(); document.body.classList.add("bdh-signed"); syncAuth();
    });
    wrap("renderAuthArea", function () { normalizeLogins(); syncAuth(); });
    wrap("doLogout", function () {
      normalizeLogins(); showLogins(); document.body.classList.remove("bdh-signed"); syncAuth();
    });
  })();

  function initAuth() {
    if (SELF) { hideLogins(); }
    normalizeLogins();
    syncAuth();
  }

  /* ---- 委托：登录 / 退出 / 占位提示 / 移动菜单 ---- */
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || !t.closest) { return; }
    var lb = t.closest("[data-bdh-login]");
    if (lb) {
      e.preventDefault();
      /* 门户页把「关闭菜单」挂在 #mobileMenu 上，冒泡时先于本监听执行 ⇒
         不能靠 .open 类判断，改看「点击是否发生在移动菜单内」，
         登录后同步把菜单重新展开，好让用户立刻看到新出现的「个人中心」入口 */
      var menu = document.getElementById("bdhMobileMenu") || document.getElementById("mobileMenu");
      var inMenu = !!(menu && (menu === lb || menu.contains(lb)));
      signIn();
      if (inMenu && menu) {
        setTimeout(function () {
          menu.classList.add("open");
          var tg = document.getElementById("bdhMenuToggle") || document.getElementById("menuToggle");
          if (tg) { tg.setAttribute("aria-expanded", "true"); }
        }, 0);
      }
      return;
    }
    if (t.closest("[data-bdh-logout]")) { e.preventDefault(); signOut(); return; }
    var tt = t.closest("[data-bdh-toast]");
    if (tt) { e.preventDefault(); bdhToast(tt.getAttribute("data-bdh-toast")); return; }
    var m = t.closest("#bdhMenuToggle");
    if (m) {
      var mu = document.getElementById("bdhMobileMenu");
      if (mu) {
        var open = mu.classList.toggle("open");
        m.setAttribute("aria-expanded", open ? "true" : "false");
        m.setAttribute("aria-label", open ? "关闭菜单" : "打开菜单");
      }
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") { return; }
    var menu = document.getElementById("bdhMobileMenu");
    var m = document.getElementById("bdhMenuToggle");
    if (menu && menu.classList.contains("open")) {
      menu.classList.remove("open");
      if (m) { m.setAttribute("aria-expanded", "false"); m.focus(); }
    }
  });

  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", initAuth); }
  else { initAuth(); }
})();
</script>

/* ===== 登录态 ===== */
var LOGGED=false;
/* ===== 0924 角色权限分级（§九 三类业务统一高权限免申请） =====
   数据 / 模型 / 资源 三类走同一套口径：高权限免申请、直接用；低权限需提交申请。
   原型用演示开关切换角色；正式系统由登录态与授权数据判定，不在前端写死。 */
var ROLE='low';
function isHighRole(){return ROLE==='high';}
function roleName(){return isHighRole()?'平台管理员':'张研究员';}
function roleAvatar(){return isHighRole()?'管':'张';}
function requireAuth(){if(!LOGGED){toast('请先登录/入驻平台（受邀制）');return false;}return true;}

/* ===== 申请使用：写入 localStorage，与「数据中心·我的数据授权」联动 ===== */
var AUTH_LS_KEY='LS_AUTH_APPS';
function getApps(){
  try{var a=JSON.parse(localStorage.getItem(AUTH_LS_KEY)||'[]');return Array.isArray(a)?a:[];}catch(e){return [];}
}
function applyZoneAll(zone){
  if(isHighRole()){toast('当前角色已获授权，无需申请');return;}
  if(!requireAuth())return;
  var list=DS.filter(function(d){return d.zone===zone;});
  if(!list.length){toast('该专题暂无数据集');return;}
  var apps=getApps();var added=0;
  list.forEach(function(d){
    var ex=apps.some(function(a){return a.name===d.name&&a.status==='pending';});
    if(!ex){apps.push({appId:'A'+Date.now()+'_'+added,name:d.name,form:d.form,use:'专题批量申请',note:'专题「'+zoneNameOf(zone)+'」批量申请',submittedAt:new Date().toISOString().slice(0,10),status:'pending'});added++;}
  });
  try{localStorage.setItem(AUTH_LS_KEY,JSON.stringify(apps));}catch(e){toast('本地存储不可用，申请未保存');return;}
  toast('已提交专题「'+zoneNameOf(zone)+'」'+added+' 个数据集的使用申请，可在「我的数据授权」查看');
}
function renderAuthArea(){
  var area=document.getElementById('authArea');if(!area)return;
  if(!LOGGED){
    area.innerHTML='<a class="btn-login" data-bdh-login href="javascript:void(0)" onclick="doLogin()">登录</a>'+
      '<a class="btn-brand" href="javascript:void(0)" onclick="portalConsult()">合作咨询</a>';
    if(window.bdhSyncAuth)window.bdhSyncAuth();
    return;
  }
  area.innerHTML='<div class="u-box">'+
    '<span class="u-avatar">'+roleAvatar()+'</span><span class="u-name" onclick="toggleUserMenu()">'+roleName()+'<svg class="u-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>'+
    '<div class="u-menu" id="userMenu">'+
      '<div class="u-mi" onclick="switchRole()">切换为'+(isHighRole()?'低权限科研人员':'高权限（免申请）')+'</div>'+
      '<div class="u-mi" onclick="location.href=\'个人中心-高保真原型.html\'">我的数据授权</div>'+
      '<div class="u-mi" onclick="location.href=\'个人中心-高保真原型.html\'">我的数据</div>'+
      '<div class="u-mi out" onclick="doLogout()">退出登录</div>'+
    '</div></div>';
  if(window.bdhSyncAuth)window.bdhSyncAuth();
}
function doLogin(){
  LOGGED=true;
  renderAuthArea();
  renderAll();
}
function switchRole(){
  ROLE=isHighRole()?'low':'high';
  renderAuthArea();
  renderAll();
  toast(isHighRole()?'已切换为高权限角色：免申请，可直接使用':'已切换为低权限科研人员：需提交申请');
}
function doLogout(){
  LOGGED=false;ROLE='low';
  renderAuthArea();
  renderAll();
  toast('已退出登录');
}
function toggleUserMenu(){var m=document.getElementById('userMenu');if(m)m.classList.toggle('open');}

function refreshFilterCounts(){
  var groups=[
    ['crop',function(d,v){return d.crop&&d.crop.indexOf(v)>=0;}],
    ['form',function(d,v){return d.form===v;}],
    ['year',function(d,v){return String(d.year)===v;}],
    ['region',function(d,v){return d.region===v;}]
  ];
  groups.forEach(function(gp){
    document.querySelectorAll('.fitem[data-g="'+gp[0]+'"]').forEach(function(it){
      var v=it.getAttribute('data-v');
      var c=it.querySelector('.cnt');
      if(c)c.textContent=DS.filter(function(d){return gp[1](d,v);}).length;
    });
  });
}

var state={crop:new Set(),form:new Set(),year:new Set(),region:new Set(),time:new Set(['all'])};
var kw='',mode='grid',sortKey='default',sortDir='desc'; /* sortDir: asc|desc */
var NOW=new Date('2026-07-01T00:00:00'); /* 原型基准时间，演示用 */

function inDays(u,d){
  var t=new Date(u+'T00:00:00');
  return Math.round((NOW-t)/86400000);
}
var LTab='filter';        /* filter | zone */
var activeZone=null;      /* 专题 Tab 单选 */

function switchLTab(t){
  LTab=t;
  document.querySelectorAll('.ltab').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-ltab')===t);});
  document.getElementById('filtersBox').style.display=t==='filter'?'':'none';
  document.getElementById('zonesBox').style.display=t==='zone'?'':'none';
  if(t==='zone')renderZoneList();
  renderAll();
}
function renderZoneList(){
  var box=document.getElementById('zoneList');box.innerHTML='';
  ZONES.forEach(function(z){
    var n=DS.filter(function(d){return d.zone===z.zone;}).length;
    var it=document.createElement('button');
    it.type='button';
    it.className='zitem'+(activeZone===z.zone?' on':'');
    it.innerHTML='<span class="zi">'+zoneIconOf(z.zone)+'</span><span class="zn">'+z.name+'</span><span class="zc">'+n+'</span>';
    it.onclick=function(){
      activeZone=(activeZone===z.zone)?null:z.zone;
      renderZoneList();
      renderAll();
    };
    box.appendChild(it);
  });
}

/* ===== 左栏交互：分组收起 / 区域展开更多 / 更新时间下拉 / 抽屉 ===== */
function toggleGroup(btn){
  var g=btn.closest('.fgroup');
  var col=g.classList.toggle('collapsed');
  btn.setAttribute('aria-expanded',col?'false':'true');
}
function toggleRegionMore(btn){
  var body=document.getElementById('regionBody');
  var open=body.classList.toggle('expanded');
  document.querySelectorAll('#regionBody .more-hide').forEach(function(el){
    el.style.display=open?'flex':'';
  });
  btn.classList.toggle('expanded',open);
  btn.setAttribute('aria-expanded',open?'true':'false');
  btn.childNodes[0].nodeValue=open?'收起':'展开更多';
}
function setTime(v){
  state.time.clear();state.time.add(v||'all');
  renderAll();
}
function openDrawer(open){
  var f=document.getElementById('filterSide'),m=document.getElementById('drawerMask');
  f.classList.toggle('open',!!open);
  m.classList.toggle('open',!!open);
}

/* ===== 过滤 ===== */
function filtered(){
  var arr=[];
  DS.forEach(function(d){
    var ok=true;
    if(LTab==='zone'&&activeZone){ok=ok&&d.zone===activeZone;}
    else{
      ok=ok&&(!state.crop.size||d.crop.some(function(x){return state.crop.has(x);}));
      ok=ok&&(!state.form.size||state.form.has(d.form));
      ok=ok&&(!state.year.size||state.year.has(String(d.year)));
      ok=ok&&(!state.region.size||state.region.has(d.region));
      if(ok&&state.time.size&&!state.time.has('all')){
        var maxD=999999;
        if(state.time.has('30'))maxD=Math.min(maxD,30);
        if(state.time.has('90'))maxD=Math.min(maxD,90);
        if(state.time.has('365'))maxD=Math.min(maxD,365);
        ok=ok&&(inDays(d.upd,NOW)<=maxD);
      }
    }
    if(ok&&kw){var hay=(d.name).toLowerCase();if(hay.indexOf(kw)<0)ok=false;}
    if(ok)arr.push(d);
  });
  var dir=sortDir==='asc'?1:-1;
  if(sortKey==='update')arr.sort(function(a,b){return (a.upd<b.upd?1:(a.upd>b.upd?-1:0))*dir;});
  else if(sortKey==='apply')arr.sort(function(a,b){return (b.apply-a.apply)*dir;});
  return arr;
}

  var v=TT_VAR[form];
  if(v) return '<div class="ds-thumb thumb-tinted"><svg class="tt" viewBox="0 0 288 192" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+v+'</svg></div>';
  return '<div class="ds-thumb thumb-tinted"><svg class="ico-fallback" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+iconPathOf(form)+'</svg></div>';
}
/* 取数据形态的线性图标 path（不含外层 svg 标签），供缩略图降级态复用 */
function iconPathOf(form){
  var m=(ICONS[form]||ICONS['结构化表']).match(/<svg[^>]*>([\s\S]*)<\/svg>/);
  return m?m[1]:(ICONS['结构化表']);
}
/* 卡片元数据行：区域 · 覆盖时间（无覆盖时间字段的退回采集年份，不虚构） */
function fieldsHtml(d){
  var h='<div class="ds-fields">';
  if(d.region)h+='<span class="ff"><span class="k">区域：</span><span class="vv">'+d.region+'</span></span>';
  h+='<span class="ff"><span class="k">覆盖时间：</span><span class="vv">'+d.year+'</span></span>';
  return h+'</div>';
}
/* 元数据标签顺序统一为：专题、区域、数据形态、作物、年份 */
function tagsOf(d){
  var zn=zoneNameOf(d.zone);
  var h='';
  if(zn)h+='<span class="tag">'+zn+'</span>';
  if(d.region)h+='<span class="tag">'+d.region+'</span>';
  h+='<span class="tag">'+d.form+'</span>';
  h+='<span class="tag">'+d.crop.join('/')+'</span><span class="tag">'+d.year+'</span>';
  return h;
}
function metaHtml(d){
  return '<div class="mi">'+
    '<span class="m-item">'+ico(ICONS['calendar'])+'更新 <b>'+d.upd+'</b></span>'+
    '<span class="m-item">'+ico(ICONS['apply'])+'申请 <b>'+d.apply+'</b> 次</span>'+
    '</div>';
}
function actsHtml(){
  var high=isHighRole();
  return '<div class="ds-acts"><button type="button" class="text-link">查看详情'+ico(ICONS['chev'])+'</button>'+
    '<span class="apply-btn" data-act="'+(high?'use':'apply')+'">'+(high?'开始使用':'申请使用')+'</span></div>';
}
function bindClick(row,d){
  row.onclick=function(e){
    if(e&&e.target&&e.target.closest&&e.target.closest('.apply-btn'))return;
    location.href='数据中心-数据集详情.html#n='+encodeURIComponent(d.name);
  };
  var ab=row.querySelector('.apply-btn');
  if(ab)ab.addEventListener('click',function(e){
    e.stopPropagation();
    if(!requireAuth())return;
    location.href='数据中心-数据集详情.html#n='+encodeURIComponent(d.name)+(ab.getAttribute('data-act')==='use'?'&use=1':'&apply=1');
  });
}
function setView(m){
  mode=m;
  document.getElementById('vsGrid').classList.toggle('on',m==='grid');
  document.getElementById('vsList').classList.toggle('on',m==='list');
  document.getElementById('viewGrid').classList.toggle('active',m==='grid');
  document.getElementById('viewList').classList.toggle('active',m==='list');
  renderAll();
}
function renderCtx(){
  var bar=document.getElementById('ctxBar');bar.innerHTML='';
  var conds=[];
  if(activeZone){
    var z=ZONES.filter(function(x){return x.zone===activeZone;})[0];
    conds.push({label:'专题：'+z.name,kind:'zone'});
  }
  if(state.crop.size)state.crop.forEach(function(v){conds.push({label:'作物：'+v,kind:'crop',v:v});});
  if(state.form.size)state.form.forEach(function(v){conds.push({label:'形态：'+v,kind:'form',v:v});});
  if(state.year.size)state.year.forEach(function(v){conds.push({label:'年份：'+v,kind:'year',v:v});});
  if(state.region.size)state.region.forEach(function(v){conds.push({label:'区域：'+v,kind:'region',v:v});});
  if(state.time.size&&!state.time.has('all')){
    var tv=state.time.has('365')?'近一年':(state.time.has('90')?'近90天':(state.time.has('30')?'近30天':''));
    if(tv)conds.push({label:'更新：'+tv,kind:'time'});
  }
  if(kw)conds.push({label:'搜索：'+kw,kind:'kw'});

  if(!conds.length){bar.classList.remove('show');return;}
  bar.classList.add('show');
  var html='<span class="cb-label">已选条件</span>';
  conds.forEach(function(c){
    html+='<span class="ctx-chip" data-k="'+c.kind+'" data-v="'+(c.v||'')+'">'+c.label+'<span class="x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></span></span>';
  });
  /* ⭐0917 「清空」＝全站唯一清空入口（左栏同名按钮已删除），带垃圾桶图标 */
  html+='<span class="ctx-all" onclick="clearAllCond()" title="清空全部筛选与搜索条件">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
    '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/></svg>清空</span>';
  if(activeZone){
    if(!isHighRole()){html+='<span class="ctx-all" onclick="applyZoneAll(\''+activeZone+'\')">申请本专题全部 →</span>';}
  }
  bar.innerHTML=html;
  bar.querySelectorAll('.ctx-chip').forEach(function(ch){
    ch.querySelector('.x').addEventListener('click',function(){
      var k=ch.getAttribute('data-k'),v=ch.getAttribute('data-v');
      if(k==='zone'){activeZone=null;renderZoneList();}
      else if(k==='time'){state.time.clear();state.time.add('all');document.getElementById('timeSel').value='all';}
      else if(k==='kw'){kw='';document.getElementById('kwInput').value='';}
      else if(state[k])state[k].delete(v);
      renderAll();
    });
  });
}
function clearAllCond(){
  activeZone=null;
  Object.keys(state).forEach(function(k){state[k].clear();});
  state.time.add('all');
  kw='';document.getElementById('kwInput').value='';
  document.getElementById('timeSel').value='all';
  document.querySelectorAll('.fitem.on').forEach(function(it){it.classList.remove('on');});
  document.getElementById('ctxBar').classList.remove('show');
  if(LTab==='zone')renderZoneList();
  renderAll();
}
function doSearch(){
  kw=(document.getElementById('kwInput').value||'').trim().toLowerCase();
  renderAll();
}
/* ===== 分页状态 ===== */
var page=1,pageSize=8;
function gotoPage(p){page=p;renderAll();}

function renderAll(){
  var all=filtered(),g=document.getElementById('viewGrid'),l=document.getElementById('viewList');
  renderCtx();
  var totalPages=Math.max(1,Math.ceil(all.length/pageSize));
  if(page>totalPages)page=totalPages;
  var arr=all.slice((page-1)*pageSize,page*pageSize);
  g.innerHTML='';l.innerHTML='';
  arr.forEach(function(d){
    var tg=tagsOf(d);
    var card=document.createElement('article');
    card.className='ds-card';
    card.tabIndex=0;
    card.innerHTML='<div class="ds-top">'+thumbHtml(d)+
      '<div class="ds-hd"><div class="ds-name">'+d.name+'</div>'+
      (d.desc?'<p class="ds-desc">'+d.desc+'</p>':'')+
      '<div class="ds-tags">'+tg+'</div>'+
      fieldsHtml(d)+'</div></div>'+
      '<div class="ds-meta">'+metaHtml(d)+actsHtml()+'</div>';
    bindClick(card,d);
    g.appendChild(card);

    var row=document.createElement('div');
    row.className='ds-row';
    row.innerHTML=thumbHtml(d)+
      '<div class="ds-hd"><div class="ds-name">'+d.name+'</div>'+
      (d.desc?'<p class="ds-desc">'+d.desc+'</p>':'')+
      '<div class="ds-tags">'+tg+'</div></div>'+
      '<div class="ds-right">'+metaHtml(d)+actsHtml()+'</div>';
    bindClick(row,d);
    l.appendChild(row);
  });
  document.getElementById('countText').textContent=all.length;
  document.getElementById('emptyBox').classList.toggle('show',!all.length);
  document.getElementById('viewGrid').style.display=(all.length&&mode==='grid')?'grid':'none';
  document.getElementById('viewList').style.display=(all.length&&mode==='list')?'block':'none';
  renderPager(all.length,totalPages);
}

function renderPager(total,totalPages){
  var p=document.getElementById('pager');p.innerHTML='';
  if(!total){p.classList.remove('show');return;}
  p.classList.add('show');
  var html='<div class="psize">每页'+
    '<select onchange="pageSize=parseInt(this.value);page=1;renderAll()" aria-label="每页条数">'+
      '<option value="8"'+(pageSize===8?' selected':'')+'>8</option>'+
      '<option value="12"'+(pageSize===12?' selected':'')+'>12</option>'+
      '<option value="24"'+(pageSize===24?' selected':'')+'>24</option>'+
    '</select>条</div>';
  html+='<div class="pbtns">';
  html+='<span class="page-btn'+(page<=1?' disabled':'')+'" onclick="if(page>1)gotoPage(page-1)">‹ 上一页</span>';
  for(var i=1;i<=totalPages;i++){
    if(totalPages>7&&i>2&&i<totalPages-1&&Math.abs(i-page)>1){
      if(html.charAt(html.length-1)!=='…')html+='<span class="pg-gap">…</span>';
      continue;
    }
    html+='<span class="page-btn'+(i===page?' on':'')+'" onclick="gotoPage('+i+')">'+i+'</span>';
  }
  html+='<span class="page-btn'+(page>=totalPages?' disabled':'')+'" onclick="if(page<totalPages)gotoPage(page+1)">下一页 ›</span>';
  html+='</div>';
  p.innerHTML=html;
}

/* ===== 排序 / 筛选 ===== */
function toggleSort(e){
  e.stopPropagation();
  var m=document.getElementById('sortMenu');
  var open=m.classList.toggle('open');
  document.getElementById('sortBtn').classList.toggle('open',open);
  document.getElementById('sortBtn').setAttribute('aria-expanded',open?'true':'false');
}
document.addEventListener('click',function(e){
  if(!e.target.closest||!e.target.closest('.sort-wrap')){
    var sm=document.getElementById('sortMenu');
    if(sm){sm.classList.remove('open');document.getElementById('sortBtn').classList.remove('open');}
  }
  if(!e.target.closest||!e.target.closest('.u-box')){var m=document.getElementById('userMenu');if(m)m.classList.remove('open');}
});
function pickSort(e,key,label){
  e.stopPropagation();
  sortKey=key;
  document.getElementById('sortLabel').textContent=label;
  document.querySelectorAll('.sm-item').forEach(function(it){it.classList.toggle('on',it.getAttribute('data-sort')===key);});
  document.getElementById('sortMenu').classList.remove('open');
  document.getElementById('sortBtn').classList.remove('open');
  renderAll();
}
function toggleDir(e){
  if(e)e.stopPropagation();
  if(sortKey==='default'){toast('综合排序无升降方向');return;}
  sortDir=sortDir==='desc'?'asc':'desc';
  document.getElementById('dirArrow').textContent=sortDir==='desc'?'降序':'升序';
  renderAll();
}
document.querySelectorAll('.fitem').forEach(function(it){
  it.addEventListener('click',function(){
    var g=it.getAttribute('data-g'),v=it.getAttribute('data-v');
    if(state[g].has(v)){state[g].delete(v);it.classList.remove('on');}
    else{state[g].add(v);it.classList.add('on');}
    renderAll();
  });
});
refreshFilterCounts();
renderAll();
</script>

ord;background:#f3f7f5;padding:14px}#portalComplete [hidden]{display:none!important}@media(max-width:550px){#portalComplete .pcx-grid{grid-template-columns:1fr}}

<script id="portal-complete-script">
(function(){
 const dialog=document.getElementById('portalComplete');
 const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 window.portalEscape=escape;
 window.portalModal=function(title,body,footer=''){if(dialog.open)dialog.close();dialog.innerHTML='<div class="pcx-head"><h2 id="pcxTitle">'+escape(title)+'</h2><button type="button" data-pcx-close aria-label="关闭">×</button></div><div class="pcx-body">'+body+'</div><div class="pcx-foot">'+footer+'<button type="button" data-pcx-close>关闭</button></div>';dialog.showModal();};
 window.portalClose=()=>dialog.close();
 function records(){try{return JSON.parse(localStorage.getItem('bdh-consultations-v1')||'[]')}catch{return []}}
 window.portalConsultRecords=function(){const items=records();portalModal('咨询与反馈记录','<p class="pcx-note">仅显示当前浏览器保存的原型记录，未发送至平台。</p>'+(items.length?items.map(x=>'<article class="pcx-record"><strong>'+escape(x.kind)+' · '+escape(x.id)+'</strong><p>'+escape(x.description)+'</p><span>'+escape(x.org)+' · '+escape(x.contact)+' · '+escape(x.time)+'</span><p class="pcx-note">已保存 · 待平台对接（演示状态）</p></article>').join(''):'<p>暂无记录。填写咨询或问题反馈后，可在这里查看。</p>'),'<button onclick="portalConsult()">新增咨询</button>');};
 window.portalConsult=function(kind='机构合作'){
 portalModal(kind==='使用问题'?'问题反馈':'合作咨询',`<p class="pcx-note">原型演示：信息仅保存在当前浏览器，不发送真实消息。</p><form id="pcxForm"><div class="pcx-grid"><label>咨询类型 *<select name="kind">${['机构合作','加入平台','私有化部署','API 与订阅','课题咨询','使用问题'].map(x=>`<option ${x===kind?'selected':''}>${x}</option>`).join('')}</select></label><label>单位名称 *<input name="org" required maxlength="80" placeholder="填写单位全称"></label><label>联系人 *<input name="contact" required maxlength="30" placeholder="填写姓名"></label><label>联系电话 / 邮箱 *<input name="reply" required maxlength="100" placeholder="填写可联系的电话或邮箱"></label><label class="full">咨询内容 *<textarea name="description" required minlength="10" maxlength="2000" placeholder="请说明合作方向、业务需求或遇到的问题（至少10字）"></textarea></label></div><p id="pcxError" class="pcx-error" role="alert" hidden></p></form>`,`<button type="button" onclick="portalConsultRecords()">查看记录</button><button type="submit" class="primary" form="pcxForm">提交</button>`);
 const f=document.getElementById('pcxForm');f.onsubmit=function(e){e.preventDefault();const x=Object.fromEntries(new FormData(f));Object.keys(x).forEach(k=>x[k]=x[k].trim());const err=document.getElementById('pcxError');if(!x.org||!x.contact||x.description.length<10||!(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x.reply)||/^\+?[\d\s()\-]{7,25}$/.test(x.reply))){err.hidden=false;err.textContent='请补全单位、联系人、至少10字的内容，并填写有效电话或邮箱。';return;}x.id='ZX-'+Date.now().toString(36).toUpperCase();x.time=new Date().toLocaleString('zh-CN',{hour12:false});try{localStorage.setItem('bdh-consultations-v1',JSON.stringify([x,...records()]));}catch{err.hidden=false;err.textContent='浏览器无法保存，请保留当前表单后重试。';return;}portalModal('提交记录已保存','<div class="pcx-success"><strong>'+escape(x.id)+'</strong><p>'+escape(x.kind)+' · '+escape(x.org)+'</p><p>您的咨询内容与联系方式已记录。</p></div><p class="pcx-note">此为原型演示记录，未发送至平台。可在「联系支持 → 查看咨询记录」再次查看。</p>','<button class="primary" onclick="portalConsultRecords()">查看记录</button>');};};
 window.portalSaveApplication=function(record){const key='bdh-model-applications-v1';try{const list=JSON.parse(localStorage.getItem(key)||'[]');const item={...record,id:'AP-'+Date.now().toString(36).toUpperCase(),date:new Date().toLocaleDateString('sv-SE'),status:'审核中'};localStorage.setItem(key,JSON.stringify([item,...list]));return item;}catch{return null}};
 window.portalApplicationReceipt=function(item){portalModal('申请记录已保存','<div class="pcx-success"><strong>'+escape(item.id)+'</strong><p>'+escape(item.name)+'</p><p>状态：审核中</p></div><p class="pcx-note">原型演示记录保存在当前浏览器，不启动真实审批或分配资源。</p>','<a class="pcx-link" href="个人中心-高保真原型.html#models?tab=applications">查看申请记录</a>');};
 const routes={'首页':'index.html','模型中心':'模型中心-模型列表页（调整）.html','数据中心':'数据中心-数据集列表页.html','科研开发空间':'科研开发空间-交互原型(10).html','课题中心':'课题中心-高保真原型.html','需求中心':'需求中心-高保真原型 (1).html','个人中心':'个人中心-高保真原型.html','关于平台':'关于平台-平台介绍.html'};
 document.addEventListener('click',e=>{const close=e.target.closest('[data-pcx-close]');if(close){dialog.close();return;}const b=e.target.closest('[data-consult],[data-feedback],[data-consult-records],[data-shell],[data-external]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();if(b.hasAttribute('data-consult-records'))portalConsultRecords();else if(b.hasAttribute('data-consult')||b.hasAttribute('data-feedback'))portalConsult(b.hasAttribute('data-feedback')?'使用问题':'机构合作');else{const key=b.dataset.shell||b.dataset.external;if(routes[key])location.href=routes[key];}},true);
 dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
})();
</script>
