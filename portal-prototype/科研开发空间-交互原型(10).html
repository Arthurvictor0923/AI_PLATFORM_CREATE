<script id="bdh-portal-nav-js">
/* 统一一级导航 + 0924 统一登录态（登录后出现「个人中心」入口） */
(function () {
  var CFG = window.__BDH_NAV__ || {};
  var ME = CFG.me || "";
  var SELF = !!CFG.self;

  /* ---- 占位提示兜底：优先复用页面自带的 toast ---- */
  function bdhToast(msg) {
    var f = window.showToast || window.toast;
    if (typeof f === "function") { try { f(msg); return; } catch (e) {} }
    var el = document.getElementById("bdhToast");
    if (!el) {
      el = document.createElement("div");
      el.id = "bdhToast";
      el.style.cssText = "position:fixed;left:50%;bottom:40px;transform:translateX(-50%);padding:10px 20px;"
        + "background:rgba(16,33,58,.92);color:#fff;font-size:14px;border-radius:4px;z-index:600;"
        + "transition:opacity .2s;pointer-events:none;";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = "1";
    clearTimeout(window.__bdhToastTimer);
    window.__bdhToastTimer = setTimeout(function () { el.style.opacity = "0"; }, 2600);
  }
  window.bdhToast = bdhToast;

  /* ================= 统一登录态 ================= */
  function authRoots() {
    var out = [];
    var a = document.querySelector(".header-actions");
    if (a) { out.push(a); }
    var m = document.getElementById("bdhMobileMenu") || document.getElementById("mobileMenu");
    if (m) { out.push(m); }
    return out;
  }
  function visibleLogin(el) { return el.querySelector("[data-bdh-login]:not([data-bdh-hidden])"); }

  function mk(tag, cls, txt) {
    var n = document.createElement(tag);
    n.className = cls;
    if (txt) { n.textContent = txt; }
    return n;
  }
  function mkMe() {
    var a = mk("a", "bdh-me", "个人中心");
    a.setAttribute("data-bdh-me", "");
    a.href = ME;
    return a;
  }
  function mkOut() {
    var b = mk("button", "bdh-logout", "退出");
    b.type = "button";
    b.setAttribute("data-bdh-logout", "");
    return b;
  }
  function mkUser() {
    var s = mk("span", "bdh-user");
    s.setAttribute("data-bdh-user", "");
    s.appendChild(mk("span", "bdh-avatar", "张"));
    s.appendChild(mk("span", "bdh-name", "张研究员"));
    return s;
  }
  function clearMine(el) {
    var ns = el.querySelectorAll("[data-bdh-me],[data-bdh-logout],[data-bdh-user]");
    for (var i = 0; i < ns.length; i++) {
      if (ns[i].parentNode) { ns[i].parentNode.removeChild(ns[i]); }
    }
  }
  function insertAfter(anchor, node) {
    anchor.parentNode.insertBefore(node, anchor.nextSibling);
    return node;
  }
  function syncRoot(el) {
    var mobile = el.classList.contains("mobile-menu");
    if (SELF && !mobile) { return; }                  /* 个人中心页桌面不插自链 */
    if (visibleLogin(el)) { clearMine(el); return; }  /* 未登录 */
    if (el.querySelector("[data-bdh-me]")) { return; }/* 已有入口 */

    /* —— 已登录：补「个人中心」入口 —— */
    var hidden = el.querySelector("[data-bdh-login]");
    var nodes = [mkMe()];
    if (!SELF && hidden) { nodes.push(mkOut()); }     /* 本容器有可复原的登录按钮才给「退出」 */

    if (mobile) {
      var last = hidden;
      if (last) { for (var i = 0; i < nodes.length; i++) { last = insertAfter(last, nodes[i]); } }
      else { for (var k = 0; k < nodes.length; k++) { el.appendChild(nodes[k]); } }
      return;
    }
    var ident = el.querySelector(".u-box, .signed-user, .pc-user, .bdh-user");
    if (!ident) {
      ident = mkUser();
      if (hidden && hidden.parentNode === el) { el.insertBefore(ident, hidden); }
      else { el.insertBefore(ident, el.firstChild); }
    }
    var after = ident;
    for (var j = 0; j < nodes.length; j++) { after = insertAfter(after, nodes[j]); }
  }
  function syncAuth() {
    var roots = authRoots();
    for (var i = 0; i < roots.length; i++) { syncRoot(roots[i]); }
  }
  window.bdhSyncAuth = syncAuth;

  function hideLogins() {
    var bs = document.querySelectorAll("[data-bdh-login]");
    for (var i = 0; i < bs.length; i++) {
      bs[i].setAttribute("data-bdh-hidden", "");
      bs[i].style.display = "none";
    }
  }
  function showLogins() {
    var bs = document.querySelectorAll("[data-bdh-login]");
    for (var i = 0; i < bs.length; i++) {
      bs[i].removeAttribute("data-bdh-hidden");
      bs[i].style.display = "";
    }
  }
  /* doLogout() 会写回旧式登录按钮（.btn-login / onclick=doLogin）⇒ 归一化 */
  function normalizeLogins() {
    var sel = ".header-actions .btn-login,.header-actions .header-btn-login,"
      + ".header-actions a[onclick*='doLogin'],.header-actions button[onclick*='doLogin'],"
      + ".header-actions #login,.header-actions [onclick*='showLoginEntry']";
    var bs = document.querySelectorAll(sel);
    for (var i = 0; i < bs.length; i++) {
      bs[i].setAttribute("data-bdh-login", "");
      bs[i].removeAttribute("onclick");
      bs[i].classList.add("login-link");
    }
  }
  function signIn() {
    if (typeof window.doLogin === "function") { try { window.doLogin(); } catch (e) {} }
    normalizeLogins();
    hideLogins();
    document.body.classList.add("bdh-signed");
    syncAuth();
  }
  function signOut() {
    if (typeof window.doLogout === "function") { try { window.doLogout(); } catch (e) {} }
    normalizeLogins();
    showLogins();
    document.body.classList.remove("bdh-signed");
    syncAuth();
  }
  window.bdhSignIn = signIn;

  /* 包装页面自带登录/登出/重渲染：任何入口登录完都补上「个人中心」 */
  (function () {
    var wrap = function (name, after) {
      var orig = window[name];
      if (typeof orig !== "function") { return; }
      window[name] = function () {
        var r = orig.apply(this, arguments);
        try { after(); } catch (e) {}
        return r;
      };
    };
    wrap("doLogin", function () {
      normalizeLogins(); hideLogins(); document.body.classList.add("bdh-signed"); syncAuth();
    });
    wrap("renderAuthArea", function () { normalizeLogins(); syncAuth(); });
    wrap("doLogout", function () {
      normalizeLogins(); showLogins(); document.body.classList.remove("bdh-signed"); syncAuth();
    });
  })();

  function initAuth() {
    if (SELF) { hideLogins(); }
    normalizeLogins();
    syncAuth();
  }

  /* ---- 委托：登录 / 退出 / 占位提示 / 移动菜单 ---- */
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || !t.closest) { return; }
    var lb = t.closest("[data-bdh-login]");
    if (lb) {
      e.preventDefault();
      /* 门户页把「关闭菜单」挂在 #mobileMenu 上，冒泡时先于本监听执行 ⇒
         不能靠 .open 类判断，改看「点击是否发生在移动菜单内」，
         登录后同步把菜单重新展开，好让用户立刻看到新出现的「个人中心」入口 */
      var menu = document.getElementById("bdhMobileMenu") || document.getElementById("mobileMenu");
      var inMenu = !!(menu && (menu === lb || menu.contains(lb)));
      signIn();
      if (inMenu && menu) {
        setTimeout(function () {
          menu.classList.add("open");
          var tg = document.getElementById("bdhMenuToggle") || document.getElementById("menuToggle");
          if (tg) { tg.setAttribute("aria-expanded", "true"); }
        }, 0);
      }
      return;
    }
    if (t.closest("[data-bdh-logout]")) { e.preventDefault(); signOut(); return; }
    var tt = t.closest("[data-bdh-toast]");
    if (tt) { e.preventDefault(); bdhToast(tt.getAttribute("data-bdh-toast")); return; }
    var m = t.closest("#bdhMenuToggle");
    if (m) {
      var mu = document.getElementById("bdhMobileMenu");
      if (mu) {
        var open = mu.classList.toggle("open");
        m.setAttribute("aria-expanded", open ? "true" : "false");
        m.setAttribute("aria-label", open ? "关闭菜单" : "打开菜单");
      }
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") { return; }
    var menu = document.getElementById("bdhMobileMenu");
    var m = document.getElementById("bdhMenuToggle");
    if (menu && menu.classList.contains("open")) {
      menu.classList.remove("open");
      if (m) { m.setAttribute("aria-expanded", "false"); m.focus(); }
    }
  });

  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", initAuth); }
  else { initAuth(); }
})();

<script>

function effectiveRole(s){return permission==='member'?'成员':s.role}function stateBadge(s){return `<span class="badge ${['开通中','申请中'].includes(s.state)?'amber':s.state==='已归档'?'gray':''}">${s.state}</span>`}function renderCards(){const base=spaces.filter(s=>['可用','开通中','已归档'].includes(s.state)&&(s.state==='已归档')===archived);$('#tabs').innerHTML=['全部','我负责的','我参与的'].map(r=>`<button data-role="${r}" class="${role===r?'selected':''}" aria-pressed="${role===r}">${r}<small>${base.filter(s=>r==='全部'||effectiveRole(s)===(r==='我负责的'?'负责人':'成员')).length}</small></button>`).join('');const filtered=base.filter(s=>(role==='全部'||effectiveRole(s)===(role==='我负责的'?'负责人':'成员'))&&s.name.toLowerCase().includes(query.toLowerCase()));spacePage=Math.max(1,Math.min(spacePage,Math.ceil(filtered.length/pageSize)));$('#cards').innerHTML=filtered.length?filtered.slice((spacePage-1)*pageSize,spacePage*pageSize).map(s=>`<article class="card"><div class="card-title"><h2>${esc(s.name)}</h2><span class="role ${effectiveRole(s)==='成员'?'member':''}">${effectiveRole(s)}</span></div><p class="description">${esc(s.desc)}</p><div class="states"><span><span class="label">空间状态</span>${stateBadge(s)}</span><span><span class="label">实例状态</span><i class="dot ${s.instance==='运行中'?'running':''}"></i>${s.instance}</span></div><div class="line config"><span class="label">实例配置</span>${s.cpu} 核 CPU / ${s.ram} GB 内存 / ${s.storage||200} GB 存储 <small>（成员共享）</small></div><div class="card-bottom"><span class="visit">最近访问：${s.visit}</span><div class="actions">${s.state==='开通中'?`<button class="outline" data-provision="${s.id}" disabled>开通中</button>`:`<button class="primary" data-space="${s.id}">进入空间</button>${s.instance==='运行中'&&s.state==='可用'?`<button class="outline" data-env="${s.id}">进入开发环境</button>`:''}`}</div></div></article>`).join(''):'<div class="empty"><strong>暂无符合条件的科研空间</strong>试试其他角色、名称或归档条件。</div>';$('#list-end').innerHTML=filtered.length?`<span>共 ${filtered.length} 个空间</span><label class="page-size">每页 <select id="space-size" aria-label="空间每页条数">${[3,6,9,12].map(n=>`<option value="${n}" ${n===pageSize?'selected':''}>${n} 条</option>`).join('')}</select></label><button id=space-prev ${spacePage===1?'disabled':''}>上一页</button><span>${spacePage} / ${Math.ceil(filtered.length/pageSize)}</span><button id=space-next ${spacePage===Math.ceil(filtered.length/pageSize)?'disabled':''}>下一页</button>`:'';$('#space-size')?.addEventListener('change',e=>{pageSize=+e.target.value;spacePage=1;renderCards()});$('#space-prev')?.addEventListener('click',()=>{spacePage--;renderCards()});$('#space-next')?.addEventListener('click',()=>{spacePage++;renderCards()});document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;spacePage=1;renderCards()});document.querySelectorAll('[data-space]').forEach(b=>b.onclick=()=>detail(+b.dataset.space));document.querySelectorAll('[data-env]').forEach(b=>b.onclick=()=>environment(+b.dataset.env));$('#apply').hidden=permission==='member'}

function environment(id){const s=spaces.find(x=>x.id===id);if(s.instance!=='运行中'||s.state!=='可用')return;open('进入开发环境',`<div class="modal-body"><div class="detail-section"><h3>${esc(s.name)}</h3><p><span class="dot running"></span>实例运行中 · ${s.cpu} 核 CPU / ${s.ram} GB 内存</p><p>成员共享实例，在各自目录打开 Notebook 开展研究。</p></div><p class="hint">当前为原型演示。正式系统将携带当前用户身份打开已授权的 Notebook 工作界面。</p></div><div class="modal-footer"><button onclick="detail(${id})">查看空间</button><button class="primary" onclick="closeModal()">知道了</button></div>`)}
function stop(id){const s=spaces.find(x=>x.id===id);if(effectiveRole(s)!=='负责人')return;open('停止实例',`<div class="modal-body"><div class="feedback">停止后将中断团队正在运行的任务，请确认成员已保存工作。</div><p>停止实例后，共享文件和成果记录继续保留。</p></div><div class="modal-footer"><button onclick="detail(${id})">取消</button><button class="primary" id="confirm-stop">确认停止</button></div>`);$('#confirm-stop').onclick=()=>{s.instance='已停止';detail(id);toast('实例已停止（演示）')}}function start(id){const s=spaces.find(x=>x.id===id);if(effectiveRole(s)!=='负责人'||s.state!=='可用')return;s.instance='运行中';detail(id);toast('实例已启动（演示）')}

}function syncInstanceStates(){try{const visits=JSON.parse(localStorage.getItem('agri-space-visits')||'{}');for(const s of spaces){if(visits[s.id]){const d=new Date(visits[s.id]);s.visit=Date.now()-visits[s.id]<60000?'刚刚':d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}}}catch{}let all={};try{all=JSON.parse(localStorage.getItem(instanceKey)||'{}')}catch{}for(const s of spaces){const x=all[s.id];if(x){s.state=x.state||s.state;s.instance=x.instance||s.instance;s.compute={...s.compute,...x.compute}}if(!['未开通','准备中','等待算力','启动中','运行中','停止中','已停止','异常'].includes(s.instance))s.instance='已停止';}}
function detailUrl(s,action=''){const c=s.compute||{};const params=new URLSearchParams({id:String(s.id),name:s.name,role:effectiveRole(s),state:s.state,instance:s.instance,cpu:String(s.cpu),ram:String(s.ram),storage:String(s.storage||200),runtime:c.runtime||'',environment:c.detail||'',ide:s.ide||'JupyterLab 4',model:s.model||'',image:c.image||'',systemDisk:String(c.systemDisk||0),team:s.team,allocation:c.allocation||'retained',ready:String(c.ready===true),gpu:c.gpu||'未配置 GPU',error:c.error||'',action,scope:new URLSearchParams(location.search).get('team')||''});return '科研开发空间-详情页(9).html#'+params.toString()}

function detail(id){const s=spaces.find(x=>x.id===id);recordSpaceVisit(id);location.href=detailUrl(s)}
function environment(id){const s=spaces.find(x=>x.id===id);if(s.state!=='可用')return;recordSpaceVisit(id);window.open(detailUrl(s,'enter'),'_blank','noopener')}
const basicRenderCards=renderCards;renderCards=function(){syncInstanceStates();basicRenderCards();document.querySelectorAll('#cards article.card').forEach(card=>{const btn=card.querySelector('[data-space],[data-provision]');if(!btn)return;const id=Number(btn.dataset.space||btn.dataset.provision),s=spaces.find(x=>x.id===id),c=s.compute||{},own=effectiveRole(s)==='负责人',arch=s.state==='已归档';const holder=card.querySelector('.actions');let actions=`<button class="primary" onclick="detail(${id})">${arch?'查看空间':'进入空间'}</button>`,msg='',tone='';if(s.state==='开通中'){actions='<button class="outline" disabled>开通中</button>';msg='正在准备开发环境，开通完成后可进入空间。';}
else if(!arch){if(s.instance==='运行中'&&c.ready){actions+=`<button class="outline" onclick="environment(${id})">进入开发环境</button>`;}
else if(s.instance==='已停止'){if(own)actions+=`<button class="outline" onclick="environment(${id})">启动并进入</button>`;else msg='实例已停止，可联系负责人启动。';}
else if(s.instance==='异常'){msg=c.error;tone='error';if(own)actions+=`<button class="outline" onclick="environment(${id})">重试并进入</button>`;}
else{msg=s.instance==='等待算力'?'当前算力繁忙，正在等待可用资源。':s.instance==='停止中'?'实例正在停止，请稍候。':'正在准备开发环境，文件仍可查看。';actions+='<button class="outline" disabled>'+ (s.instance==='运行中'?'环境准备中':s.instance)+'</button>';}}
else msg=c.allocation==='released'?'研究已结束，计算资源已回收；文件与成果保留。':'研究已结束，文件与成果继续保留。';holder.innerHTML=actions;if(msg){const tip=document.createElement('div');tip.className='instance-tip '+tone;tip.textContent=msg;card.querySelector('.card-bottom').before(tip)}const runtime=document.createElement('div');runtime.className='runtime-line';runtime.textContent=(c.runtime||'Python 3.10 · PyTorch 2.2')+' · '+(c.gpu||'未配置 GPU');card.querySelector('.config').after(runtime);});};
window.addEventListener('pageshow',()=>renderCards());window.addEventListener('storage',e=>{if(e.key===instanceKey)renderCards()});
$('#archive').closest('label').lastChild.textContent=' 已结束的空间';
render();
</script>

 const f=document.getElementById('pcxForm');f.onsubmit=function(e){e.preventDefault();const x=Object.fromEntries(new FormData(f));Object.keys(x).forEach(k=>x[k]=x[k].trim());const err=document.getElementById('pcxError');if(!x.org||!x.contact||x.description.length<10||!(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x.reply)||/^\+?[\d\s()\-]{7,25}$/.test(x.reply))){err.hidden=false;err.textContent='请补全单位、联系人、至少10字的内容，并填写有效电话或邮箱。';return;}x.id='ZX-'+Date.now().toString(36).toUpperCase();x.time=new Date().toLocaleString('zh-CN',{hour12:false});try{localStorage.setItem('bdh-consultations-v1',JSON.stringify([x,...records()]));}catch{err.hidden=false;err.textContent='浏览器无法保存，请保留当前表单后重试。';return;}portalModal('提交记录已保存','<div class="pcx-success"><strong>'+escape(x.id)+'</strong><p>'+escape(x.kind)+' · '+escape(x.org)+'</p><p>您的咨询内容与联系方式已记录。</p></div><p class="pcx-note">此为原型演示记录，未发送至平台。可在「联系支持 → 查看咨询记录」再次查看。</p>','<button class="primary" onclick="portalConsultRecords()">查看记录</button>');};};
 window.portalSaveApplication=function(record){const key='bdh-model-applications-v1';try{const list=JSON.parse(localStorage.getItem(key)||'[]');const item={...record,id:'AP-'+Date.now().toString(36).toUpperCase(),date:new Date().toLocaleDateString('sv-SE'),status:'审核中'};localStorage.setItem(key,JSON.stringify([item,...list]));return item;}catch{return null}};
 window.portalApplicationReceipt=function(item){portalModal('申请记录已保存','<div class="pcx-success"><strong>'+escape(item.id)+'</strong><p>'+escape(item.name)+'</p><p>状态：审核中</p></div><p class="pcx-note">原型演示记录保存在当前浏览器，不启动真实审批或分配资源。</p>','<a class="pcx-link" href="个人中心-高保真原型.html#models?tab=applications">查看申请记录</a>');};
 const routes={'首页':'index.html','模型中心':'模型中心-模型列表页（调整）.html','数据中心':'数据中心-数据集列表页.html','科研开发空间':'科研开发空间-交互原型(10).html','课题中心':'课题中心-高保真原型.html','需求中心':'需求中心-高保真原型 (1).html','个人中心':'个人中心-高保真原型.html','关于平台':'关于平台-平台介绍.html'};
 document.addEventListener('click',e=>{const close=e.target.closest('[data-pcx-close]');if(close){dialog.close();return;}const b=e.target.closest('[data-consult],[data-feedback],[data-consult-records],[data-shell],[data-external]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();if(b.hasAttribute('data-consult-records'))portalConsultRecords();else if(b.hasAttribute('data-consult')||b.hasAttribute('data-feedback'))portalConsult(b.hasAttribute('data-feedback')?'使用问题':'机构合作');else{const key=b.dataset.shell||b.dataset.external;if(routes[key])location.href=routes[key];}},true);
 dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});

<script data-inline-source="portal-access.js">

      .pc-demo,[data-portal-board][hidden],[data-portal-board-area][hidden],#portalBoardDenied[hidden]{display:none!important}
      #portalBoardDenied{max-width:780px;margin:70px auto;padding:48px 24px;text-align:center;background:#fff;border:1px solid #dce7df;border-radius:8px}#portalBoardDenied h1{font-size:23px;color:#174c40}#portalBoardDenied p{margin:16px 0;color:#6d8177}#portalBoardDenied button{padding:10px 18px;border:0;border-radius:5px;background:#005653;color:#fff;cursor:pointer;font:inherit}

    `;document.head.append(previewStyle);
    const preview=document.createElement('aside');preview.id='portalPreview';preview.setAttribute('aria-label','原型预览账号');document.body.append(preview);
    function refreshPreview(){const selected=O.isLogged()?O.current().id:'';preview.innerHTML=`<small>原型演示</small><label>预览账号<select id="otPreviewAccount" aria-label="预览账号">${selected?'':'<option value="" selected disabled>请选择账号</option>'}${O.read().accounts.map(a=>`<option value="${O.escape(a.id)}" ${a.id===selected?'selected':''}>${O.escape(a.name)}${a.kind==='admin'?'':' · '+O.roleLabel(a)}</option>`).join('')}</select></label>`;q('#otPreviewAccount').onchange=ev=>{O.select(ev.target.value);location.reload();};}
    window.PortalPreview={refresh:refreshPreview};
    function syncDashboardAccess(){const allowed=!!O.canViewDashboard();document.querySelectorAll('a[href]').forEach(a=>{if(decodeURIComponent(a.getAttribute('href').split(/[?#]/)[0])===boardFile){a.dataset.portalBoard='';a.hidden=!allowed;}});
      if(O.isLogged()){document.querySelectorAll('[data-bdh-login]').forEach(n=>{n.setAttribute('data-bdh-hidden','');n.style.display='none';});window.bdhSyncAuth?.();document.querySelectorAll('.header-actions .bdh-name,.header-actions .username').forEach(n=>n.textContent=O.current().name);document.querySelectorAll('.header-actions .bdh-avatar,.header-actions .avatar').forEach(n=>n.textContent=O.current().name[0]);}
      if(isBoard){const main=q('#dashboard');if(main){main.dataset.portalBoardArea='';main.hidden=!allowed;}let denied=q('#portalBoardDenied');if(!denied){denied=document.createElement('section');denied.id='portalBoardDenied';denied.innerHTML='<h1>当前账号无数据看板访问权限</h1><p>数据看板仅向已授权的管理员账号开放。</p><button type="button" id="previewDashboardAdmin">以管理员身份预览</button>';main.before(denied);q('#previewDashboardAdmin').onclick=()=>{O.select('u-admin');location.reload();};}denied.hidden=allowed;if(!allowed)q('#detailDrawer')?.close();}
      refreshPreview();
    }
    if(isBoard){['openDrawer','showEntity','openRule','downloadCSV','exportDetail'].forEach(name=>wrap(name,(old,args,ctx)=>{if(!O.canViewDashboard()){notice('当前账号无数据看板访问权限。');return;}return old.apply(ctx,args);}));}
    window.addEventListener('portal-account-change',syncDashboardAccess);window.addEventListener('portal-org-change',refreshPreview);syncDashboardAccess();


    if(window.portalSaveApplication){const old=window.portalSaveApplication;window.portalSaveApplication=rec=>{

      const team=q('#otResearchTeam');if(/科研|开发/.test(rec.purpose||'')){if(!team||!O.canManageTeam(team.value)){notice('请选择本人负责的团队。');return null;}rec={...rec,teamId:team.value};}
      return old({...rec,applicantId:O.current().id,applicant:O.current().name,usageType:/科研|开发/.test(rec.purpose||'')?'research':'online'});
    };}
    function restrictModelForm(){if(O.isLeader()){configureResearch();return;}const form=q('#modelApplyForm')||q('.application-form');if(!form)return;
      form.querySelector('input[name="purpose"][value="research"]')?.closest('label').remove();
      const biz=form.querySelector('input[name="purpose"][value="biz"]');if(biz)biz.checked=true;
      form.querySelector('#researchFields')?.remove();
      form.querySelector('.purpose-hint')?.remove();
      const note=form.querySelector('#applyScopeNote');if(note)note.textContent='获批后在线使用当前模型。';
      form.querySelectorAll('p').forEach(p=>{if(p.textContent.includes('勾选科研研究'))p.textContent='提交后可在个人中心查看模型使用申请。';});
      const title=q('#dialogTitle');if(title)title.textContent='申请使用模型';
    }
    function configureResearch(){const host=q('#researchFields');if(!host||q('#otResearchTeam'))return;const own=O.myTeams().filter(t=>t.ownerId===O.current().id);host.insertAdjacentHTML('afterbegin',`<label>所属团队<select id="otResearchTeam" name="teamId"><option value="">请选择本人负责的团队</option>${own.map(t=>`<option value="${O.escape(t.id)}">${O.escape(t.name)}</option>`).join('')}</select></label>`);if(!own.length){const cb=q('input[name="purpose"][value="research"]');if(cb){cb.disabled=true;cb.closest('label').title='请先创建本人负责的团队';}}}
    if(file.includes('模型中心-模型')&&!file.includes('运行台')){
      ['openApply','openModelAction'].forEach(name=>wrap(name,(old,args,ctx)=>{if(!O.isLogged()){notice('请先登录后申请使用。');return;}const r=old.apply(ctx,args);restrictModelForm();return r;}));
      wrap('submitDemo',(old,args,ctx)=>{if(!O.isLeader()&&q('input[name="purpose"][value="research"]:checked')){notice('成员不能申请模型开发。');return;}return old.apply(ctx,args);});
      const baseTrial=window.startTrial;if(baseTrial)window.startTrial=function(m){
        if(!O.isLogged()){notice('请先登录后试用。');return;}
        const model=typeof m==='object'?m:(typeof CUR!=='undefined'?CUR:null);if(!model)return;

    if(!O.isLeader()&&file==='模型中心-模型详情（调整）.html'){const n=document.querySelector('.auth-note');if(n)n.textContent='试用免审批 · 可申请模型在线使用';}

      }else if(file==='科研开发空间-详情页(9).html'){
        space.role=O.canManageSpace(id)?'负责人':'成员';space.team=O.spaceTeam(id).name;
        window.renderMembers=function(){const t=O.spaceTeam(id);members=O.spaceMembers(id).map(accountId=>{const a=O.account(accountId);return {id:a.id,name:a.name,role:a.id===t.ownerId?'负责人':'成员',note:a.kind==='leader'&&a.id!==t.ownerId?'受邀负责人':'团队协作'};});q('#member-count').textContent=members.length+' 人';q('#members').innerHTML=members.map(m=>`<div class="member-row"><span class="member-avatar">${O.escape(m.name[0])}</span><span class="member-name">${O.escape(m.name)}${m.id===O.current().id?'（我）':''}<small>${m.note}</small></span><span class="role ${m.role==='成员'?'member':''}">${m.role}</span></div>`).join('');};

        window.renderAll();const old=window.renderHeading;window.renderHeading=function(){old();document.querySelectorAll('.heading-meta b').forEach(b=>{if(b.textContent==='张三')b.textContent=O.account(O.spaceTeam(id).ownerId).name;});};window.renderHeading();
      }
    }

  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
