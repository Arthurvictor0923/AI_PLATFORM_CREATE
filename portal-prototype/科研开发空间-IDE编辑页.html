const trainSource=`"""寒地水稻倒伏识别 · 模型训练与验证"""\nfrom pathlib import Path\nimport torch\nfrom torch.utils.data import DataLoader\n\nfrom dataset import RiceLodgingDataset\nfrom model import build_model\nfrom evaluate import evaluate_model\n\n# 挂载的模型与数据目录为只读\nDATA_DIR = Path(${JSON.stringify(dataPath)})\nMODEL_DIR = Path(${JSON.stringify(modelPath)})\nOUTPUT_DIR = Path("/results/validation")\n\nEPOCHS = 8\nBATCH_SIZE = 16\nLEARNING_RATE = 0.0001\nDEVICE = "cuda" if torch.cuda.is_available() else "cpu"\n\ndef train():\n    dataset = RiceLodgingDataset(DATA_DIR / "samples.csv")\n    loader = DataLoader(dataset, batch_size=BATCH_SIZE)\n    model = build_model(MODEL_DIR).to(DEVICE)\n    optimizer = torch.optim.Adam(model.parameters(), lr=LEARNING_RATE)\n\n    for epoch in range(EPOCHS):\n        model.train()\n        for images, targets in loader:\n            images, targets = images.to(DEVICE), targets.to(DEVICE)\n            optimizer.zero_grad()\n            predictions = model(images)\n            loss = model.loss(predictions, targets)\n            loss.backward()\n            optimizer.step()\n        print(f"Epoch {epoch + 1}/{EPOCHS} | loss={loss.item():.4f}")\n\n    OUTPUT_DIR.mkdir(parents=True, exist_ok=True)\n    torch.save(model.state_dict(), OUTPUT_DIR / "model.pt")\n    return evaluate_model(model, dataset, device=DEVICE)\n\nif __name__ == "__main__":\n    train()\n`;

function outputMarkup(c){if(!c.output)return '';let body='';if(c.output==='imports')body=`<pre class="output-pre">计算设备: ${/未配置|^0/.test(ctx.compute.gpu)?'cpu':'cuda'} | PyTorch: 2.2.0</pre>`;else if(c.output==='samples')body=sampleTable(files[dataPath+'/samples.csv']?.content||'sample_id,label\nHLJ_0001,正常')+'<div class="output-note">显示前 5 条样本</div>';else if(c.output==='evaluate')body=metricPlot();else if(c.output==='export')body='<pre class="output-pre">已生成示例结果文件：/results/validation/metrics.csv</pre>';else if(c.output==='modified')body='<pre class="output-pre">代码修改已保留。本地原型未执行这段 Python；连接真实内核后可运行。</pre>';else if(c.output==='interrupted')body='<pre class="output-pre">KeyboardInterrupt：运行预览已中断。</pre>';return `<div class="cell-output"><div class="output-label">${c.output==='modified'?'运行提示':'示例输出'}</div>${body}</div>`}
function renderToolbar(){const f=files[activeFile],nb=f?.type==='notebook';$('#editor-toolbar').innerHTML=f?`<button class="icon-btn" title="保存（Ctrl+S）" onclick="saveWorkspace()" ${f.readonly?'disabled':''}>${icon('save')}</button>${nb?`<button class="icon-btn" title="添加代码单元格" onclick="addCell('code')" ${f.readonly?'disabled':''}>${icon('plus')}</button><div class="toolbar-divider"></div>`:''}<button class="toolbar-label" title="运行（Shift+Enter）" onclick="runActive()" ${f.readonly||running?'disabled':''}>${icon('run')}运行</button>${nb?`<button class="toolbar-label optional" onclick="runAll()" ${running?'disabled':''}>运行全部</button>`:''}<button class="icon-btn" title="中断运行" onclick="interruptRun()" ${running?'':'disabled'}>${icon('stop')}</button><button class="icon-btn optional" title="重启内核" onclick="confirmRestart()">${icon('restart')}</button>${f.readonly?`<span class="read-only-label">${icon('lock')}只读挂载</span>`:''}<div class="kernel-badge"><span id="kernel-label">${esc(ctx.compute.runtime?.split(' · ')[0]||'Python 3.10')}</span><i class="kernel-dot ${running?'busy':''}"></i><span>${running?'运行中':'空闲'}</span></div>`:'<span class="muted" style="color:var(--muted);font-size:11px">选择文件或创建新的研究文件</span>'}
function renderEditor(){renderToolbar();const host=$('#editor-scroll'),f=files[activeFile];if(!f){renderLauncher();return}if(f.type==='notebook'){host.innerHTML=`<div class="notebook"><div class="notebook-title"><div class="eyebrow">RESEARCH NOTEBOOK</div><h1>${esc(f.title||'研究 Notebook')}</h1><p>读取已挂载资源，完成模型验证与实验结果整理。</p><div class="notebook-tags"><span>${esc(ctx.resources.model[0]?.name||'初始模型')}</span><span>${esc(user)} · 个人研究目录</span><span>Python 3</span></div></div>${f.cells.map(c=>`<section class="cell ${c.id===activeCell?'selected':''}" data-cell="${c.id}"><span class="cell-label">[${running?.cell===c.id?'*':c.count??' '}]</span><div class="cell-tools"><button title="运行此单元格" data-cell-run="${c.id}">${icon('run')}</button><button title="向上移动" data-cell-up="${c.id}">${icon('up')}</button><button title="复制单元格" data-cell-copy="${c.id}">${icon('copy')}</button><button title="删除单元格" data-cell-delete="${c.id}">${icon('clear')}</button></div><div class="cell-body">${editableMarkup(c.source,c.id,f.readonly)}</div>${outputMarkup(c)}</section>`).join('')}<button class="notebook-add" onclick="addCell('code')">＋ 添加代码单元格</button></div>`;host.querySelectorAll('[data-cell-run]').forEach(b=>b.onclick=()=>{activeCell=b.dataset.cellRun;runActive()});host.querySelectorAll('[data-cell-delete]').forEach(b=>b.onclick=()=>removeCell(b.dataset.cellDelete));host.querySelectorAll('[data-cell-copy]').forEach(b=>b.onclick=()=>duplicateCell(b.dataset.cellCopy));host.querySelectorAll('[data-cell-up]').forEach(b=>b.onclick=()=>moveCell(b.dataset.cellUp));bindEditors()}else if(f.type==='csv'){host.innerHTML=`<div class="preview-page"><h1>${esc(fileName(activeFile))}${f.readonly?`<span class="read-only-label">${icon('lock')}只读</span>`:''}</h1><p class="sub">${esc(activeFile)}${f.sample?' · 示例数据':''}</p>${sampleTable(f.content)}<p class="output-note">${f.content.split('\n').length-1} 行 · ${f.content.split('\n')[0].split(',').length} 列</p>${!f.readonly?'<button class="recent-file" onclick="edit function addCell(type='code'){const f=files[activeFile];if(!f||f.type!=='notebook'||f.readonly)return;const at=Math.max(0,f.cells.findIndex(c=>c.id===activeCell)+1),c={id:'cell-'+Date.now(),type,source:'',count:null,output:null};f.cells.splice(at,0,c);activeCell=c.id;markDirty(activeFile);renderEditor();setTimeout(()=>document.querySelector(`[data-editor="${c.id}"] textarea`)?.focus(),0)}
function removeCell(id){const f=files[activeFile];if(f.readonly)return;const c=f.cells.find(c=>c.id===id);confirmDialog('删除单元格','删除后将移除该单元格的代码与输出。','删除',()=>{f.cells=f.cells.filter(c=>c.id!==id);activeCell=f.cells[0]?.id;markDirty(activeFile);renderEditor()})}

function renderTree(){let paths=Object.keys(files).filter(p=>!filter||p.toLowerCase().includes(filter.toLowerCase()));const roots=['/research','/results',...new Set(ctx.resources.data.map(r=>r.path.split('/').slice(0,2).join('/'))),...new Set(ctx.resources.model.map(r=>r.path.split('/').slice(0,2).join('/')))];let html='';function branch(parent,depth){const direct=new Set();paths.filter(p=>p.startsWith(parent+'/')).forEach(p=>direct.add(parent+'/'+p.slice(parent.length+1).split('/')[0]));return [...direct].sort((a,b)=>Number(!!files[a])-Number(!!files[b])||a.localeCompare(b)).map(p=>{const file=files[p];if(file)return `<button class="tree-item ${p===activeFile?'current':''}" style="padding-left:${13+depth*13}px" data-tree-file="${esc(p)}">${glyph(p)}<span class="filename">${esc(fileName(p))}</span>${file.readonly?`<span class="tree-lock">${icon('lock')}</span>`:''}</button>`;const expanded=openFolders.has(p)||filter;return `<button class="tree-item" style="padding-left:${7+depth*13}px" data-folder="${esc(p)}"><span class="chevron">${expanded?'⌄':'›'}</span><span class="file-glyph folder">${icon('folder')}</span><span class="filename">${esc(fileName(p))}</span></button>${expanded?branch(p,depth+1):''}`}).join('')}
for(const [i,root]of [...new Set(roots)].entries()){if(!paths.some(p=>p.startsWith(root+'/')))continue;html+=`<div class="tree-section">${root==='/research'?'研究文件':root==='/results'?'团队成果':ctx.resources.model.some(r=>r.path.startsWith(root))?'挂载模型':'挂载数据'}<span class="caption">${i<2?'可读写':'只读'}</span></div><button class="tree-item" style="padding-left:8px" data-folder="${esc(root)}"><span class="chevron">${openFolders.has(root)||filter?'⌄':'›'}</span><span class="file-glyph folder">${icon('folder')}</span>${esc(root.slice(1))}</button>${openFolders.has(root)||filter?branch(root,1):''}`}
$('#file-tree').innerHTML=html||'<div style="padding:15px;color:var(--muted)">未找到匹配文件</div>';$('#file-tree').querySelectorAll('[data-tree-file]').forEach(b=>b.onclick=()=>openFile(b.dataset.treeFile));$('#file-tree').querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{const p=b.dataset.folder;openFolders.has(p)?openFolders.delete(p):openFolders.add(p);renderTree()})}
function renderSidebar(){const titles={files:'文件资源管理器',search:'搜索文件',running:'运行记录',resources:'已挂载资源',members:'协作成员',settings:'环境信息'};$('#side-title').textContent=titles[sideMode];document.querySelectorAll('[data-side]').forEach(b=>b.classList.toggle('active',b.dataset.side===sideMode));const host=$('#sidebar-body');if(sideMode==='files'||sideMode==='search'){host.innerHTML=`<div class="side-toolbar"><button class="icon-btn" title="新建文件" onclick="newFile()">${icon('plus')}</button><button class="icon-btn" title="上传研究文件" onclick="uploadFiles()">${icon('upload')}</button><button class="icon-btn" title="折叠文件夹" onclick="openFolders.clear();renderTree()">${icon('collapse')}</button><span class="side-path">/workspace</span></div><div class="filter-wrap"><input id="file-filter" placeholder="筛选文件…" aria-label="筛选文件" value="${esc(filter)}"></div><div class="tree" id="file-tree"></div>`;$('#file-filter').oninput=e=>{filter=e.target.value;renderTree()};renderTree();if(sideMode==='search')$('#file-filter').focus()}else if(sideMode==='resources'){host.innerHTML=`<div class="side-panel"><h3>模型 · ${ctx.resources.model.length}</h3>${ctx.resources.model.map(r=>`<div class="side-card"><strong>${esc(r.name)}</strong><p>${esc(r.meta||'已挂载')}</p><p>${esc(r.path)}</p><button data-resource-path="${esc(r.path+'/config.json')}">查看模型配置 →</button></div>`).join('')}<h3>数据 · ${ctx.resources.data.length}</h3>${ctx.resources.data.map(r=>`<div class="side-card"><strong>${esc(r.name)}</strong><p>${esc(r.meta||'已挂载')}</p><p>${esc(r.path)}</p><button data-resource-path="${esc(r.path+'/samples.csv')}">预览样本 →</button></div>`).join('')}</div>`;host.querySelectorAll('[data-resource-path]').forEach(b=>b.onclick=()=>openFile(b.dataset.resourcePath))}else if(sideMode==='members'){host.innerHTML=`<div class="side-panel"><h3>${esc(ctx.team)}</h3>${ctx.members.map(m=>`<div class="member"><span class="circle">${esc(m.name[0])}</span><span>${esc(m.name)}${m.name===user?'（我）':''}</span><small>${esc(m.role)}</small></div>`).join('')}<p style="font-size:10px;color:var(--muted);line-height:1.9;margin-top:18px">成员共享实例与团队文件。当前工作目录：${esc(basePath)}</p></div>`}else if(sideMode==='running'){host.innerHTML=`<div class="side-panel"><h3>当前会话</h3><div class="side-card"><strong>${running?'正在运行':'内核空闲'}</strong><p>${running?esc(fileName(running.file)):'没有正在执行的单元格'}</p>${running?'<button onclick="interruptRun()">中断运行</button>':''}</div><h3>最近输出</h3>${logLines.slice(-7).map(x=>`<p style="color:var(--muted);font:10px/1.9 var(--mono);overflow-wrap:anywhere">${esc(x)}</p>`).join('')}</div>`}else host.innerHTML=`<div class="side-panel"><div class="side-card"><strong>${esc(ide)}</strong><p>${esc(ctx.compute.runtime)}</p><p>${esc((ctx.compute.detail||'Ubuntu 22.04').replace(/ · (JupyterLab(?: 4)?|VSCode)/g,'')+' · '+ide)}</p></div><h3>实例配置</h3><div class="side-card"><p>CPU　${ctx.cpu} 核</p><p>内存　${ctx.ram} GB</p><p>GPU　${esc(ctx.compute.gpu)}</p><p>存储　${ctx.storage} GB</p></div><h3>开发镜像</h3><p style="overflow-wrap:anywhere;color:var(--muted)">${esc(ctx.compute.image||'由初始模型匹配')}</p><div class="side-card"><strong>示例内核</strong><p>运行展示预置输出，尚未连接真实算力。</p></div></div>`}

function updateStatus(){$('#kernel-status').textContent=(ctx.compute.runtime?.split(' · ')[0]||'Python 3.10')+' · '+(running?'运行中':'空闲');$('#status-spec').textContent=`${ctx.cpu} 核 CPU / ${ctx.ram} GB 内存`;renderToolbar()}
async function runCell(file,id){const f=files[file],c=f?.cells?.find(c=>c.id===id);if(!c||running)return;const token=++runSerial;running={file,cell:id,token};c.count=null;c.output=null;appendLog('[开始] '+fileName(file)+' / '+id);updateStatus();if(activeFile===file)renderEditor();await new Promise(r=>setTimeout(r,850));if(token!==runSerial)return;const unchanged=builtins[c.id]===c.source;c.count=++execCount;c.output=unchanged?c.id:'modified';if(unchanged&&c.id==='export'){files['/results/validation/metrics.csv']={type:'csv',content:'metric,value\naccuracy,0.943\nprecision,0.928\nrecall,0.916\nf1_score,0.922',readonly:false,sample:true};openFolders.add('/results/validation');markDirty('/results/validation/metrics.csv')}running=null;markDirty(file);appendLog(unchanged?'[完成] 已显示预置示例输出；未执行真实 Python。':'[提示] 修改后的代码已保留，需连接真实内核运行。');updateStatus();if(activeFile===file)renderEditor();renderSidebar()}
function runActive(){const f=files[activeFile];if(!f||f.readonly||running)return;if(f.type==='notebook'){const id=activeCell||f.cells[0]?.id;if(id)runCell(activeFile,id)}else if(f.type==='python')runScript(activeFile);else toast('请选择 Python 文件或 Notebook 单元格运行')}
async function runAll(){const f=files[activeFile];if(f?.type!=='notebook'||running)return;const file=activeFile,ids=f.cells.map(c=>c.id);for(const id of ids){const before=runSerial;await runCell(file,id);if(runSerial!==before+1)break}}
async function runScript(path){if(running)return;const token=++runSerial;running={file:path,token};panelMode='output';togglePanel(true);appendLog('$ python '+path);updateStatus();renderPanel();await new Promise(r=>setTimeout(r,500));if(token!==runSerial)return;if(path!==pyPath||files[path].content!==trainSource){appendLog('[提示] 自定义代码已保留；当前示例内核未执行该文件。')}else{appendLog('[预览] 展示预置训练日志，不消耗真实算力。');for(let i=1;i<=4;i++){await new Promise(r=>setTimeout(r,350));if(token!==runSerial)return;appendLog(`Epoch ${i*2}/8   loss=${[.2314,.1428,.0986,.0724][i-1].toFixed(4)}   val_acc=${[.862,.901,.932,.943][i-1].toFixed(3)}`)}appendLog('[完成] 示例验证准确率：94.3%')};running=null;updateStatus();renderSidebar()}
function interruptRun(){if(!running)return;const old=running;runSerial++;running=null;if(old.cell){const c=files[old.file].cells.find(x=>x.id===old.cell);if(c)c.output='interrupted';markDirty(old.file)}appendLog('[中断] 用户中断了本次运行预览。');updateStatus();renderEditor();renderSidebar()}
function confirmRestart(){confirmDialog('重启内核','重启将清空当前执行计数并中断正在运行的任务，已保存文件不受影响。','重启',()=>{if(running)interruptRun();runSerial++;execCount=0;updateStatus();appendLog('[内核] 示例会话已重启。');toast('内核会话已重启')})}
function renderPanel(){document.querySelectorAll('[data-panel]').forEach(b=>b.classList.toggle('active',b.dataset.panel===panelMode));$('#terminal-name').textContent=panelMode==='terminal'?'bash':panelMode==='output'?'Python':'诊断';const host=$('#panel-content');if(panelMode==='terminal'){host.innerHTML=`<div class="terminal-lines">${terminalLines.map(l=>`<div class="terminal-line ${l.tone||''}">${esc(l.text)}</div>`).join('')}</div><form id="terminal-form" class="terminal-input-row"><label class="terminal-prompt" for="terminal-input">${esc(userFolder)}@research:${esc(terminalCwd)} $</label><input id="terminal-input" aria-label="终端命令" autocomplete="off" spellcheck="false" value="${esc(terminalDraft)}"></form>`;$('#terminal-form').onsubmit=e=>{e.preventDefault();const val=$('#terminal-input').value;terminalDraft='';executeCommand(val)};$('#terminal-input').oninput=e=>terminalDraft=e.target.value;$('#terminal-input').onkeydown=e=>{if(e.key==='ArrowUp'){e.preventDefault();historyIndex=Math.max(0,historyIndex-1);e.target.value=terminalHistory[historyIndex]||''}if(e.key==='ArrowDown'){e.preventDefault();historyIndex=Math.min(terminalHistory.length,historyIndex+1);e.target.value=terminalHistory[historyIndex]||''}}}else if(panelMode==='output')host.innerHTML=`<pre class="run-log">${esc(logLines.join('\n'))}</pre>`;else host.innerHTML=`<div class="empty-panel">${icon('info')}未连接代码诊断服务，当前不提供实时语法检查。</div>`;host.scrollTop=host.scrollHeight}
function resolvePath(p){const arr=(p.startsWith('/')?p:terminalCwd+'/'+p).split('/'),out=[];for(const x of arr){if(!x||x==='.')continue;if(x==='..')out.pop();else out.push(x)}return '/'+out.join('/')}
function executeCommand(command){const cmd=command.trim();if(!cmd)return;terminalHistory.push(cmd);historyIndex=terminalHistory.length;terminalLines.push({text:userFolder+'@research:'+terminalCwd+' $ '+cmd});const [verb,...args]=cmd.split(/\s+/);const path=args.join(' ');if(verb==='clear'){terminalLines=[]}else if(verb==='help'){terminalLines.push({text:'可用：pwd / ls [目录] / cd <目录> / cat <文件> / clear / python train.py\n文件操作在本机原型内预览；Python 显示预置示例输出。',tone:'muted'})}else if(verb==='pwd')terminalLines.push({text:terminalCwd});else if(verb==='ls'){const root=path?resolvePath(path):terminalCwd;const children=[...new Set(Object.keys(files).filter(p=>p.startsWith(root+'/')).map(p=>p.slice(root.length+1).split('/')[0]))];terminalLines.push({text:children.join('  ')||'目录不存在或为空'})}else if(verb==='cd'){const dest=resolvePath(path||basePath);if(Object.keys(files).some(p=>p.startsWith(dest==='/'?'/':dest+'/')))terminalCwd=dest;else terminalLines.push({text:'目录不存在：'+dest})}else if(verb==='cat'){const f=files[resolvePath(path)];terminalLines.push({text:f?.content?.slice(0,6000)||'请选择可读取的文本文件'})}else if(verb==='python'){const p=resolvePath(path);if(files[p]?.type==='python')runScript(p);else terminalLines.push({text:'未找到 Python 文件：'+p})}else terminalLines.push({text:'此命令未在交互原型中执行。输入 help 查看支持的预览操作。',tone:'muted'});renderPanel();if(panelMode==='terminal')$('#terminal-input')?.focus()}
function togglePanel(show=!panelOpen){panelOpen=show;$('#editor-area').classList.toggle('panel-closed',!show)}function selectPanel(mode){panelMode=mode;togglePanel(true);renderPanel()}function clearPanel(){if(panelMode==='terminal')terminalLines=[];else if(panelMode==='output')logLines=[];renderPanel()}

function closeDialog(){$('#dialog').close()}
function confirmDialog(title,text,label,fn){showDialog(title,esc(text),`<button onclick="closeDialog()">取消</button><button class="primary" id="dialog-confirm">${esc(label)}</button>`);$('#dialog-confirm').onclick=()=>{closeDialog();fn()}}
function newFile(type='python'){const ext={python:'.py',notebook:'.ipynb',markdown:'.md'}[type]||'.py';showDialog('新建研究文件',`<label>文件名称<input id="new-filename" value="untitled${ext}" maxlength="80"></label><p>保存目录：${esc(basePath)}</p><p id="new-file-error" style="color:#b86c51"></p>`,`<button onclick="closeDialog()">取消</button><button class="primary" id="create-file">创建</button>`);$('#create-file').onclick=()=>{const name=$('#new-filename').value.trim();if(!name||/[\\/:*?"<>|]/.test(name)){$('#new-file-error').textContent='请输入有效文件名，不包含目录分隔符。';return}const path=basePath+'/'+name;if(files[path]){$('#new-file-error').textContent='同名文件已存在。';return}const isNb=name.endsWith('.ipynb');files[path]=isNb?{type:'notebook',title:name.replace('.ipynb',''),cells:[{id:'cell-'+Date.now(),type:'code',source:'# 开始你的研究\n',output:null,count:null}],readonly:false}:{type:name.endsWith('.py')?'python':name.endsWith('.json')?'json':name.endsWith('.md')?'markdown':'text',content:'',readonly:false};openFolders.add(basePath);closeDialog();markDirty(path);openFile(path)};$('#new-filename').select()}
function uploadFiles(){const input=document.createElement('input');input.type='file';input.multiple=true;input.accept='.py,.md,.txt,.json,.csv,.ipynb';input.onchange=async()=>{let count=0;for(const f of input.files){if(f.size>2*1024*1024){toast('文本预览仅接收 2 MB 以内文件：'+f.name);continue}let name=f.name,n=1;while(files[basePath+'/'+name])name=n+++'_'+f.name;const content=await f.text(),path=basePath+'/'+name;if(name.endsWith('.ipynb')){try{const nb=JSON.parse(content);if(!Array.isArray(nb.cells))throw 0;files[path]={type:'notebook',title:name,cells:nb.cells.filter(c=>c.cell_type==='code').map((c,i)=>({id:'upload-'+Date.now()+'-'+i,type:'code',source:Array.isArray(c.source)?c.source.join(''):String(c.source||''),count:null,output:null})),readonly:false}}catch{toast('Notebook 格式无法识别：'+name);continue}}else files[path]={type:name.endsWith('.py')?'python':name.endsWith('.csv')?'csv':name.endsWith('.json')?'json':name.endsWith('.md')?'markdown':'text',content,readonly:false};markDirty(path);count++}renderSidebar();if(count)toast('已添加 '+count+' 个研究文件到本机草稿')};input.click()}
const menuItems={file:[['新建 Notebook','',()=>newFile('notebook')],['新建 Python 文件','',()=>newFile('python')],['上传研究文件','',uploadFiles],['保存全部','Ctrl S',saveWorkspace],['关闭当前文件','',()=>closeFile(activeFile)],['返回空间详情','',backToSpace]],edit:[['查找文件 / 命令','Ctrl K',showCommands],['添加代码单元格','',()=>addCell('code')],['复制当前单元格','',()=>currentCell()&&duplicateCell(activeCell)],['清空当前输出','',()=>{const c=currentCell();if(c){c.output=null;markDirty(activeFile);renderEditor()}}]],view:[['显示 / 隐藏侧栏','',toggleSidebar],['显示 / 隐藏终端','',()=>togglePanel()],['已挂载资源','',()=>selectSide('resources')],['协作成员','',()=>selectSide('members')],['启动页','',showLauncher]],run:[['运行当前文件 / 单元格','Shift Enter',runActive],['运行全部单元格','',runAll],['中断运行','',interruptRun],['查看运行输出','',()=>selectPanel('output')]],kernel:[['重启内核','',confirmRestart],['环境信息','',environmentInfo],['快捷键与原型说明','',showHelp]]};
function showMenu(key,btn){const host=$('#menu-popup'),same=host.dataset.current===key&&!host.classList.contains('hidden');closeMenus();if(same)return;host.dataset.current=key;host.classList.remove('hidden');host.style.left=btn.offsetLeft+'px';btn.setAttribute('aria-expanded','true');host.innerHTML=menuItems[key].map(([title,shortcut],i)=>`<button data-action="${i}"><span>${esc(title)}</span><small>${esc(shortcut)}</small></button>`).join('');host.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{closeMenus();menuItems[key][+b.dataset.action][2]()})}
function closeMenus(){$('#menu-popup').classList.add('hidden');document.querySelectorAll('[data-menu]').forEach(b=>b.setAttribute('aria-expanded','false'))}
function commandEntries(){return [...Object.keys(files).map(p=>({name:fileName(p),detail:p,action:()=>openFile(p)})),{name:'新建 Notebook',detail:'命令',action:()=>newFile('notebook')},{name:'保存全部',detail:'Ctrl S',action:saveWorkspace},{name:'运行当前单元格',detail:'Shift Enter',action:runActive},{name:'打开终端',detail:'命令',action:()=>selectPanel('terminal')},{name:'查看挂载资源',detail:'命令',action:()=>selectSide('resources')}]}
function showCommands(){$('#command-dialog').showModal();$('#command-search').value='';renderCommands();$('#command-search').focus()}
function renderCommands(){const q=$('#command-search').value.toLowerCase(),items=commandEntries().filter(c=>(c.name+' '+c.detail).toLowerCase().includes(q));$('#command-list').innerHTML=items.map((x,i)=>`<button data-cmd="${i}">${icon('search')}<span>${esc(x.name)}</span><small>${esc(x.detail)}</small></button>`).join('')||'<div style="padding:15px;color:var(--muted)">未找到匹配项</div>';$('#command-list').querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{$('#command-dialog').close();items[+b.dataset.cmd].action()})}
function environmentInfo(){selectSide('settings')}
function showHelp(){showDialog('快捷键与运行说明','<p>Ctrl / ⌘ + S：保存全部文件</p><p>Shift + Enter：运行当前文件或单元格</p><p>Ctrl / ⌘ + K：搜索文件与命令</p><p>Tab：在代码中插入缩进</p><p>这是可交互的界面原型，编辑内容保存在当前浏览器；运行使用预置示例输出，不会执行真实 Python 或连接算力。修改后的代码会明确提示尚未执行。</p>','<button class="primary" onclick="closeDialog()">知道了</button>')}
function backToSpace(){if(dirty.size&&!saveWorkspace(false))return;const q=new URLSearchParams(ctx.returnHash);q.delete('action');q.set('id',spaceId);q.set('ide',ide);q.set('name',ctx.name);q.set('role',ctx.role);q.set('cpu',ctx.cpu);q.set('ram',ctx.ram);q.set('storage',ctx.storage);location.href='科研开发空间-详情页(9).html#'+q.toString()}
function applyTheme(){document.body.classList.toggle('vscode',ide==='VSCode');$('#ide-name').textContent=ide==='VSCode'?'VSCode':'JupyterLab';$('#ide-logo').innerHTML=icon(ide==='VSCode'?'vscode':'notebook');$('#ide-select').value=ide;document.title=ctx.name+' · '+ide;renderTabs();renderEditor()}
$('#ide-select').onchange=e=>{if(running){e.target.value=ide;toast('请先结束当前运行预览，再切换开发工具');return}if(dirty.size&&!saveWorkspace(false)){e.target.value=ide;return}ide=e.target.value;params.set('ide',ide);params.set('id',spaceId);history.replaceState(null,'','#'+params.toString());activeFile=ide==='VSCode'?pyPath:nbPath;if(!openFiles.includes(activeFile))openFiles.push(activeFile);applyTheme();renderSidebar()};
document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=e=>{e.stopPropagation();showMenu(b.dataset.menu,b)});document.addEventListener('click',e=>{if(!e.target.closest('.menubar'))closeMenus()});document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>selectSide(b.dataset.side));document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>selectPanel(b.dataset.panel));$('#command-search').oninput=renderCommands;$('#command-search').onkeydown=e=>{if(e.key==='Enter')$('#command-list button')?.click()};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveWorkspace()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showCommands()}if(e.shiftKey&&e.key==='Enter'&&!$('#dialog').open&&!$('#command-dialog').open){e.preventDefault();runActive()}if(e.key==='Escape')closeMenus()});window.addEventListener('beforeunload',e=>{if(dirty.size&&!saveWorkspace(false)){e.preventDefault();e.returnValue=''}});
$('#space-title').textContent=ctx.name;$('#user-avatar').textContent=user[0];$('#storage-text').textContent='36 GB / '+ctx.storage+' GB';applyTheme();renderSidebar();renderPanel();updateStatus();if(innerWidth<760)$('#workspace').classList.add('side-hidden');
function checkInstance(){const state=readJSON('agri-research-instance-v7',{})[spaceId];const blocked=state&&(state.state==='已归档'||state.instance!=='运行中'||!state.compute?.ready);if(blocked&&!$('#instance-blocked')){if(running)interruptRun();document.body.insertAdjacentHTML('beforeend','<div class="blocked" id="instance-blocked"><article><h1>开发实例当前不可用</h1><p>实例已停止或研究已结束。已编辑的本机草稿保留，可返回空间查看状态。</p><button onclick="backToSpace()">返回空间</button></article></div>')}else if(!blocked)$('#instance-blocked')?.remove()}
checkInstance();window.addEventListener('storage',e=>{if(e.key==='agri-research-instance-v7')checkInstance()});
</script></body></html>
