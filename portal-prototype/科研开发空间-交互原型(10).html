<script id="bdh-portal-nav-js">
/* 统一一级导航 + 0924 统一登录态（登录后出现「个人中心」入口） */
(function () {
  var CFG = window.__BDH_NAV__ || {};
  var ME = CFG.me || "";
  var SELF = !!CFG.self;

  /* ---- 占位提示兜底：优先复用页面自带的 toast ---- */
  function bdhToast(msg) {
    var f = window.showToast || window.toast;
    if (typeof f === "function") { try { f(msg); return; } catch (e) {} }
    var el = document.getElementById("bdhToast");
    if (!el) {
      el = document.createElement("div");
      el.id = "bdhToast";
      el.style.cssText = "position:fixed;left:50%;bottom:40px;transform:translateX(-50%);padding:10px 20px;"
        + "background:rgba(16,33,58,.92);color:#fff;font-size:14px;border-radius:4px;z-index:600;"
        + "transition:opacity .2s;pointer-events:none;";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = "1";
    clearTimeout(window.__bdhToastTimer);
    window.__bdhToastTimer = setTimeout(function () { el.style.opacity = "0"; }, 2600);
  }
  window.bdhToast = bdhToast;

  /* ================= 统一登录态 ================= */
  function authRoots() {
    var out = [];
    var a = document.querySelector(".header-actions");
    if (a) { out.push(a); }
    var m = document.getElementById("bdhMobileMenu") || document.getElementById("mobileMenu");
    if (m) { out.push(m); }
    return out;
  }
  function visibleLogin(el) { return el.querySelector("[data-bdh-login]:not([data-bdh-hidden])"); }

  function mk(tag, cls, txt) {
    var n = document.createElement(tag);
    n.className = cls;
    if (txt) { n.textContent = txt; }
    return n;
  }
  function mkMe() {
    var a = mk("a", "bdh-me", "个人中心");
    a.setAttribute("data-bdh-me", "");
    a.href = ME;
    return a;
  }
  function mkOut() {
    var b = mk("button", "bdh-logout", "退出");
    b.type = "button";
    b.setAttribute("data-bdh-logout", "");
    return b;
  }
  function mkUser() {
    var s = mk("span", "bdh-user");
    s.setAttribute("data-bdh-user", "");
    s.appendChild(mk("span", "bdh-avatar", "张"));
    s.appendChild(mk("span", "bdh-name", "张研究员"));
    return s;
  }
  function clearMine(el) {
    var ns = el.querySelectorAll("[data-bdh-me],[data-bdh-logout],[data-bdh-user]");
    for (var i = 0; i < ns.length; i++) {
      if (ns[i].parentNode) { ns[i].parentNode.removeChild(ns[i]); }
    }
  }
  function insertAfter(anchor, node) {
    anchor.parentNode.insertBefore(node, anchor.nextSibling);
    return node;
  }
  function syncRoot(el) {
    var mobile = el.classList.contains("mobile-menu");
    if (SELF && !mobile) { return; }                  /* 个人中心页桌面不插自链 */
    if (visibleLogin(el)) { clearMine(el); return; }  /* 未登录 */
    if (el.querySelector("[data-bdh-me]")) { return; }/* 已有入口 */

    /* —— 已登录：补「个人中心」入口 —— */
    var hidden = el.querySelector("[data-bdh-login]");
    var nodes = [mkMe()];
    if (!SELF && hidden) { nodes.push(mkOut()); }     /* 本容器有可复原的登录按钮才给「退出」 */

    if (mobile) {
      var last = hidden;
      if (last) { for (var i = 0; i < nodes.length; i++) { last = insertAfter(last, nodes[i]); } }
      else { for (var k = 0; k < nodes.length; k++) { el.appendChild(nodes[k]); } }
      return;
    }
    var ident = el.querySelector(".u-box, .signed-user, .pc-user, .bdh-user");
    if (!ident) {
      ident = mkUser();
      if (hidden && hidden.parentNode === el) { el.insertBefore(ident, hidden); }
      else { el.insertBefore(ident, el.firstChild); }
    }
    var after = ident;
    for (var j = 0; j < nodes.length; j++) { after = insertAfter(after, nodes[j]); }
  }
  function syncAuth() {
    var roots = authRoots();
    for (var i = 0; i < roots.length; i++) { syncRoot(roots[i]); }
  }
  window.bdhSyncAuth = syncAuth;

  function hideLogins() {
    var bs = document.querySelectorAll("[data-bdh-login]");
    for (var i = 0; i < bs.length; i++) {
      bs[i].setAttribute("data-bdh-hidden", "");
      bs[i].style.display = "none";
    }
  }
  function showLogins() {
    var bs = document.querySelectorAll("[data-bdh-login]");
    for (var i = 0; i < bs.length; i++) {
      bs[i].removeAttribute("data-bdh-hidden");
      bs[i].style.display = "";
    }
  }
  /* doLogout() 会写回旧式登录按钮（.btn-login / onclick=doLogin）⇒ 归一化 */
  function normalizeLogins() {
    var sel = ".header-actions .btn-login,.header-actions .header-btn-login,"
      + ".header-actions a[onclick*='doLogin'],.header-actions button[onclick*='doLogin'],"
      + ".header-actions #login,.header-actions [onclick*='showLoginEntry']";
    var bs = document.querySelectorAll(sel);
    for (var i = 0; i < bs.length; i++) {
      bs[i].setAttribute("data-bdh-login", "");
      bs[i].removeAttribute("onclick");
      bs[i].classList.add("login-link");
    }
  }
  function signIn() {
    if (typeof window.doLogin === "function") { try { window.doLogin(); } catch (e) {} }
    normalizeLogins();
    hideLogins();
    document.body.classList.add("bdh-signed");
    syncAuth();
  }
  function signOut() {
    if (typeof window.doLogout === "function") { try { window.doLogout(); } catch (e) {} }
    normalizeLogins();
    showLogins();
    document.body.classList.remove("bdh-signed");
    syncAuth();
  }
  window.bdhSignIn = signIn;

  /* 包装页面自带登录/登出/重渲染：任何入口登录完都补上「个人中心」 */
  (function () {
    var wrap = function (name, after) {
      var orig = window[name];
      if (typeof orig !== "function") { return; }
      window[name] = function () {
        var r = orig.apply(this, arguments);
        try { after(); } catch (e) {}
        return r;
      };
    };
    wrap("doLogin", function () {
      normalizeLogins(); hideLogins(); document.body.classList.add("bdh-signed"); syncAuth();
    });
    wrap("renderAuthArea", function () { normalizeLogins(); syncAuth(); });
    wrap("doLogout", function () {
      normalizeLogins(); showLogins(); document.body.classList.remove("bdh-signed"); syncAuth();
    });
  })();

  function initAuth() {
    if (SELF) { hideLogins(); }
    normalizeLogins();
    syncAuth();
  }

  /* ---- 委托：登录 / 退出 / 占位提示 / 移动菜单 ---- */
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || !t.closest) { return; }
    var lb = t.closest("[data-bdh-login]");
    if (lb) {
      e.preventDefault();
      /* 门户页把「关闭菜单」挂在 #mobileMenu 上，冒泡时先于本监听执行 ⇒
         不能靠 .open 类判断，改看「点击是否发生在移动菜单内」，
         登录后同步把菜单重新展开，好让用户立刻看到新出现的「个人中心」入口 */
      var menu = document.getElementById("bdhMobileMenu") || document.getElementById("mobileMenu");
      var inMenu = !!(menu && (menu === lb || menu.contains(lb)));
      signIn();
      if (inMenu && menu) {
        setTimeout(function () {
          menu.classList.add("open");
          var tg = document.getElementById("bdhMenuToggle") || document.getElementById("menuToggle");
          if (tg) { tg.setAttribute("aria-expanded", "true"); }
        }, 0);
      }
      return;
    }
    if (t.closest("[data-bdh-logout]")) { e.preventDefault(); signOut(); return; }
    var tt = t.closest("[data-bdh-toast]");
    if (tt) { e.preventDefault(); bdhToast(tt.getAttribute("data-bdh-toast")); return; }
    var m = t.closest("#bdhMenuToggle");
    if (m) {
      var mu = document.getElementById("bdhMobileMenu");
      if (mu) {
        var open = mu.classList.toggle("open");
        m.setAttribute("aria-expanded", open ? "true" : "false");
        m.setAttribute("aria-label", open ? "关闭菜单" : "打开菜单");
      }
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") { return; }
    var menu = document.getElementById("bdhMobileMenu");
    var m = document.getElementById("bdhMenuToggle");
    if (menu && menu.classList.contains("open")) {
      menu.classList.remove("open");
      if (m) { m.setAttribute("aria-expanded", "false"); m.focus(); }
    }
  });

  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", initAuth); }
  else { initAuth(); }
})();

  let actions=`<button type="button" class="primary" data-space="${id}">${ended?'查看空间':'进入空间'}</button>`;
  let tip='', tone='';
  if(s.state==='开通中'){
    actions='<button type="button" class="outline" disabled>开通中</button>';
    tip='正在准备开发环境，开通完成后可进入空间。';
  }else if(ended){
    tip=c.allocation==='released'?'研究已结束，计算资源已回收；文件与成果保留。':'研究已结束，文件与成果继续保留。';
  }else{
    if(action)actions+=`<button type="button" class="outline" data-env="${id}">${action}</button>`;
    if(s.instance==='已停止'&&!action)tip='实例已停止，可联系负责人启动。';
    else if(s.instance==='异常'){
      tip=c.error;
      tone='error';
    }else if(!action&&s.instance!=='已停止'){
      tip=s.instance==='等待算力'?'当前算力繁忙，正在等待可用资源。':s.instance==='停止中'?'实例正在停止，请稍候。':'正在准备开发环境，文件仍可查看。';
      actions+=`<button type="button" class="outline" disabled>${s.instance==='运行中'?'环境准备中':esc(s.instance)}</button>`;
    }
  }
  return `<article class="card">
    <div class="card-title"><h2>${esc(s.name)}</h2><span class="role ${s.role==='成员'?'member':''}">${s.role}</span></div>
    <p class="description">${esc(s.desc)}</p>
    <div class="states"><span><span class="label">空间状态</span><span class="badge ${badgeTone}">${esc(s.state)}</span></span><span><span class="label">实例状态</span><i class="dot ${s.instance==='运行中'?'running':''}"></i>${esc(s.instance)}</span></div>
    <div class="line config"><span class="label">实例配置</span>${s.cpu} 核 CPU / ${s.ram} GB 内存 / ${s.storage||200} GB 存储 <small>（成员共享）</small></div>
    <div class="runtime-line">${esc(c.runtime||'Python 3.10 · PyTorch 2.2')} · ${esc(c.gpu||'未配置 GPU')}</div>
    ${tip?`<div class="instance-tip ${tone}">${esc(tip)}</div>`:''}
    <div class="card-bottom"><span class="visit">最近访问：${esc(s.visit)}</span><div class="actions">${actions}</div></div>
  </article>`;
}

function renderCards() {
  const kind=PortalOrg.current().kind;
  const title=kind==='leader'?'我负责的':kind==='member'?'我参与的':'';
  const heading=$('#space-list-title');
  heading.textContent=title;
  heading.hidden=!title;
  $('#apply').hidden=kind!=='leader';

  const needle=query.toLowerCase();
  const filtered=spaces.filter(s=>['可用','开通中','已归档'].includes(s.state)&&
    (s.state==='已归档')===archived&&s.name.toLowerCase().includes(needle));
  const totalPages=Math.max(1,Math.ceil(filtered.length/pageSize));
  spacePage=Math.max(1,Math.min(spacePage,totalPages));
  const empty=!title?'当前账号没有可查看的科研空间':needle?'没有找到符合条件的科研空间':
    archived?'暂无已结束的科研空间':kind==='leader'?'暂无负责的科研空间':'暂无参与的科研空间';
  $('#cards').innerHTML=filtered.length?
    filtered.slice((spacePage-1)*pageSize,spacePage*pageSize).map(renderSpaceCard).join(''):
    `<div class="empty"><strong>${empty}</strong></div>`;
  $('#list-end').innerHTML=filtered.length?`<span>共 ${filtered.length} 个空间</span>
    <label class="page-size">每页 <select id="space-size" aria-label="空间每页条数">${[3,6,9,12].map(n=>`<option value="${n}" ${n===pageSize?'selected':''}>${n} 条</option>`).join('')}</select></label>
    <button type="button" id="space-prev" ${spacePage===1?'disabled':''}>上一页</button>
    <span>${spacePage} / ${totalPages}</span>
    <button type="button" id="space-next" ${spacePage===totalPages?'disabled':''}>下一页</button>`:'';
  $('#space-size')?.addEventListener('change',e=>{pageSize=Number(e.target.value);spacePage=1;renderCards();});
  $('#space-prev')?.addEventListener('click',()=>{spacePage--;renderCards();});
  $('#space-next')?.addEventListener('click',()=>{spacePage++;renderCards();});
}

function render(){renderCards();}
$('#search').oninput=e=>{query=e.target.value;spacePage=1;renderCards();};
$('#archive').onchange=e=>{archived=e.target.checked;spacePage=1;renderCards();};
$('#cards').onclick=e=>{
  const button=e.target.closest('button[data-space],button[data-env]');
  if(!button)return;
  if(button.dataset.space!==undefined)detail(button.dataset.space);
  else environment(button.dataset.env);
};

let timer;
function toast(text) {
  $('#toast').textContent=text;
  $('#toast').classList.remove('hidden');
  clearTimeout(timer);
  timer=setTimeout(()=>$('#toast').classList.add('hidden'),3200);
}
function apply(){window.SpaceRequests?.showForm();}
$('#apply').onclick=apply;

function showLoginEntry(){window.bdhSignIn?.();}
function showConsultEntry(){location.href='合作咨询.html';}

function syncSpaceVisits() {
  try{
    const visits=JSON.parse(localStorage.getItem(visitKey)||'{}');
    for(const s of spaces){
      if(!visits[s.id])continue;
      const date=new Date(visits[s.id]);
      s.visit=Date.now()-date.getTime()<60000?'刚刚':
        date.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
    }
  }catch{}
}
function recordSpaceVisit(id) {
  try{
    const visits=JSON.parse(localStorage.getItem(visitKey)||'{}');
    visits[id]=Date.now();
    localStorage.setItem(visitKey,JSON.stringify(visits));
  }catch{}
}
function detailUrl(s,role,action='') {
  const c=s.compute||{};
  const params=new URLSearchParams({
    id:String(s.id),name:s.name,role,state:s.state,instance:s.instance,cpu:String(s.cpu),ram:String(s.ram),
    storage:String(s.storage||200),runtime:c.runtime||'',environment:c.detail||'',ide:s.ide||'JupyterLab 4',
    model:s.model||'',image:c.image||'',systemDisk:String(c.systemDisk||0),team:s.team,
    allocation:c.allocation||'retained',ready:String(c.ready===true),gpu:c.gpu||'未配置 GPU',
    error:c.error||'',action,scope:new URLSearchParams(location.search).get('team')||''
  });
  return '科研开发空间-详情页(9).html#'+params.toString();
}
function detail(id) {
  const s=spaces.find(s=>String(s.id)===String(id)), role=PortalOrg.spaceRole(id);
  if(!s||!role||!['可用','已归档'].includes(s.state))return;
  recordSpaceVisit(s.id);
  location.href=detailUrl(s,role);
}
function environment(id) {
  const s=spaces.find(s=>String(s.id)===String(id)), role=PortalOrg.spaceRole(id);
  if(!s||!role||!environmentAction(s,role))return;
  recordSpaceVisit(s.id);
  window.open(detailUrl(s,role,'enter'),'_blank','noopener');
}

 const dialog=document.getElementById('portalComplete');

 window.portalConsult=function(kind='机构合作'){

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* 单元格状态标记：以 {{tag}} 开头时渲染为彩色标签

  function cellHTML(c) {
    var s = (c == null ? '' : String(c));
    var m = /^\{\{(\w+)\}\}([\s\S]*)$/.exec(s);
    if (m) return '<span class="mtdev-tag ' + m[1] + '">' + m[2] + '</span>';

  function tableHTML(sec) {

    h += '<thead><tr>';
    sec.head.forEach(function (c) { h += '<th>' + c + '</th>'; });

    sec.rows.forEach(function (r) {
      h += '<tr>';
      r.forEach(function (c) { h += '<td>' + cellHTML(c) + '</td>'; });
      h += '</tr>';
    });
    return h + '</tbody></table></div>' + (sec.note ? '<p class="mtdev-note">' + sec.note + '</p>' : '');
  }

  function renderDrawer(mask, doc, title, tabs, prefix, foot) {
    mask.querySelector('.mtdev-hd b').textContent = title + ' — ' + doc.name;
    var body = mask.querySelector('.mtdev-bd');
    var html = '<div class="mtdev-intro">' + doc.intro + '</div><div class="mtdev-tabs" role="tablist" aria-label="' + title + '">';
    tabs.forEach(function (tab, i) {
      html += '<button type="button" class="mtdev-tab" id="' + prefix + 'Tab' + i + '" role="tab" aria-controls="' + prefix + i + '">' + esc(tab.label) + '</button>';
    });
    html += '</div>';
    tabs.forEach(function (tab, i) {
      html += '<div class="mtdev-tabpane" id="' + prefix + i + '" role="tabpanel" aria-labelledby="' + prefix + 'Tab' + i + '">' + tabBody(tab) + '</div>';
    });
    body.innerHTML = html + (foot || '');

  function selectTab(body, index) {
    body.querySelectorAll('.mtdev-tab').forEach(function (tab, i) {
      tab.classList.toggle('on', i === index);
      tab.setAttribute('aria-selected', String(i === index));
      tab.tabIndex = i === index ? 0 : -1;
    });
    body.querySelectorAll('.mtdev-tabpane').forEach(function (pane, i) {
      pane.style.display = i === index ? '' : 'none';

  function bindTabs(body) {
    var tabs = Array.from(body.querySelectorAll('.mtdev-tab'));
    tabs.forEach(function (tab, index) {
      tab.onclick = function () { selectTab(body, index); };
      tab.onkeydown = function (event) {
        var next = index;
        if (event.key === 'ArrowLeft') next = (index + tabs.length - 1) % tabs.length;
        else if (event.key === 'ArrowRight') next = (index + 1) % tabs.length;
        else if (event.key === 'Home') next = 0;
        else if (event.key === 'End') next = tabs.length - 1;
        else return;
        event.preventDefault();
        selectTab(body, next);
        tabs[next].focus();
      };
    });
    selectTab(body, 0);
    body.scrollTop = 0;
  }


  /* 悬浮按钮组与抽屉头部可拖拽（拖完抑制一次点击，避免误触） */
  function draggable(el, handle, onMove) {
    handle = handle || el;
    var st = null;
    handle.addEventListener('mousedown', function (e) {
      if (e.button !== 0 || (e.target.closest && e.target.closest('.mtdev-x'))) return;
      var r = el.getBoundingClientRect();
      st = { sx: e.clientX, sy: e.clientY, ox: r.left, oy: r.top, w: r.width, h: r.height, moved: false };
      e.preventDefault();
    });
    document.addEventListener('mousemove', function (e) {
      if (!st) return;
      var dx = e.clientX - st.sx, dy = e.clientY - st.sy;
      if (!st.moved && Math.abs(dx) + Math.abs(dy) > 4) st.moved = true;
      if (!st.moved) return;
      if (el.style.position !== 'fixed') {
        el.style.position = 'fixed'; el.style.margin = '0';
        el.style.left = st.ox + 'px'; el.style.top = st.oy + 'px';
        el.style.right = 'auto'; el.style.bottom = 'auto';
      }
      var mx = Math.max(0, window.innerWidth - st.w), my = Math.max(0, window.innerHeight - st.h);
      el.style.left = Math.min(mx, Math.max(0, st.ox + dx)) + 'px';
      el.style.top = Math.min(my, Math.max(0, st.oy + dy)) + 'px';
      if (onMove) onMove();
    });
    document.addEventListener('mouseup', function () {
      if (!st) return;
      if (st.moved) {
        var sup = function (ev) { ev.preventDefault(); ev.stopPropagation(); document.removeEventListener('click', sup, true); };
        document.addEventListener('click', sup, true);
      }
      st = null;
    });
  }

  function inject() {
    if (document.querySelector('.mtdev-group')) return;

    var style = document.createElement('style');
    style.textContent = CSS;
    document.head.appendChild(style);

    var wrap = document.createElement('div');
    wrap.setAttribute('data-devdoc-version', '2026-11-18');
    wrap.innerHTML =
      drawerHTML('mtdevFieldMask', 'mtdevFieldBody', 'mtdevFieldTitle') +
      drawerHTML('mtdevGuideMask', 'mtdevGuideBody', 'mtdevGuideTitle') +
      '<div class="mtdev-group">' +
      '<button class="mtdev-btn field" type="button" aria-haspopup="dialog" aria-controls="mtdevFieldMask">📋 字段说明</button>' +
      '<button class="mtdev-btn guide" type="button" aria-haspopup="dialog" aria-controls="mtdevGuideMask">🧪 交互演示指引</button>' +
      '</div>';
    document.body.appendChild(wrap);
    wrap.addEventListener('click', function (event) { event.stopPropagation(); });

    var group = wrap.querySelector('.mtdev-group');
    var fieldMask = wrap.querySelector('#mtdevFieldMask');
    var guideMask = wrap.querySelector('#mtdevGuideMask');
    var activeMask, opener;

    renderDrawer(fieldMask, doc, '📋 字段说明', doc.field, 'mtdevF');
    renderDrawer(guideMask, doc, '🧪 交互演示指引', doc.guide, 'mtdevG');

    function close() {
      if (!activeMask) return;
      activeMask.classList.remove('on');
      activeMask = null;
      if (opener && opener.isConnected) opener.focus({ preventScroll: true });
      opener = null;
    }

    function attach(mask, trigger) {
      trigger.onclick = function () {
        close();
        opener = trigger;
        activeMask = mask;
        var body = mask.querySelector('.mtdev-bd');
        selectTab(body, 0);
        body.scrollTop = 0;
        mask.classList.add('on');
        mask.querySelector('.mtdev-x').focus({ preventScroll: true });
      };
      mask.querySelector('.mtdev-x').onclick = close;
      mask.onclick = function (event) { if (event.target === mask) close(); };
      mask.onkeydown = function (event) {
        if (event.key !== 'Tab') return;
        var first = mask.querySelector('.mtdev-x');
        var last = mask.querySelector('.mtdev-tab.on');
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      };
      draggable(mask.querySelector('.mtdev-drawer'), mask.querySelector('.mtdev-hd'));

    attach(fieldMask, group.querySelector('.mtdev-btn.field'));

      if(isBoard){const main=q('#dashboard');if(main){main.dataset.portalBoardArea='';main.hidden=!allowed;}let denied=q('#portalBoardDenied');if(!denied){denied=document.createElement('section');denied.id='portalBoardDenied';denied.innerHTML='<h1>当前账号无数据看板访问权限</h1><p>数据看板向已获授权的账号开放。</p><button type="button" id="previewDashboardAdmin">以管理员身份预览</button>';main.before(denied);q('#previewDashboardAdmin').onclick=()=>{O.select('u-admin');location.reload();};}denied.hidden=allowed;if(!allowed)q('#detailDrawer')?.close();}
      refreshPreview();
    }
    if(isBoard){['openDrawer','showEntity','openRule','downloadCSV','exportDetail'].forEach(name=>wrap(name,(old,args,ctx)=>{if(!O.canViewDashboard()||(['downloadCSV','exportDetail'].includes(name)&&PrototypeAccounts.portalCode()!=='R1')){notice('当前账号没有此看板操作权限。');return;}return old.apply(ctx,args);}));}
    window.addEventListener('portal-account-change',syncDashboardAccess);window.addEventListener('portal-org-change',refreshPreview);syncDashboardAccess();


    if(window.portalSaveApplication){const old=window.portalSaveApplication;window.portalSaveApplication=rec=>{
      if(!O.isLogged()){notice('请先登录。');return null;}
      if(!O.isLeader()&&(/科研|开发/.test(rec.purpose||'')||rec.space)){notice('成员仅可申请模型在线使用，不能申请开发或科研空间。');return null;}
      const team=q('#otResearchTeam');if(/科研|开发/.test(rec.purpose||'')){if(!team||!O.canManageTeam(team.value)){notice('请选择本人负责的团队。');return null;}rec={...rec,teamId:team.value};}
      return old({...rec,applicantId:O.current().id,applicant:O.current().name,usageType:/科研|开发/.test(rec.purpose||'')?'research':'online'});
    };}
    function restrictModelForm(){if(O.isLeader()){configureResearch();return;}const form=q('#modelApplyForm')||q('.application-form');if(!form)return;
      form.querySelector('input[name="purpose"][value="research"]')?.closest('label').remove();
      const biz=form.querySelector('input[name="purpose"][value="biz"]');if(biz)biz.checked=true;
      form.querySelector('#researchFields')?.remove();
      form.querySelector('.purpose-hint')?.remove();
      const note=form.querySelector('#applyScopeNote');if(note)note.textContent='获批后在线使用当前模型。';
      form.querySelectorAll('p').forEach(p=>{if(p.textContent.includes('勾选科研研究'))p.textContent='提交后可在个人中心查看模型使用申请。';});
      const title=q('#dialogTitle');if(title)title.textContent='申请使用模型';
    }
    function configureResearch(){const host=q('#researchFields');if(!host||q('#otResearchTeam'))return;const own=O.myTeams().filter(t=>t.ownerId===O.current().id);host.insertAdjacentHTML('afterbegin',`<label>所属团队<select id="otResearchTeam" name="teamId"><option value="">请选择本人负责的团队</option>${own.map(t=>`<option value="${O.escape(t.id)}">${O.escape(t.name)}</option>`).join('')}</select></label>`);if(!own.length){const cb=q('input[name="purpose"][value="research"]');if(cb){cb.disabled=true;cb.closest('label').title='请先创建本人负责的团队';}}}
    if(file.includes('模型中心-模型')&&!file.includes('运行台')){
      ['openApply','openModelAction'].forEach(name=>wrap(name,(old,args,ctx)=>{if(!O.isLogged()){notice('请先登录后申请使用。');return;}const r=old.apply(ctx,args);restrictModelForm();return r;}));
      wrap('submitDemo',(old,args,ctx)=>{if(!O.isLeader()&&q('input[name="purpose"][value="research"]:checked')){notice('成员不能申请模型开发。');return;}return old.apply(ctx,args);});
      const baseTrial=window.startTrial;if(baseTrial)window.startTrial=function(m){
        if(!O.isLogged()){notice('请先登录后试用。');return;}
        const model=typeof m==='object'?m:(typeof CUR!=='undefined'?CUR:null);if(!model)return;
        if(typeof svcUnpublished==='function'&&svcUnpublished(model)){notice(typeof SVC_MSG!=='undefined'?SVC_MSG:'当前模型暂不可用');return;}
        location.href='模型中心-模型运行台.html?mode=trial#n='+encodeURIComponent(model.name);
      };
    }
    if(!O.isLeader()&&file==='模型中心-模型详情（调整）.html'){const n=document.querySelector('.auth-note');if(n)n.textContent='试用免审批 · 可申请模型在线使用';}
    if(file==='模型中心-模型运行台.html'){
      const trial=new URLSearchParams(location.search).get('mode')==='trial';
      wrap('lockReason',(old,args,ctx)=>{
        if(!O.isLogged())return '请先登录';
        if(typeof isCurVer==='function'&&!isCurVer(CUR))return '历史版本不支持运行';
        if(trial)return '';
        let rows=[];try{rows=JSON.parse(localStorage.getItem('bdh-model-applications-v1')||'[]');}catch{}
        const authorized=rows.some(r=>(r.applicantId||'u-zhang')===O.current().id&&r.name===CUR.name&&['已通过','approved'].includes(r.status));
        return authorized?'':'当前模型尚未取得在线使用授权';
      });
      if(typeof DEMO_AUTH!=='undefined')DEMO_AUTH=trial;
      window.renderAll?.();window.syncLock?.();prune();
    }
    if(file.startsWith('数据中心')){
      wrap('renderCtx',(old,args,ctx)=>{const r=old.apply(ctx,args);if(!O.isLeader()||PrototypeAccounts.grant('data')!=='review')document.querySelectorAll('[onclick*="applyZoneAll"]').forEach(n=>n.remove());return r;});window.renderCtx?.();window.renderAll?.();prune();
      if(!O.isLeader()){
        document.querySelectorAll('[onclick*="applyZoneAll"]').forEach(b=>{b.disabled=true;b.title='数据由负责人为科研空间申请';});
        wrap('renderZoneList',(old,args,ctx)=>{const r=old.apply(ctx,args);document.querySelectorAll('[onclick*="applyZoneAll"]').forEach(b=>{b.disabled=true;b.title='数据由负责人为科研空间申请';});return r;});
      }
      if(typeof applyBtnHtml==='function'){wrap('applyBtnHtml',(old,args,ctx)=>O.isLeader()&&PrototypeAccounts.grant('data')!=='deny'?old.apply(ctx,args):'');window.renderHeadRight?.();prune();}
    }
    if(file==='科研开发空间-详情页(9).html'||file==='科研开发空间-IDE编辑页.html'){
      const id=(new URLSearchParams(location.search).get('id')||new URLSearchParams(location.hash.replace(/^#/,'')).get('id')||'1');
      const role=O.spaceRole(id);
      if(!role){
        const main=document.querySelector('main')||document.querySelector('.app');if(main)main.innerHTML='<section style="padding:72px;text-align:center;background:white"><h2>当前账号无权访问该科研空间</h2><p style="margin:18px">请从已加入团队的科研空间进入。</p><a href="个人中心-高保真原型.html#teams">返回我的团队</a></section>';
        ['renderAll','enterEnvironment','openFile','submitResult','mountResources','manageMembers','archiveSpace','startInstance','stopInstance','submitRun'].forEach(name=>{if(typeof window[name]==='function')window[name]=()=>notice('当前账号无权访问该科研空间。');});
      }else if(file==='科研开发空间-详情页(9).html'){
        space.role=role;space.team=O.spaceTeam(id).name;
        window.renderMembers=function(){const t=O.spaceTeam(id);members=O.spaceMembers(id).map(accountId=>{const a=O.account(accountId);return {id:a.id,name:a.name,role:a.id===t.ownerId?'负责人':'成员',note:'团队协作'};});q('#member-count').textContent=members.length+' 人';q('#members').innerHTML=members.map(m=>`<div class="member-row"><span class="member-avatar">${O.escape(m.name[0])}</span><span class="member-name">${O.escape(m.name)}${m.id===O.current().id?'（我）':''}<small>${m.note}</small></span><span class="role ${m.role==='成员'?'member':''}">${m.role}</span></div>`).join('');};
        window.manageMembers=function(){if(!O.canManageSpace(id)||!canManage())return;const t=O.spaceTeam(id),selected=O.spaceMembers(id);openDialog('管理协作成员',`<form id="otSpaceMembers"><div class="modal-body"><p class="hint">从本团队成员中选择科研空间协作人员。</p>${O.spaceMembers(id,true).map(accountId=>{const a=O.account(accountId);return `<label class="file-choice"><input type="checkbox" name="memberIds" value="${O.escape(a.id)}" ${selected.includes(a.id)?'checked':''} ${a.id===t.ownerId?'disabled':''}>${O.escape(a.name)}${a.id===t.ownerId?' · 团队负责人':''}</label>`;}).join('')}</div>${formFooter('保存成员')}</form>`);q('#otSpaceMembers').onsubmit=ev=>{ev.preventDefault();try{O.setSpaceMembers(id,new FormData(ev.target).getAll('memberIds'));closeModal();window.renderMembers();notice('空间成员已保存');}catch(e){notice(e.message);}};};
        window.renderAll();const old=window.renderHeading;window.renderHeading=function(){old();document.querySelectorAll('.heading-meta b').forEach(b=>{if(b.textContent==='张三')b.textContent=O.account(O.spaceTeam(id).ownerId).name;});};window.renderHeading();
      }
    }

  }

})();
