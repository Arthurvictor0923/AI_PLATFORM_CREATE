<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模型运行台 — 北大荒智慧农业协同创新平台</title>
<!--
⭐2026-09-15 变更（按《看板取数溯源与业务闭环检查》断点清单，只改断点涉及条目，未动皮肤）：
   · B3 密钥生成节点：SPEC「鉴权」「限流与配额」写明"审批通过 → 系统自动签发个人密钥 + 生效默认配额"；
     权限带「未授权」提示补开通节点、「已授权」提示补密钥查看位置；
   · B4 调用计量口径：权限带写明"本页运行计入被调用次数（热度）、不占用 API 配额"，与详情页口径一致；
   · 悬空引用修正：运行失败提示原指向已移出的"试用区"，改指本页「可调参数」面板。
模型中心 · 模型运行台 v1.0（2026-09-10）
【定位（用户拍板）】原「模型详情页 · 在线试用 Tab」与「个人中心 · 我的试用任务承接页」是同一件事的两半，
  本页把两者合并为**一个运行台**：
    左列 = 运行记录（该用户在该模型下的历次运行）｜右主区 = 选中那条运行的内容｜底部 = 输入区（控件由该模型入参 schema 决定）。
【状态机（唯一一套）】同步运行只是"耗时极短的异步运行"（排队/处理中几乎瞬间跳过），不写两条代码路径；
  提交即写入运行记录（localStorage，键沿用 dsh_trial_tasks_v1）——**同步运行也落库，关页不丢**；
  页面刷新时会继续推进未完成的运行（running 记录自动续跑）。
【左列命名口径】标题用「运行记录」、左列顶部是全页唯一的新建按钮（文案＝「+ 新建」＋运行/对话）；**仅当模型是文本问答类才叫"对话"**——
  本项目 14 个模型都不是多轮对话模型，故脚本里保留 CHAT_MODELS=[]（空数组），左列标题与按钮文案按它判断。
【按用户隔离】原型统一用张研究员一个账号：localStorage 承担"某个用户的运行记录"，
  账号维度的隔离在真实系统中由登录态决定，本页只演示口径（左列底部有明示）。
【入口】模型中心卡片/详情页 → ?n=<模型名>（本次不改任何入口文件）；?v=<版本号> 直达历史版本（只读）。
【权限演示】照搬模型详情页机制：LOGGED / DEMO_AUTH 两个演示开关 +
  「演示：模拟授权通过 / 回到未授权态」；历史版本只读（不支持试用与运行）。
【v1.1 修正（2026-09-10 · 用户过目后 4 条）】
  ① 全高应用外壳：body 100vh + overflow:hidden，header/面包屑/页头信息条不滚动，
     .bench 吃掉剩余高度 → 左列 .rec-list 内部滚动、右区 .bmain-bd 内部滚动、
     #inputArea 固定在右区最下沿（flex:0 0 auto）——整页不出现纵向滚动。
  ② 面包屑改为平级正确写法「模型中心 / <模型名> / 运行台」（原写法把"首页"摆在最前，属上下级假层级；首页与模型中心本是平级一级导航项）。
  ③ 右区标题行去重：删除右区标题行的两个按钮（模型说明跳转、新建入口——新建入口只留左列那一处）；模型名改为内联下拉框（14 个模型，切换走 ?n= 深链）。
  ④ 运行台不做"申请"：权限带未授权态删除申请按钮，只留一句提示文字 + 一个纯导航链接「前往模型详情页」；未登录态只提示登录（页头已有登录入口）。
     该申请动作只在模型详情页发生。原「演示：模拟授权通过 / 回到未授权态」开关保留。
【v1.2 比例修正（2026-09-10 · 用户反馈「运行记录框小一点、输出区放大；输入区不该占那么高」）】
  ① 左列 300 → 220px；记录项文字一律单行截断 + title 兜底，不换行、不挤压。
  ② 底部输入区 44vh（418px）→ 148px 紧凑结构：状态条（原面板标题行 + 权限带合并为一行）
     + 行1（左＝文件区横向排列、右＝参数 label 内联横向排列 + 换行）+ 行2（左＝提示、右＝主按钮）。
     参数不折叠、不隐藏：最多两行全展开，第 3 行起 #paramBody 内部滚动。
  ③ 右区输出 .bmain-bd 吃掉全部剩余高度（1440×950 ≈472px、1280×800 ≈322px）。
  ④ 面包屑 / 右区标题行（无按钮 + 模型下拉 + 版本芯片 + 状态芯片）/ ?n= ?v= ?run= 深链逻辑均未改动。
     全部行高用显式 px + nowrap/ellipsis，与字体度量无关，故高度是确定值；两档视口均无页面级纵向滚动。
【原型基准时间 NOW=2026-07-01】运行号沿用 TRY-2026-0701-00NN 格式，**新运行用 0100+ 段**避免与现有 mock 冲突。
【单文件】内联 CSS/JS、零外部依赖、全中文；未实现动作一律 toast('…（占位）')。
【复用来源】壳（header/顶部导航/面包屑/页脚/toast/CSS 变量与公共类）+ 结果渲染 6 形态 + MD/VERS/SPEC
  自 `模型中心-模型详情.html`；状态芯片 5 色与空态自 `个人中心-我的运行记录.html`（现名「我的运行记录」）；
  时间线 / 文件清单 / 参数表 / 结果区分流的样式口径沿原「个人中心-试用任务详情」承接页（该页已于 v1.5 收敛为跳转桩）。
-->
<style>
/* ===== 一、V7 壳与结果渲染公共类（自 模型中心-模型详情.html 原样注入） ===== */
:root{
  /* —— 设计变量（对齐《数据中心三类页面前端样式规范》V1.0）—— */
  --brand:#005653; --brand-hover:#004542;
  --brand-soft:#edf6f2; --page-bg:#f4f8f5;
  --surface:#fff; --text:#10213a;
  --text-secondary:#526078; --text-muted:#6b778c;
  --border:#dce5e9; --footer-bg:#00504e;
  --error:#b42318; --disabled-bg:#f1f3f5;
  --radius-sm:4px; --radius-md:8px;
  --control-height:36px; --header-height:64px;
  --content-max:1800px; --layout-gap:16px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --shadow:0 2px 8px rgba(16,33,58,.06);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --font-serif:"Source Han Serif SC","Noto Serif SC","STSong","SimSun",serif;
  /* —— 旧变量名保留为别名，避免页面内既有引用断链（值已换为规范色）—— */
  --blue:var(--brand); --blue-hover:var(--brand-hover); --blue-active:#004542;
  --gold:#927021;
  --bg:var(--surface); --band:var(--page-bg); --card:var(--surface);
  --line:var(--border); --line-strong:var(--border);
  --t1:var(--text); --t2:var(--text-secondary); --t3:var(--text-muted);
  --warn:var(--error); --ok:#2e7d5b;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-ui);font-size:15px;line-height:1.65;color:var(--text);background:var(--page-bg);-webkit-font-smoothing:antialiased;}
a{color:var(--blue-hover);text-decoration:none;transition:color .2s;} a:hover{color:var(--blue);text-decoration:underline;}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;}


/* ==================== 公共头尾（对齐数据中心规范 V1.0） ==================== */
.container{width:100%;max-width:var(--content-max);margin:0 auto;padding:0 clamp(24px,3.65vw,56px);}
.site-header{position:sticky;top:0;z-index:100;height:var(--header-height);background:var(--surface);border-bottom:1px solid var(--border);}
.header-inner{display:flex;align-items:center;gap:var(--s5);height:var(--header-height);}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand span{font-size:22px;line-height:30px;font-weight:600;color:var(--text);white-space:nowrap;}
.main-nav{display:flex;align-items:center;height:var(--header-height);margin-left:var(--s4);flex:1;min-width:0;overflow:hidden;}
.main-nav a,.main-nav button{position:relative;display:inline-flex;align-items:center;height:var(--header-height);padding:0 16px;font-size:14px;line-height:22px;color:var(--text-secondary);white-space:nowrap;background:none;border:0;cursor:pointer;transition:color .2s;}
.main-nav a:hover,.main-nav button:hover{color:var(--brand);}
.main-nav .active{color:var(--brand);font-weight:600;}
.main-nav .active::after{content:'';position:absolute;left:16px;right:16px;bottom:-1px;height:3px;border-radius:var(--radius-sm) 2px 0 0;background:var(--brand);}
.header-actions{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.btn-login{display:inline-flex;align-items:center;justify-content:center;height:var(--control-height);padding:0 16px;font-size:14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text);white-space:nowrap;transition:all .2s;}
.btn-login:hover{color:var(--brand);border-color:var(--brand);}
.btn-brand{display:inline-flex;align-items:center;justify-content:center;height:var(--control-height);padding:0 16px;font-size:14px;font-weight:500;border-radius:var(--radius-sm);background:var(--brand);color:#fff;white-space:nowrap;transition:background .2s;}
.btn-brand:hover{background:var(--brand-hover);color:#fff;}
/* 登录态 */
.u-box{display:flex;align-items:center;gap:8px;position:relative;}
.u-avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.u-name{font-size:14px;color:var(--text);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;}
.u-name .u-chev{width:13px;height:13px;color:var(--text-muted);}
.u-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:176px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:var(--s1);z-index:200;}
.u-menu.open{display:block;}
.u-mi{display:block;padding:8px 12px;font-size:14px;color:var(--text-secondary);border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;}
.u-mi:hover{background:var(--brand-soft);color:var(--brand);}
.u-mi.out{color:var(--error);}
.u-mi.out:hover{background:#fdf6f4;color:var(--error);}

/* 页脚（四区：品牌 / 平台资源 / 关于平台 / 书法标语） */
.site-footer{position:relative;background:var(--footer-bg);color:rgba(255,255,255,.78);overflow:hidden;margin-top:var(--s6);}
.footer-inner{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,38fr) minmax(0,15fr) minmax(0,19fr) minmax(0,28fr);gap:var(--s4);min-height:140px;padding:28px 0;}
.f-brand{display:flex;align-items:flex-start;gap:12px;min-width:0;}
.f-brand .f-logo{flex-shrink:0;}
.f-brand .f-name{font-size:18px;line-height:26px;font-weight:600;color:#fff;}
.f-brand .f-desc{margin-top:4px;font-size:12px;line-height:20px;color:rgba(255,255,255,.7);}
.f-col h4{font-size:14px;line-height:22px;font-weight:600;color:#fff;margin-bottom:var(--s2);}
.f-col a{display:block;font-size:13px;line-height:22px;color:rgba(255,255,255,.78);margin-bottom:6px;}
.f-col a:hover{color:#fff;text-decoration:underline;}
.f-about-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--s5);}
.f-slogan{display:flex;align-items:center;justify-content:flex-end;gap:var(--s5);}
.f-slogan .divider{width:1px;height:56px;background:rgba(255,255,255,.28);flex-shrink:0;}
.f-slogan .lines{font-family:var(--font-serif);font-size:15px;line-height:26px;color:#fff;letter-spacing:.06em;white-space:nowrap;}
.f-wave{position:absolute;right:-8px;bottom:-16px;opacity:.16;pointer-events:none;}
/* ===== 面包屑 ===== */
.crumb{padding:18px 0 16px;font-size:13px;color:var(--t3);}
.crumb a{color:var(--t2);}
.crumb a:hover{color:var(--blue-hover);}
.crumb .cur{color:var(--t1);font-weight:600;}

/* ===== 页头信息条 ===== */
.head{padding-bottom:18px;border-bottom:1px solid var(--line-strong);display:flex;align-items:flex-start;justify-content:space-between;gap:18px;}
.head-left{flex:1;min-width:0;}
.head-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.head-ic{width:46px;height:46px;border-radius:var(--radius-sm);background:var(--band);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0;}
.head-top h1{font-size:24px;font-weight:700;font-family:var(--serif);color:var(--t1);}
.mk{font-size:11.5px;padding:0 7px;border-radius:var(--radius-sm);line-height:20px;white-space:nowrap;}
.mk.core{color:var(--blue);border:1px solid var(--blue);background:rgba(0,86,83,.05);}
.mk.zone{color:var(--t2);border:1px solid var(--line-strong);background:var(--band);}
.mk.ver{color:var(--gold);border:1px solid rgba(146,112,33,.55);background:rgba(146,112,33,.07);}
.head-sub{font-size:13px;color:var(--t2);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.head-sub .at{color:var(--t3);}
.head-sub b{color:var(--blue);font-weight:600;}
.head-meta{display:flex;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap;font-size:13px;color:var(--t2);}
.hm-item{display:inline-flex;align-items:baseline;gap:5px;}
.hm-item .h-v{font-weight:600;color:var(--t1);font-variant-numeric:tabular-nums;}
.hm-item .h-l{color:var(--t3);}
.hm-sep{color:var(--line-strong);}
.head-right{flex-shrink:0;padding-top:6px;display:flex;align-items:center;gap:8px;}
.btn-apply{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 20px;font-size:14px;font-weight:600;border-radius:var(--radius-sm);background:var(--blue);color:#fff;transition:background .2s;white-space:nowrap;}
.btn-apply:hover{background:var(--blue-active);text-decoration:none;}
.btn-try{display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 18px;font-size:14px;font-weight:600;border-radius:var(--radius-sm);background:#fff;color:var(--blue);border:1px solid var(--blue);transition:all .2s;white-space:nowrap;}
.btn-try:hover{background:rgba(0,86,83,.06);text-decoration:none;}

/* ===== 版本切换 / 版本历史 / 历史版本只读 ===== */
.ver-wrap{position:relative;display:inline-block;}
.mk.ver.vsel{cursor:pointer;}
.mk.ver.vsel:hover{background:rgba(146,112,33,.18);}
.ver-menu{position:absolute;left:0;top:calc(100% + 6px);min-width:250px;background:#fff;border:1px solid var(--line-strong);border-radius:var(--radius-sm);box-shadow:0 8px 22px rgba(0,0,0,.09);z-index:80;padding:6px 0;display:none;text-align:left;}
.ver-menu.open{display:block;}
.ver-mi{padding:8px 12px;font-size:12.5px;color:var(--t2);cursor:pointer;display:flex;gap:8px;align-items:baseline;white-space:nowrap;}
.ver-mi:hover{background:var(--band);color:var(--blue);}
.ver-mi.on{color:var(--blue);font-weight:600;background:rgba(0,86,83,.05);}
.ver-mi .vv{font-weight:700;color:var(--t1);flex-shrink:0;}
.ver-mi.on .vv{color:var(--blue);}
.ver-mi .vd{font-size:11px;color:var(--t3);margin-left:auto;flex-shrink:0;}
.ver-mi .cta{font-size:10.5px;color:var(--ok);border:1px solid rgba(46,125,91,.4);border-radius:var(--radius-sm);padding:0 4px;line-height:15px;flex-shrink:0;}
.ver-menu-ft{padding:8px 12px;border-top:1px dashed var(--line);font-size:11px;color:var(--t3);line-height:1.65;white-space:normal;max-width:280px;}
.vh-item{padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px;color:var(--t2);line-height:1.7;}
.vh-item:last-child{border-bottom:none;padding-bottom:0;}
.vh-hd{display:flex;align-items:center;gap:8px;}
.vh-hd .vv{font-weight:700;color:var(--t1);}
.vh-hd .vd{font-size:11px;color:var(--t3);margin-left:auto;}
.vh-hd .cta{font-size:10.5px;color:var(--ok);border:1px solid rgba(46,125,91,.4);border-radius:var(--radius-sm);padding:0 4px;line-height:15px;}
.vh-item.cur .vv{color:var(--blue);}
.vh-note{color:var(--t3);margin-top:3px;}
.vh-link{font-size:11.5px;color:var(--blue);cursor:pointer;display:inline-block;margin-top:4px;}
.vh-link:hover{text-decoration:underline;}
.vh-item.sel{background:rgba(0,86,83,.03);}
.vt-now{font-size:10.5px;color:var(--blue);border:1px solid rgba(0,86,83,.35);background:rgba(0,86,83,.06);border-radius:var(--radius-sm);padding:0 5px;line-height:15px;}

/* ===== 主体两栏 ===== */
.detail{display:flex;gap:30px;align-items:flex-start;padding:24px 0 8px;}
.main-col{flex:1;min-width:0;}
.side-col{width:300px;flex-shrink:0;position:sticky;top:84px;display:flex;flex-direction:column;gap:14px;}

.doc-hd{display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:14px;}
.doc-hd .doc-n{font-size:16px;font-weight:700;color:var(--t1);}
.doc-hd .doc-t{font-size:12px;color:var(--t3);}
.sec-title{font-size:14px;font-weight:700;color:var(--t1);margin:18px 0 8px;}
.sec-title .sub{font-size:11.5px;color:var(--t3);font-weight:400;margin-left:6px;}
.para{font-size:13.5px;color:var(--t2);line-height:1.9;margin-bottom:8px;}
.para b{color:var(--t1);}
.role-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.role{font-size:12px;padding:3px 10px;border-radius:var(--radius-sm);background:var(--band);color:var(--t2);}
.role b{color:var(--blue);}

/* 规格清单（输入/输出/适用条件） */
.spec-list{list-style:none;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;padding:4px 0;}
.spec-list li{position:relative;padding:8px 16px 8px 30px;font-size:13px;color:var(--t1);line-height:1.75;border-bottom:1px dashed var(--line);}
.spec-list li:last-child{border-bottom:none;}
.spec-list li::before{content:'';position:absolute;left:16px;top:16px;width:5px;height:5px;border-radius:50%;background:var(--blue);opacity:.55;}
.spec-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.spec-2col .sec-title{margin-top:0;}
.io-tag{display:inline-block;font-size:11px;line-height:16px;padding:0 6px;border-radius:var(--radius-sm);margin-right:6px;vertical-align:1px;}
.io-tag.in{color:var(--blue);background:rgba(0,86,83,.07);border:1px solid rgba(0,86,83,.25);}
.io-tag.out{color:var(--ok);background:rgba(46,125,91,.07);border:1px solid rgba(46,125,91,.25);}

.rel-note{margin-top:14px;padding:12px 14px;border-left:3px solid var(--gold);background:rgba(146,112,33,.06);border-radius:var(--radius-sm);font-size:13px;line-height:1.7;color:var(--t2);}
.rel-note b{color:var(--gold);}

/* ===== 右栏卡片 ===== */
.meta-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px 18px;}
.meta-card .sec-title{margin-top:0;}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--t3);white-space:nowrap;}
.kv .v{color:var(--t1);text-align:right;}
.redline{border-left:3px solid var(--warn);background:#fdf6f4;border-radius:var(--radius-sm);padding:12px 14px;font-size:12.5px;color:var(--t2);line-height:1.8;}
.redline b{color:var(--warn);}
.redline ul{list-style:none;margin-top:6px;}
.redline li{position:relative;padding-left:12px;}
.redline li::before{content:'·';position:absolute;left:2px;color:var(--warn);font-weight:700;}

/* ===== 页头 CTA 状态芯片（v1.5：试用已移出本页，仅保留权限/版本状态芯片） ===== */
.ta-chip{font-size:12px;padding:2px 9px;border-radius:var(--radius-sm);line-height:18px;font-weight:600;white-space:nowrap;}
.ta-chip.no{color:var(--warn);border:1px solid rgba(176,58,46,.4);background:rgba(176,58,46,.06);}
.ta-chip.ok{color:var(--ok);border:1px solid rgba(46,125,91,.4);background:rgba(46,125,91,.07);}

/* ===== 试用入口块（v1.5：在线试用已改由独立「模型运行台」页承接，本页只留入口） ===== */

.pm-hint{font-size:11.5px;color:var(--t3);margin-top:5px;line-height:1.6;}
.res-empty{font-size:13px;color:var(--t3);text-align:center;padding:26px 10px;line-height:1.9;}
.res-hero{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px dashed var(--line);margin-bottom:14px;}
.res-hero .big{font-size:32px;font-weight:700;color:var(--blue);font-family:var(--serif);font-variant-numeric:tabular-nums;line-height:1.2;}
.res-hero .unit{font-size:13px;color:var(--t3);}
.res-hero .lg{font-size:12.5px;color:var(--t2);}
.res-hero .flag{font-size:11.5px;padding:1px 7px;border-radius:var(--radius-sm);line-height:18px;}
.res-hero .flag.ok{color:var(--ok);background:rgba(46,125,91,.08);border:1px solid rgba(46,125,91,.3);}
.res-hero .flag.warn{color:var(--warn);background:rgba(176,58,46,.06);border:1px solid rgba(176,58,46,.3);}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;}
.bar-row .bl{width:110px;color:var(--t2);text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-row .bt{flex:1;height:10px;background:var(--band);border-radius:var(--radius-sm);overflow:hidden;}
.bar-row .bt i{display:block;height:100%;background:var(--blue);border-radius:var(--radius-sm);}
.bar-row .bt i.g{background:var(--gold);}
.bar-row .bv{width:56px;text-align:right;color:var(--t1);font-variant-numeric:tabular-nums;flex-shrink:0;}

.r-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.r-tbl th{background:var(--band);color:var(--t2);font-weight:600;text-align:left;padding:7px 10px;border:1px solid var(--line);white-space:nowrap;}
.r-tbl td{padding:7px 10px;border:1px solid var(--line);color:var(--t1);white-space:nowrap;font-variant-numeric:tabular-nums;}
.r-tbl td.num{text-align:right;}

/* 目标检测示意框 */
.det-canvas{position:relative;height:210px;border:1px solid var(--line);border-radius:var(--radius-sm);background:
  linear-gradient(0deg,rgba(0,86,83,.05),rgba(0,86,83,.05)),
  repeating-linear-gradient(45deg,#f4f8f5 0 12px,#edf6f2 12px 24px);overflow:hidden;margin-bottom:12px;}
.det-canvas .hint{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--t3);}
.dbox{position:absolute;border:2px solid var(--gold);background:rgba(146,112,33,.12);border-radius:var(--radius-sm);}
.dbox span{position:absolute;left:-2px;top:-19px;font-size:10.5px;line-height:16px;padding:0 5px;background:var(--gold);color:#fff;border-radius:var(--radius-sm) 2px 0 0;white-space:nowrap;}

/* 分割色带 */
.seg-strip{display:flex;height:16px;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--line);margin:4px 0 12px;}
.seg-strip i{display:block;height:100%;}
.seg-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--t2);margin-bottom:12px;}
.seg-legend .sw{display:inline-block;width:10px;height:10px;border-radius:var(--radius-sm);margin-right:5px;vertical-align:0;}

/* 折线图 */
.chart-box{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px 6px;background:#fff;margin-bottom:12px;}
.chart-box svg{display:block;width:100%;height:170px;}
.chart-lg{display:flex;gap:16px;font-size:11.5px;color:var(--t2);padding:2px 0 6px;flex-wrap:wrap;}
.chart-lg .sw{display:inline-block;width:14px;height:3px;border-radius:var(--radius-sm);margin-right:5px;vertical-align:3px;}

/* 静态「输出示例」框（v1.5 保留：介绍页用 renderResult 静态渲染，不占算力） */
.example-box{border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;padding:14px 16px;}
.ex-note{font-size:11.5px;color:var(--t3);line-height:1.7;margin-top:8px;}

/* ===== 页脚 / toast ===== */
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(16,33,58,.92);color:#fff;padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:999;}
#toast.show{opacity:1;}

/* ===== 二、运行台布局 ===== */
.mono{font-variant-numeric:tabular-nums;font-family:Consolas,"Courier New",monospace;font-size:12.5px;color:var(--t2);}

/* ⭐0916 卡片化：由 flex/gap18 改为与数据中心列表页同款 grid 272px + 1fr
   ⭐0917 文档流改写：去掉 `grid-template-rows:minmax(0,1fr)`。
      该轨道是"全高外壳"配套（要求行至少撑满 .bench 的确定高度）。
      回文档流后 .bench 高度不确定，这条 minmax(0,1fr) 会生成一条"至少剩余空间"的行，
      把页脚挤出首屏；且会让 sticky 左列失去参照。 */
.bench{display:grid;grid-template-columns:272px minmax(0,1fr);
  gap:var(--layout-gap);align-items:start;
  /* ⭐0916 修复③：底部内距 32px → 0 —— 全高外壳下输入区要贴住视口底沿，
     原来这 32px 让输入区下方空出一条，看起来「没贴底」
     ⭐0917：文档流下底部改留 32px，把主区与页脚之间撑开（页脚本身还有 margin-top:--s6） */
  padding:16px 0 32px;}
/* ⭐0916 卡片化：左列改为 white panel + sticky（对齐数据中心 .filter-side）
   ⭐0917 文档流改写：高度上限原用 `calc(100% - 1px)`（依赖父级 grid 行高确定）；
      文档流下父级行高由内容决定，100% 无意义 → 改为视口约束，
      保证"sticky 元素高度 < 视口"这一必要条件成立（0915 详情页右栏踩过此坑）。 */
.bench-side{width:auto;flex-shrink:0;display:flex;flex-direction:column;gap:var(--layout-gap);
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  position:sticky;top:calc(var(--header-height) + var(--s4));
  max-height:calc(100vh - var(--header-height) - var(--s5));overflow:hidden;}
.side-inner{padding:var(--s4) var(--s4) 0;display:flex;flex-direction:column;gap:var(--layout-gap);min-height:0;flex:1 1 auto;}
.btn-newrun{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:38px;border-radius:var(--radius-sm);background:var(--blue);color:#fff;font-size:14px;font-weight:600;transition:background .2s;}
.btn-newrun:hover{background:var(--blue-active);}
/* ⭐0916 卡片化：左列已是白卡，记录盒不再重复描边，改为浅底分区 */
.rec-box{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);}
.rec-hd{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--border);background:var(--page-bg);font-size:13px;font-weight:700;color:var(--text);}
.rec-hd .rec-n{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--t3);}
/* ⭐0917 文档流改写：去掉 max-height:556px 死值 —— 左列卡已改为 sticky + 视口限高，
   记录区高度应由「卡高 − 按钮 − 记录头 − 记录脚」的 flex 链条决定（见 §12.2），
   写死 556px 会在小视口下顶破卡壳、大视口下留出空白。 */
.rec-list{padding:7px;}
.rec{border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;padding:9px 11px;margin-bottom:7px;cursor:pointer;transition:border-color .12s,background .12s;}
.rec:last-child{margin-bottom:0;}
.rec:hover{border-color:var(--blue);background:rgba(0,86,83,.03);}
.rec.on{border-color:var(--blue);background:rgba(0,86,83,.06);box-shadow:inset 3px 0 0 var(--blue);}
.rec-h{display:flex;align-items:baseline;gap:8px;}
.rec-no{font-size:11.5px;color:var(--t2);font-variant-numeric:tabular-nums;font-family:Consolas,"Courier New",monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rec-at{margin-left:auto;font-size:11px;color:var(--t3);white-space:nowrap;flex-shrink:0;}
.rec-tag{margin-top:6px;}
.rec .tchip{font-size:11.5px;padding:1px 8px;line-height:17px;}
.rec-s{font-size:12px;color:var(--t2);line-height:1.62;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.rec-s.warn{color:var(--warn);}
.prog-mini{height:4px;background:var(--band);border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;margin-top:6px;}
.prog-mini i{display:block;height:100%;background:var(--blue);transition:width .2s linear;}
.rec-ft{padding:9px 13px;border-top:1px dashed var(--line);font-size:11px;color:var(--t3);line-height:1.85;}
.rec-ft .demo-link{color:var(--blue);cursor:pointer;}
.rec-ft .demo-link:hover{text-decoration:underline;}

.bench-main{flex:1;min-width:0;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);min-height:620px;display:flex;flex-direction:column;}
/* ⭐0916 卡片化：面板标题行对齐数据中心（--s4 内距 + --page-bg 底） */
.bmain-hd{display:flex;align-items:flex-start;gap:10px;padding:var(--s4);border-bottom:1px solid var(--border);background:var(--page-bg);}
.bh-l{flex:1;min-width:0;}
.bh-row1{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.bh-ic{font-size:18px;line-height:1;}
.bh-n{font-size:15px;font-weight:700;color:var(--t1);}
.bh-sub{font-size:11.5px;color:var(--t3);margin-top:5px;line-height:1.6;word-break:break-all;}
.bh-r{flex-shrink:0;display:flex;align-items:center;gap:8px;padding-top:2px;}
.bmain-bd{padding:16px;flex:1;min-width:0;}
.bsec{margin-bottom:16px;}
.bsec:last-child{margin-bottom:0;}
.bstate{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--t2);line-height:1.75;}
.bstate .dot{width:8px;height:8px;border-radius:50%;background:var(--t3);display:inline-block;flex-shrink:0;margin-top:7px;}
.bstate.run .dot{background:var(--gold);animation:pulse 1s infinite;}
.bstate.done .dot{background:var(--ok);}
.bstate.err .dot{background:var(--warn);}
.bstate b{color:var(--t1);}
.welcome{text-align:center;padding:38px 18px 30px;color:var(--t2);}
.welcome .w-ic{font-size:36px;line-height:1;opacity:.85;}
.welcome .w-t{font-size:16px;font-weight:700;color:var(--t1);margin:12px 0 10px;}
.welcome .w-l{font-size:13px;color:var(--t2);line-height:2;max-width:660px;margin:0 auto;text-align:left;}
.welcome .w-l b{color:var(--blue);}
.welcome .w-btn{margin-top:18px;}

/* ===== 三、状态芯片（5 色，同「我的运行记录」） ===== */
.tchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:var(--radius-sm);white-space:nowrap;line-height:18px;}
.tchip .tdot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0;}
.t-wait{color:var(--gold);border:1px solid rgba(146,112,33,.45);background:rgba(146,112,33,.08);}
.t-run{color:var(--blue);border:1px solid rgba(0,86,83,.3);background:rgba(0,86,83,.06);}
.t-run .tdot{animation:pulse 1s infinite;}
.t-done{color:#3b6d11;border:1px solid rgba(90,122,43,.35);background:rgba(90,122,43,.07);}
.t-fail{color:var(--warn);border:1px solid #e5d5d2;background:#faf6f5;}
.t-cancel{color:var(--t3);border:1px solid var(--line-strong);background:var(--band);}
.tchip.lg{font-size:12.5px;padding:2px 10px;line-height:19px;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes slide{to{background-position:16px 0;}}

/* ===== 四、权限带（未登录 / 未授权 / 已授权 / 历史只读） ===== */
.try-auth{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--band);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px;}
.ta-note{font-size:12.5px;color:var(--t2);line-height:1.7;flex:1;min-width:0;}
.ta-note b{color:var(--t1);}
.ta-demo{font-size:12px;color:var(--blue);cursor:pointer;border-bottom:1px dashed var(--blue);white-space:nowrap;}
.ta-demo:hover{text-decoration:none;}

/* ===== 五、面板 / 按钮 / 提示条 ===== */
.panel{border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:#fff;}
.panel-hd{padding:12px 16px;font-size:14px;font-weight:600;color:var(--t1);border-bottom:1px solid var(--line);background:var(--band);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.panel-hd .sub{font-size:12px;font-weight:400;color:var(--t3);}
.panel-hd .hd-extra{margin-left:auto;font-size:12px;font-weight:400;color:var(--t3);}
.panel-bd{padding:16px;}
.btn{display:inline-flex;align-items:center;justify-content:center;height:32px;padding:0 15px;font-size:13px;border-radius:var(--radius-sm);white-space:nowrap;transition:all .2s;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-active);text-decoration:none;}
.btn-default{background:#fff;color:var(--t1);border:1px solid #dce5e9;}
.btn-default:hover{color:var(--blue-hover);border-color:var(--blue-hover);text-decoration:none;}
.btn-sm{height:26px;padding:0 11px;font-size:12.5px;}
.btn.warn{color:var(--warn);border-color:#e0c8c4;}
.btn.warn:hover{color:#b42318;border-color:var(--warn);background:#fdf6f4;}
.btn-mini{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 13px;font-size:12.5px;font-weight:600;border-radius:var(--radius-sm);background:#fff;color:var(--blue);border:1px solid var(--blue);transition:all .2s;}
.btn-mini:hover{background:rgba(0,86,83,.06);text-decoration:none;}
.para{font-size:13.5px;color:var(--t2);line-height:1.9;}
.para b{color:var(--t1);}
.sandbox-note{margin-top:14px;padding:11px 14px;border-left:3px solid var(--gold);background:rgba(146,112,33,.06);border-radius:var(--radius-sm);font-size:12.5px;color:var(--t2);line-height:1.75;}
.sandbox-note b{color:var(--gold);}
.err-box{border:1px solid rgba(176,58,46,.35);background:#fdf6f4;border-radius:var(--radius-sm);padding:13px 15px;font-size:13px;color:var(--t2);line-height:1.85;}
.err-box b{color:var(--warn);}
.err-box .hint{font-size:12.5px;color:var(--t3);margin-top:8px;padding-top:8px;border-top:1px dashed #e5d5d2;}
.info-box{border:1px solid var(--line);background:var(--band);border-radius:var(--radius-sm);padding:13px 15px;font-size:13px;color:var(--t2);line-height:1.85;}
.info-box b{color:var(--t1);}
.act-bar{padding:0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.act-bar .ab-note{margin-left:auto;font-size:12px;color:var(--t3);}

/* ===== 六、进度条 / 时间线（口径沿「试用任务详情」承接页） ===== */
.prog{height:8px;background:var(--band);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:4px 0 10px;}
.prog i{display:block;height:100%;background:var(--blue);background-image:linear-gradient(90deg,rgba(255,255,255,.45) 0 8px,transparent 8px 16px);background-size:16px 100%;animation:slide 1s linear infinite;}
.prog-static{height:8px;background:var(--band);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:4px 0 10px;}
.prog-static i{display:block;height:100%;background:var(--blue);}

/* ===== 七、文件清单 / 参数回显表 ===== */
.file-list{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;}
.file-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;}
.file-row:last-child{border-bottom:none;}
.file-row:hover{background:var(--band);}
.file-ic{width:26px;height:26px;border-radius:var(--radius-sm);background:var(--band);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.file-nm{flex:1;min-width:0;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-meta{font-size:12px;color:var(--t3);white-space:nowrap;font-variant-numeric:tabular-nums;}
.file-tag{font-size:11px;line-height:16px;padding:0 6px;border-radius:var(--radius-sm);color:var(--blue);background:rgba(0,86,83,.07);border:1px solid rgba(0,86,83,.25);white-space:nowrap;}
.file-tag.zip{color:var(--gold);background:rgba(146,112,33,.07);border-color:rgba(146,112,33,.4);}
.kv-tbl{width:100%;border-collapse:collapse;font-size:13px;}
.kv-tbl th{background:var(--band);color:var(--t2);font-weight:600;text-align:left;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap;}
.kv-tbl td{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--t1);vertical-align:top;}
.kv-tbl tr:last-child td{border-bottom:none;}
.kv-tbl td.k{color:var(--t2);width:190px;}
.kv-tbl td.v{font-weight:600;width:200px;}
.kv-tbl td.d{color:var(--t3);font-size:12.5px;}

/* ===== 八、底部输入区（控件由模型入参 schema 决定） ===== */
.ia-panel{margin-top:20px;}
.ia-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;}
.ia-col{min-width:0;}
.ia-col.dis{opacity:.55;pointer-events:none;user-select:none;}
.ia-ft{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.ia-ft .btn-run{width:auto;min-width:196px;padding:0 28px;flex-shrink:0;}
.ia-ft .run-tip{margin:0;text-align:left;flex:1;min-width:280px;}
.blk-ttl{font-size:12.5px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.blk-ttl .req{font-size:10.5px;font-weight:600;color:var(--warn);border:1px solid rgba(176,58,46,.4);background:rgba(176,58,46,.06);border-radius:var(--radius-sm);padding:0 5px;line-height:15px;}
.blk-ttl .opt{font-size:10.5px;font-weight:600;color:var(--t3);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:0 5px;line-height:15px;}
.blk-ttl .blk-note{font-size:10.5px;font-weight:400;color:var(--t3);margin-left:auto;}
.src-hint{font-size:11.5px;color:var(--t3);line-height:1.7;padding:6px 0 2px;}
.src-hint b{color:var(--t2);}
.adv{margin-left:8px;font-size:11.5px;color:var(--blue);cursor:pointer;border-bottom:1px dashed var(--blue);font-weight:400;white-space:nowrap;}
.adv:hover{text-decoration:underline;}
.drop{border:1px dashed var(--line-strong);border-radius:var(--radius-sm);background:var(--band);padding:14px 12px;text-align:center;cursor:pointer;margin:8px 0 4px;}
.drop:hover{border-color:var(--blue);background:rgba(0,86,83,.04);}
.drop .ic{font-size:19px;line-height:1;}
.drop .dt{font-size:12.5px;color:var(--t1);font-weight:600;margin-top:5px;}
.drop .dh{font-size:11px;color:var(--t3);margin-top:5px;line-height:1.7;}
.flist{margin-top:8px;}
.flist .fi{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;margin-bottom:6px;}
.flist .fi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t1);}
.flist .fi .fsz{color:var(--t3);flex-shrink:0;font-variant-numeric:tabular-nums;}
.flist .fi .rm{color:var(--t3);cursor:pointer;flex-shrink:0;}
.flist .fi .rm:hover{color:var(--warn);}
.pm-row{padding:10px 0;border-bottom:1px dashed var(--line);}
.pm-row:last-child{border-bottom:none;}
.pm-lb{display:flex;align-items:center;font-size:12.5px;color:var(--t2);margin-bottom:6px;}
.pm-in{width:100%;height:32px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:#fff;padding:0 9px;font-size:13px;color:var(--t1);font-family:inherit;}
.pm-in:focus{outline:none;border-color:var(--blue);}
.pm-range{display:flex;align-items:center;gap:10px;}
.pm-rg{flex:1;accent-color:var(--blue);}
.pm-rv{font-size:12.5px;color:var(--blue);font-weight:600;min-width:54px;text-align:right;font-variant-numeric:tabular-nums;}
.pm-tag{font-size:10.5px;color:var(--t3);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:0 5px;line-height:15px;margin-left:6px;font-weight:400;}
.pm-in[disabled],.pm-rg[disabled]{background:#f4f8f5;cursor:not-allowed;}
.pm-hint{font-size:11.5px;color:var(--t3);margin-top:5px;line-height:1.65;}
.btn-run{display:flex;align-items:center;justify-content:center;gap:8px;height:38px;border-radius:var(--radius-sm);background:var(--blue);color:#fff;font-size:14px;font-weight:600;transition:background .2s;}
.btn-run:hover{background:var(--blue-active);}
.btn-run[disabled]{background:#c3cdd8;cursor:not-allowed;}
.run-tip{font-size:11.5px;color:var(--t3);line-height:1.75;}

/* ===== 九、空态 ===== */
.empty{text-align:center;padding:56px 20px;color:var(--t3);}
.empty .e-ic{font-size:38px;opacity:.3;margin-bottom:10px;}
.empty .e-t{font-size:14px;color:var(--t2);}
.empty .e-s{font-size:12.5px;margin-top:6px;}
.empty.sm{padding:26px 12px;}
.empty.sm .e-ic{font-size:26px;margin-bottom:6px;}
.empty.sm .e-t{font-size:13px;}
.empty.sm .e-s{font-size:11.5px;line-height:1.7;}
.panel-bd .sec-title:first-child{margin-top:0;}

/* ===== 十、文档流外壳（⭐0917 改写：放弃全高外壳，页脚恢复显示） =====
   ⚠️ 背景：本页原先用「整页不滚动」的全高外壳（body height:100vh + overflow:hidden）换"三区各自内滚"，
   代价是站点页脚必须被隐藏（否则占掉约 133px 首屏）。用户 0916 明确要求**页脚正常显示在页面底部**，
   且列表页／详情页页脚本就正常显示 → 三页必须一致。
   → 0917 按**方案 A** 改写：运行台回普通文档流（与列表页 / 详情页同构），页脚正常显示在内容末尾。

   新的高度分配（不再是"唯一一条视口高度链"，改为普通文档流 + 局部 sticky）：
     body（正常滚动，无 height/overflow 限制）
       ├ header              普通静态块（站点头 64px）
       └ .portal             仅作包裹，无 flex/overflow 约束
           └ .portal>.wrap   只做宽度收口（max-width + 左右内距），与 .container 同规格
               ├ .crumb      普通块
               └ .bench      grid：左列 272px 固定 + 右主区自适应
                   ├ .bench-side 白卡，★sticky(top:80px) + 自身 max-height 内滚 → 左列记录多时只滚左列
                   └ .bench-main 普通块，内部 .bmain-bd / #inputArea 不再强制裁切
     footer                 正常文档流元素，显示在页面最底部
   保留的体验：左列吸顶（翻右区时记录区常驻）；右区结果长时随页面滚动。
   失去的体验：输入区不再"永远贴视口底"（改为内容末尾；窄屏与普通长页面一致）。 */
html,body{height:auto;min-height:100%;}
body{display:block;overflow:visible;}
.app-header{position:relative;flex:0 0 auto;}
.portal{padding-top:0;display:block;overflow:visible;}
.portal>.wrap{width:100%;max-width:var(--content-max);margin:0 auto;padding:0 clamp(24px,3.65vw,56px);}
.crumb{flex:0 0 auto;}
/* ⭐0916 卡片化：该行原为 flex 时代的高度链，grid 下 align-items 由 ② 接管
   ⭐0917：文档流下不再需要 min-height:0（已无裁切链） */
.bench{min-height:0;}
.bench-side{min-height:0;}
.btn-newrun,.bmain-hd,.rec-hd,.rec-ft{flex:0 0 auto;}
/* ⭐0917 文档流改写：以下三条原为"全高外壳下的内部滚动"链条（min-height:0 + flex:1 + overflow:hidden
   互相咬合）。文档流下必须解开裁切，否则右区/左列会被钳死在某个高度而内容看不全。
   - .rec-box 保留 flex 列（左列内部仍是"头 + 列表 + 脚"），但取消 overflow:hidden
   - .rec-list 改由 .side-inner 的高度约束（sticky 卡内滚，见 §12.2 / §12.7）
   - .bench-main / .bmain-bd 取消 flex:1 与 overflow 钳制，高度由内容决定 */
.rec-box{display:flex;flex-direction:column;}
.rec-list{max-height:none;}
.bench-main{min-height:0;}
.bmain-bd{}
/* ⭐0916 修复②③：输入区与结果区之间明确分隔。
   - 输入区顶边用 --border 实线（原 --line 过浅，滚动内容贴上来时看不出界）
   ⭐0917：去掉 margin-top:auto 与 44vh 钳制 —— 那两个属性是为"全高外壳下贴视口底沿"服务的，
   文档流下会把输入区从内容流里脱开，改为自然高度、跟随结果区之后。 */
#inputArea{border-top:1px solid var(--border);}
/* 结果区与输入区之间的留白：由 .bmain-bd 的下内距承担（原 16px → 28px），
   让结果区滚动内容与分隔线之间始终有一段呼吸空间 */
#inputArea .ia-panel{margin-top:0;border:none;padding-top:var(--s3);}
.bmain-bd{padding-bottom:28px;}
/* ⭐0917 页脚恢复（用户拍板「方案 A：放弃全高外壳」）：
   运行台此前用 `.site-footer{display:none}` 隐藏了站点页脚，但用户要的是页脚**正常显示在页面底部**
   ——那是网站该有的内容，不是"偷高度的干扰项"。且列表页／详情页页脚一直正常显示，仅运行台缺失＝三页不一致。
   现改为：运行台放弃「整页不滚动」的全高外壳，回普通文档流（见 §十 改写），页脚按 .site-footer 原始规则
   正常显示在内容末尾，三页形态统一。（原隐藏规则整条删除，勿再恢复） */

/* ===== 十一、v1.2 比例修正（反馈：输入区/左列占位过大、右区输出被压得极小） =====
   修复口径：该大的是「输出」，该小的是「输入区」与「左列」。
   两档视口下 .wrap 内容宽恒为 1136px（body min-width:1200 + wrap max-width:1200），
   故横向度量一致，纵向分配如下（全部用显式高度 + nowrap/ellipsis，不依赖字体度量，
   因此高度是确定值而非估算值）：

     站点头 64 + 面包屑 55.5 + 页头信息条 112.4 = 231.9 →  .bench 内容高 = vh − 231.9 − 20
     .bench 内容 = .bmain-hd 78.4 + #inputArea 148 + .bmain-bd（flex:1，剩余全给它）

     #inputArea 内部（box-sizing:border-box，逐行显式高度）：
        上边框 1 + 状态条 18 + 上内边距 2 + 行1 76 + 行2 48 + 下内边距 2 = 147（+上边框 = 148）
        行1 = max(#colIn 68, #colParam 76)；行2 = 外边距 3 + 上边框 1 + 上内边距 2 + 内容 42
        #colParam = 小标题 16 + 间隔 2 + #paramBody 58（= 两行 26 + 行距 6，第 3 行起内部滚动）

   结果（核算见 §④）：1440×950 → 左列 220 ｜ 输入区 148 ｜ 输出 ≈472
                     1280×800 → 左列 220 ｜ 输入区 148 ｜ 输出 ≈322
   长文案一律单行截断（ellipsis）+ title 兜底，不换行、不挤压；两档均无页面级纵向滚动。
   注：§十 里 `#inputArea{max-height:44vh}` 一行由本节后写覆盖（44vh → 22vh，另加窄高视口 150px 补丁）。 */

/* ---- 11.1 左列缩窄 300 → 220，记录项文字单行截断（title 兜底） ---- */
/* ⭐0916 卡片化：grid 下由 grid-template-columns 决定左列宽（272px），gap 用 --layout-gap */
.bench{gap:var(--layout-gap);}
.bench>.bench-side{width:auto;}
.bench-side .rec-hd{padding:8px 10px;font-size:12px;}
.bench-side .rec-list{padding:5px;}
/* ⭐0916 修复：记录项再压一档 —— 目标是把 8 条总高压进可视区（此前 714px 只能露 5~7 条） */
.bench-side .rec{padding:6px 8px;margin-bottom:4px;}
.bench-side .rec-h{gap:6px;}
.bench-side .rec-no{flex:1 1 auto;min-width:0;font-size:10.5px;}
.bench-side .rec-at{font-size:10px;}
.bench-side .rec-tag{margin-top:3px;}
.bench-side .rec .tchip{font-size:10.5px;padding:0 6px;line-height:16px;}
.bench-side .rec-s{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;font-size:11px;line-height:15px;}
.bench-side .prog-mini{margin-top:5px;}
/* ⭐0916 修复：.rec-ft 压到最紧（line-height 1.4、padding 3px 10px），
   把左列高度让给记录项，使示例记录尽可能无需列内滚动即可全部看到 */
.bench-side .rec-ft{padding:3px 10px;font-size:10.5px;line-height:1.4;}
.bench-side .rec-ft .demo-link{font-size:10.5px;}
.bench-side .empty.sm{padding:22px 8px;}

/* ---- 11.2 输入区：44vh/418px → 148px 紧凑两行（状态条 + 行1 + 行2）
   ⭐0917 文档流改写：去掉 max-height 钳制（22vh / 150px 两档）。
   这两档是"全高外壳下不许输入区吃掉首屏"的配套；文档流下输入区在内容末尾，
   钳住它只会让参数区出现内部滚动条（用户看不到全部参数），改为自然高度。 */
#inputArea{border-top:1px solid var(--line);}
#inputArea .ia-panel{margin:0;border:none;border-radius:0;}
#inputArea .panel-bd{padding:2px 12px 2px;}

/* 状态条（原面板标题行 + 原权限带合并为一条 18px）：说明性长句截断 + title 提示 */
#inputArea .panel-hd{height:18px;padding:0 12px;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow:hidden;font-size:11px;line-height:14px;border-bottom:1px solid var(--line);background:var(--band);}
#inputArea .panel-hd .ia-hd-t{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--t1);}
#inputArea .panel-hd .sub{flex:0 1 auto;min-width:0;flex-shrink:30;font-size:11px;font-weight:400;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#inputArea .panel-hd .hd-extra{flex:0 1 auto;min-width:0;flex-shrink:30;margin-left:0;font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#inputArea .panel-hd .try-auth{flex:1 1 auto;min-width:0;margin:0;padding:0;border:none;background:transparent;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow:hidden;}
#inputArea .panel-hd .ta-note{flex:1 1 auto;min-width:0;font-size:11px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#inputArea .panel-hd .ta-chip{flex:0 0 auto;font-size:10.5px;line-height:16px;height:16px;padding:0 7px;}
#inputArea .panel-hd .ta-demo,#inputArea .panel-hd .try-auth a{flex:0 0 auto;font-size:11px;line-height:14px;white-space:nowrap;}

/* 行 1：左＝文件区（选择文件 + chips 横向排列、内部截断）｜右＝参数区（label 内联、横向排列 + 换行） */
#inputArea .ia-grid{display:flex;gap:10px;align-items:flex-start;min-width:0;}
#inputArea .blk-ttl{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap;height:16px;line-height:16px;}
#inputArea .blk-ttl .blk-note{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#inputArea .blk-ttl .req,#inputArea .blk-ttl .opt{font-size:10px;line-height:14px;padding:0 4px;}
#inputArea .blk-ttl .adv{flex:0 0 auto;margin-left:auto;font-size:11px;line-height:14px;}

#colIn{flex:0 0 250px;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden;}
#colIn .drop{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:26px;margin:0;padding:0 8px;text-align:left;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--band);cursor:pointer;min-width:0;overflow:hidden;}
#colIn .drop:hover{border-color:var(--blue);background:rgba(0,86,83,.04);}
#colIn .drop .ic{flex:0 0 auto;font-size:12px;line-height:1;margin:0;}
#colIn .drop .dt{flex:0 0 auto;font-size:11.5px;line-height:16px;font-weight:600;margin:0;}
#colIn .drop .dh{flex:1 1 auto;min-width:0;height:14px;margin:0;font-size:10.5px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#colIn .flist{height:22px;margin:0;display:flex;flex-wrap:nowrap;align-items:center;gap:5px;min-width:0;overflow:hidden;}
#colIn .flist .fi{flex:0 1 auto;min-width:0;max-width:118px;height:22px;margin:0;padding:0 6px;gap:5px;font-size:11px;}
#colIn .flist .fi .nm{min-width:0;}
#colIn .flist .pm-hint{flex:1 1 auto;min-width:0;margin:0;font-size:10.5px;line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

#colParam{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
#paramBody{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;max-height:58px;overflow-y:auto;overflow-x:hidden;}
#paramBody .pm-row{flex:1 1 250px;min-width:0;max-width:100%;height:26px;overflow:hidden;margin:0;padding:0 8px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;}
#paramBody .pm-lb{flex:0 0 auto;display:flex;align-items:center;margin:0;font-size:11.5px;line-height:16px;color:var(--t2);white-space:nowrap;}
#paramBody .pm-lb .pm-tag{margin-left:4px;font-size:10px;line-height:14px;padding:0 4px;}
#paramBody .pm-in{flex:1 1 60px;width:auto;min-width:0;height:20px;font-size:11.5px;padding:0 6px;border-color:var(--line);}
#paramBody .pm-range{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;}
#paramBody .pm-rg{flex:1 1 auto;min-width:40px;}
#paramBody .pm-rv{flex:0 0 auto;min-width:34px;font-size:11px;line-height:16px;}
#paramBody .pm-hint{flex:1 1 60px;min-width:0;margin:0;font-size:10.5px;line-height:14px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---- 11.3 右区输出：标题行固定为一行（不因元信息文案长短伸缩），剩余高度全给 .bmain-bd ---- */
.bmain-hd .bh-row1{flex-wrap:nowrap;}
.bmain-hd .bh-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---- 11.4 行 2：左＝一行提示（允许介质 / 平台内执行 / 仅用于本次运行）｜右＝主按钮 ---- */
#inputArea .ia-ft{margin-top:3px;padding-top:2px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:12px;flex-wrap:nowrap;min-width:0;}
#inputArea .ia-tips{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:0;}
#inputArea .ia-tips .src-hint{min-width:0;margin:0;padding:0;font-size:10.5px;line-height:14px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#inputArea .ia-tips .run-tip{flex:0 0 auto;min-width:0;margin:0;font-size:10.5px;line-height:14px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#inputArea .ia-ft .btn-run{flex:0 0 auto;width:auto;min-width:150px;height:28px;padding:0 20px;font-size:12.5px;}

/* 线性图标（规范 §图标：同一套线性 SVG，禁 emoji） */
.ic-svg{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex-shrink:0;}
.md-ic .ic-svg,.head-ic .ic-svg{width:22px;height:22px;}
.md-ic,.head-ic{color:var(--brand);}
.e-ic .ic-svg{width:28px;height:28px;color:var(--text-muted);}
.m-item .ic-svg,.md-upd .ic-svg,.md-meta2 .ic-svg,.file-ic .ic-svg{width:13px;height:13px;vertical-align:-.12em;}
.file-ic{color:var(--text-secondary);}
.u-mi .ic-svg{width:13px;height:13px;vertical-align:-.12em;margin-right:2px;}


/* 读屏专用 + 标题重置（规范 §键盘与读屏） */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
h1,h2,h3{margin:0;font-weight:inherit;font-size:inherit;line-height:inherit;}


/* ===== 十二、⭐0916 卡片化对齐数据中心（列表页／详情页同批） =====
   背景：运行台原为「全宽贴边 + 裸两栏」平铺结构；数据中心与模型中心其余两页
   已统一为「容器收口 1800 + 左右双白卡」范式。本节把运行台并入同一范式。

   结构链（与数据中心列表页一致）：
     .portal
       └ .wrap          ← 收口 1800px + clamp 内距（Step1 已补）
           ├ .crumb     面包屑（36px 行高，与详情页同）
           └ .bench     grid 272px + 1fr，gap 16
               ├ .bench-side.panel（白卡 + sticky）→ .side-inner（内距 16）
               │     ├ .btn-newrun
               │     └ .rec-box（记录盒，浅描边分区）
               └ .bench-main（白卡，圆角 8）
                     ├ .bmain-hd（底 --page-bg，--s4 内距）
                     ├ .bmain-bd（flex:1，内部滚动）
                     └ #inputArea（底沿固定） */

/* 12.1 面包屑：与详情页统一 36px 行高、14px 字号 */
.wrap>.crumb{display:flex;align-items:center;gap:var(--s2);height:36px;padding:0;
  font-size:14px;color:var(--text-muted);}
.wrap>.crumb a{color:var(--text-secondary);}
.wrap>.crumb a:hover{color:var(--brand);text-decoration:none;}
.wrap>.crumb .cur{color:var(--text);font-weight:600;}

/* 12.2 左列白卡内的容器
   ⭐0917 文档流改写：全高外壳下 .side-inner 是"撑满 + 内部滚动"的一环；
   文档流下改为「左列 card 自身 sticky + 自身限高内滚」——记录多时只滚左列，翻右区时左列常驻。
   ⚠️ sticky 隐藏前提：元素高度必须小于视口，否则吸顶不生效（0915 已在详情页右栏踩过一次）。
      此处给出 max-height:calc(100vh - 站点头 64 - 上下呼吸 48)，并让 .rec-box/.rec-list 承接内滚。 */
.bench-side{position:sticky;top:calc(var(--header-height) + var(--s4));
  max-height:calc(100vh - var(--header-height) - var(--s5));overflow:hidden;}
.bench-side>.side-inner{min-height:0;max-height:100%;}

<script id="bdh-portal-nav-js">
/* 统一一级导航 + 0924 统一登录态（登录后出现「个人中心」入口） */
(function () {
  var CFG = window.__BDH_NAV__ || {};
  var ME = CFG.me || "";
  var SELF = !!CFG.self;

  /* ---- 占位提示兜底：优先复用页面自带的 toast ---- */
  function bdhToast(msg) {
    var f = window.showToast || window.toast;
    if (typeof f === "function") { try { f(msg); return; } catch (e) {} }
    var el = document.getElementById("bdhToast");
    if (!el) {
      el = document.createElement("div");
      el.id = "bdhToast";
      el.style.cssText = "position:fixed;left:50%;bottom:40px;transform:translateX(-50%);padding:10px 20px;"
        + "background:rgba(16,33,58,.92);color:#fff;font-size:14px;border-radius:4px;z-index:600;"
        + "transition:opacity .2s;pointer-events:none;";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = "1";
    clearTimeout(window.__bdhToastTimer);
    window.__bdhToastTimer = setTimeout(function () { el.style.opacity = "0"; }, 2600);
  }
  window.bdhToast = bdhToast;

  /* ================= 统一登录态 ================= */
  function authRoots() {
    var out = [];
    var a = document.querySelector(".header-actions");
    if (a) { out.push(a); }
    var m = document.getElementById("bdhMobileMenu") || document.getElementById("mobileMenu");
    if (m) { out.push(m); }
    return out;
  }
  function visibleLogin(el) { return el.querySelector("[data-bdh-login]:not([data-bdh-hidden])"); }

  function mk(tag, cls, txt) {
    var n = document.createElement(tag);
    n.className = cls;
    if (txt) { n.textContent = txt; }
    return n;
  }
  function mkMe() {
    var a = mk("a", "bdh-me", "个人中心");
    a.setAttribute("data-bdh-me", "");
    a.href = ME;
    return a;
  }
  function mkOut() {
    var b = mk("button", "bdh-logout", "退出");
    b.type = "button";
    b.setAttribute("data-bdh-logout", "");
    return b;
  }
  function mkUser() {
    var s = mk("span", "bdh-user");
    s.setAttribute("data-bdh-user", "");
    s.appendChild(mk("span", "bdh-avatar", "张"));
    s.appendChild(mk("span", "bdh-name", "张研究员"));
    return s;
  }
  function clearMine(el) {
    var ns = el.querySelectorAll("[data-bdh-me],[data-bdh-logout],[data-bdh-user]");
    for (var i = 0; i < ns.length; i++) {
      if (ns[i].parentNode) { ns[i].parentNode.removeChild(ns[i]); }
    }
  }
  function insertAfter(anchor, node) {
    anchor.parentNode.insertBefore(node, anchor.nextSibling);
    return node;
  }
  function syncRoot(el) {
    var mobile = el.classList.contains("mobile-menu");
    if (SELF && !mobile) { return; }                  /* 个人中心页桌面不插自链 */
    if (visibleLogin(el)) { clearMine(el); return; }  /* 未登录 */
    if (el.querySelector("[data-bdh-me]")) { return; }/* 已有入口 */

    /* —— 已登录：补「个人中心」入口 —— */
    var hidden = el.querySelector("[data-bdh-login]");
    var nodes = [mkMe()];
    if (!SELF && hidden) { nodes.push(mkOut()); }     /* 本容器有可复原的登录按钮才给「退出」 */

    if (mobile) {
      var last = hidden;
      if (last) { for (var i = 0; i < nodes.length; i++) { last = insertAfter(last, nodes[i]); } }
      else { for (var k = 0; k < nodes.length; k++) { el.appendChild(nodes[k]); } }
      return;
    }
    var ident = el.querySelector(".u-box, .signed-user, .pc-user, .bdh-user");
    if (!ident) {
      ident = mkUser();
      if (hidden && hidden.parentNode === el) { el.insertBefore(ident, hidden); }
      else { el.insertBefore(ident, el.firstChild); }
    }
    var after = ident;
    for (var j = 0; j < nodes.length; j++) { after = insertAfter(after, nodes[j]); }
  }
  function syncAuth() {
    var roots = authRoots();
    for (var i = 0; i < roots.length; i++) { syncRoot(roots[i]); }
  }
  window.bdhSyncAuth = syncAuth;

  function hideLogins() {
    var bs = document.querySelectorAll("[data-bdh-login]");
    for (var i = 0; i < bs.length; i++) {
      bs[i].setAttribute("data-bdh-hidden", "");
      bs[i].style.display = "none";
    }
  }
  function showLogins() {
    var bs = document.querySelectorAll("[data-bdh-login]");
    for (var i = 0; i < bs.length; i++) {
      bs[i].removeAttribute("data-bdh-hidden");
      bs[i].style.display = "";
    }
  }
  /* doLogout() 会写回旧式登录按钮（.btn-login / onclick=doLogin）⇒ 归一化 */
  function normalizeLogins() {
    var sel = ".header-actions .btn-login,.header-actions .header-btn-login,"
      + ".header-actions a[onclick*='doLogin'],.header-actions button[onclick*='doLogin'],"
      + ".header-actions #login,.header-actions [onclick*='showLoginEntry']";
    var bs = document.querySelectorAll(sel);
    for (var i = 0; i < bs.length; i++) {
      bs[i].setAttribute("data-bdh-login", "");
      bs[i].removeAttribute("onclick");
      bs[i].classList.add("login-link");
    }
  }
  function signIn() {
    if (typeof window.doLogin === "function") { try { window.doLogin(); } catch (e) {} }
    normalizeLogins();
    hideLogins();
    document.body.classList.add("bdh-signed");
    syncAuth();
  }
  function signOut() {
    if (typeof window.doLogout === "function") { try { window.doLogout(); } catch (e) {} }
    normalizeLogins();
    showLogins();
    document.body.classList.remove("bdh-signed");
    syncAuth();
  }
  window.bdhSignIn = signIn;

  /* 包装页面自带登录/登出/重渲染：任何入口登录完都补上「个人中心」 */
  (function () {
    var wrap = function (name, after) {
      var orig = window[name];
      if (typeof orig !== "function") { return; }
      window[name] = function () {
        var r = orig.apply(this, arguments);
        try { after(); } catch (e) {}
        return r;
      };
    };
    wrap("doLogin", function () {
      normalizeLogins(); hideLogins(); document.body.classList.add("bdh-signed"); syncAuth();
    });
    wrap("renderAuthArea", function () { normalizeLogins(); syncAuth(); });
    wrap("doLogout", function () {
      normalizeLogins(); showLogins(); document.body.classList.remove("bdh-signed"); syncAuth();
    });
  })();

  function initAuth() {
    if (SELF) { hideLogins(); }
    normalizeLogins();
    syncAuth();
  }

  /* ---- 委托：登录 / 退出 / 占位提示 / 移动菜单 ---- */
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || !t.closest) { return; }
    var lb = t.closest("[data-bdh-login]");
    if (lb) {
      e.preventDefault();
      /* 门户页把「关闭菜单」挂在 #mobileMenu 上，冒泡时先于本监听执行 ⇒
         不能靠 .open 类判断，改看「点击是否发生在移动菜单内」，
         登录后同步把菜单重新展开，好让用户立刻看到新出现的「个人中心」入口 */
      var menu = document.getElementById("bdhMobileMenu") || document.getElementById("mobileMenu");
      var inMenu = !!(menu && (menu === lb || menu.contains(lb)));
      signIn();
      if (inMenu && menu) {
        setTimeout(function () {
          menu.classList.add("open");
          var tg = document.getElementById("bdhMenuToggle") || document.getElementById("menuToggle");
          if (tg) { tg.setAttribute("aria-expanded", "true"); }
        }, 0);
      }
      return;
    }
    if (t.closest("[data-bdh-logout]")) { e.preventDefault(); signOut(); return; }
    var tt = t.closest("[data-bdh-toast]");
    if (tt) { e.preventDefault(); bdhToast(tt.getAttribute("data-bdh-toast")); return; }
    var m = t.closest("#bdhMenuToggle");
    if (m) {
      var mu = document.getElementById("bdhMobileMenu");
      if (mu) {
        var open = mu.classList.toggle("open");
        m.setAttribute("aria-expanded", open ? "true" : "false");
        m.setAttribute("aria-label", open ? "关闭菜单" : "打开菜单");
      }
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") { return; }
    var menu = document.getElementById("bdhMobileMenu");
    var m = document.getElementById("bdhMenuToggle");
    if (menu && menu.classList.contains("open")) {
      menu.classList.remove("open");
      if (m) { m.setAttribute("aria-expanded", "false"); m.focus(); }
    }
  });

  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", initAuth); }
  else { initAuth(); }
})();
</script>

/* ---- 运行号 / 时间线 ---- */
function mkTl(status,id,nres){
  var T='2026-07-01 10:30:', t0=T+'12', t1=T+'12', t2=T+'14', t3=T+'31';
  if(status==='running')return [
    {t:'已提交',at:t0,n:'运行台提交自有数据，生成运行号 '+id,st:'pass'},
    {t:'排队中',at:t1,n:'同步运行：队列瞬时通过（同步只是耗时极短的异步运行）',st:'pass'},
    {t:'处理中',at:t2,n:'平台内解析输入文件并执行模型推理，结果将展示在右侧',st:'on'},
    {t:'已完成',at:'—',n:'处理完成后生成结果文件，可下载留存',st:'wait'}];
  if(status==='queued')return [
    {t:'已提交',at:t0,n:'运行台提交自有数据，生成运行号 '+id,st:'pass'},
    {t:'排队中',at:t1,n:'前面还有 2 个任务，等待算力分配',st:'on'},
    {t:'处理中',at:'—',n:'平台为该任务分配算力后开始推理',st:'wait'},
    {t:'已完成',at:'—',n:'处理完成后生成结果文件，可下载留存',st:'wait'}];
  if(status==='fail')return [
    {t:'已提交',at:t0,n:'运行台提交自有数据，生成运行号 '+id,st:'pass'},
    {t:'排队中',at:t1,n:'同步运行：队列瞬时通过',st:'pass'},
    {t:'处理中',at:t2,n:'校验输入文件格式与参数取值',st:'pass'},
    {t:'失败',at:T+'20',n:'输入校验未通过，运行终止（未产生结果文件）',st:'fail'}];
  if(status==='cancel')return [
    {t:'已提交',at:t0,n:'运行台提交自有数据，生成运行号 '+id,st:'pass'},
    {t:'排队中',at:t1,n:'前面还有 2 个任务，等待算力分配',st:'pass'},
    {t:'已取消',at:T+'40',n:'用户在排队阶段取消运行，未占用算力配额',st:'cancel'}];
  return [
    {t:'已提交',at:t0,n:'运行台提交自有数据，生成运行号 '+id,st:'pass'},
    {t:'排队中',at:t1,n:'同步运行：队列瞬时通过（同步只是耗时极短的异步运行）',st:'pass'},
    {t:'处理中',at:t2,n:'平台内解析输入文件并执行模型推理',st:'pass'},
    {t:'已完成',at:t3,n:'生成 '+(nres||2)+' 个结果文件，可下载留存',st:'on'}];
}
function recSummary(r){
  if(r.status==='done')return r.brief||(r.summary&&r.summary.text)||'已完成，结果文件可下载';
  if(r.status==='running')return r.progressText||('运行中 · 已处理 '+(r.progress||0)+'%');
  if(r.status==='queued')return '排队中 · 前面还有 '+(typeof r.queueAhead==='number'?r.queueAhead:2)+' 个任务';
  if(r.status==='fail')return '失败：'+(r.errShort||'运行失败');
  return r.cancelText||'用户取消 · 未占用算力配额';
}

    var el=document.getElementById('pm_'+p.id);

function paramHtml(p){
  var cur=(PVALS[p.id]!==undefined?PVALS[p.id]:p.def);
  var kind=(p.type==='select'?'枚举':(p.type==='range'?'连续区间':'文本'));
  var h='<div class="pm-row"><label class="pm-lb">'+p.label+'<span class="pm-tag">'+kind+'</span></label>';
  if(p.type==='select'){
    h+='<select class="pm-in" id="pm_'+p.id+'">'+p.options.map(function(o){

    h+='<div class="pm-range"><input type="range" class="pm-rg" id="pm_'+p.id+'" min="'+p.min+'" max="'+p.max+

    h+='<input type="text" class="pm-in" id="pm_'+p.id+'" value="'+cur+'" placeholder="'+(p.ph||'')+'">';

      '<span class="hd-extra" title="'+(CUR.exec==='async'?'异步任务模型 · 提交后生成运行号，可关闭页面':'同步运行模型 · 排队与处理瞬时通过')+'">'+(CUR.exec==='async'?'异步任务模型 · 提交后生成运行号，可关闭页面':'同步运行模型 · 排队与处理瞬时通过')+'</span></div>'+
    '<div class="panel-bd">'+
      '<div class="ia-grid">'+
        '<div class="ia-col'+(lock?' dis':'')+'" id="colIn">'+
          '<div class="blk-ttl">① 必填输入数据<span class="req">必填</span><span class="blk-note" title="由该模型输入要求决定">由该模型输入要求决定</span></div>'+
          '<div class="drop" onclick="pickFiles()"><span class="ic"><svg class="ic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></span><span class="dt">点击选择文件</span>'+
            '<span class="dh" title="可多选，选择后显示文件名与大小，可逐个移除 允许介质：'+sp.media+'">可多选，选择后显示文件名与大小，可逐个移除<br>允许介质：'+sp.media+'</span></div>'+
          '<div class="flist" id="fileList"></div>'+
        '</div>'+
        '<div class="ia-col'+(lock?' dis':'')+'" id="colParam">'+
          '<div class="blk-ttl">② 可调参数<span class="opt">可选</span><span class="blk-note" title="由模型推理接口 schema 定义">由模型推理接口 schema 定义</span>'+
            '<span class="adv" id="advToggle" onclick="toggleAdv()">'+(ADV_OPEN?'高级参数：收起 ▴':'高级参数：展开 ▾')+'</span></div>'+
          '<div id="paramBody"'+(ADV_OPEN?'':' style="display:none;"')+'>'+t.params.map(paramHtml).join('')+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="ia-ft">'+
        /* v1.2：允许介质提示（原在 #colIn 内）与运行提示同处行 2 左侧，主按钮固定行 2 右侧 */
        '<div class="ia-tips">'+
          '<div class="src-hint" title="提交你自己的数据运行（与数据中心的平台数据无关，仅用于本次运行）。允许介质：'+sp.media+'">提交<b>你自己的数据</b>运行（与数据中心的平台数据无关，仅用于本次运行）。允许介质：'+sp.media+'</div>'+
          '<div class="run-tip" id="runTip"></div>'+
        '</div>'+
        '<button class="btn-run" id="btnRun" onclick="submitRun()">'+runLabel()+'</button>'+
      '</div>'+
    '</div>'+
    '<input type="file" id="fileInput" multiple accept=".tif,.tiff,.png,.jpg,.jpeg,.zip,.shp,.geojson,.csv,.xlsx" style="display:none" onchange="onFiles(this)">'+
  '</div>';
  t.params.forEach(function(p){
    if(p.type!=='range')return;
    var el=document.getElementById('pm_'+p.id),lab=document.getElementById('pmv_'+p.id);
    if(el&&lab)el.addEventListener('input',function(){lab.textContent=el.value+(p.unit||'');PVALS[p.id]=el.value;});
  });
  renderFiles();
  renderAuth();
}
function renderFiles(){
  var box=document.getElementById('fileList');if(!box)return;
  if(!FILES.length){
    box.innerHTML='<div class="pm-hint" style="margin:0;">尚未选择文件：该模型的必填输入数据不可为空</div>';
    return;
  }
  box.innerHTML=FILES.map(function(f,i){
    return '<div class="fi" title="'+String(f.name).replace(/"/g,'&quot;')+'"><span class="nm">'+f.name+'</span><span class="fsz">'+f.size+'</span>'+
      '<span class="rm" onclick="rmFile('+i+')">移除</span></div>';
  }).join('')+'<div class="pm-hint" style="margin:0;" title="已选 '+FILES.length+' 个文件 · 允许介质：'+specOf(CUR).media+'">已选 '+FILES.length+' 个文件 · 允许介质：'+specOf(CUR).media+'</div>';
}
function pickFiles(){
  var lr=lockReason();
  if(lr){toast(lr);return;}
  var el=document.getElementById('fileInput');if(el)el.click();
}
function onFiles(inp){
  var arr=Array.prototype.slice.call(inp.files||[]);
  FILES=FILES.concat(arr.map(function(f){return {name:f.name,size:fmtSize(f.size),type:f.type||'—'};}));
  inp.value='';renderFiles();
}
function rmFile(i){FILES.splice(i,1);renderFiles();}
function toggleAdv(){
  ADV_OPEN=!ADV_OPEN;
  var b=document.getElementById('paramBody'),t=document.getElementById('advToggle');
  if(b)b.style.display=ADV_OPEN?'':'none';
  if(t)t.textContent=ADV_OPEN?'高级参数：收起 ▴':'高级参数：展开 ▾';
}
function renderAuth(){
  var box=document.getElementById('authBand');if(!box)return;
  var h='';
  var detailHref='模型中心-模型详情 (调整).html#n='+encodeURIComponent(CUR.name);   /* 修正④：纯导航链接，不带 tab 参数 */
  if(!isCurVer(CUR)){
    h='<span class="ta-chip no">历史版本 '+selVerOf(CUR).v+' · 只读</span>'+
      '<span class="ta-note">历史版本<b>仅供复现</b>：可查看输入输出说明与版本说明，<b>不支持运行</b>（避免跑旧版本浪费算力）。</span>'+
      '<span class="ta-demo" onclick="pickCurVer()">回到当前版本 '+curVerOf(CUR).v+' →</span>';
  }else if(!LOGGED){
    /* 修正④：运行台内不造登录/申请控件，只提示登录（页头已有登录入口） */
    h='<span class="ta-chip no">未登录</span>'+
      '<span class="ta-note">请先登录/入驻平台（受邀制）；登录后还需获得该模型的使用授权，才能提交运行。</span>';
  }else if(!DEMO_AUTH){
    /* 修正④：未授权态只留一句提示文字 + 一个纯导航链接（申请这一动作只在模型详情页发生） */
    h='<span class="ta-chip no">未授权</span>'+
      '<span class="ta-note">该模型尚未授权，无法运行。授权由「申请调用」经审批通过后生效，<b>生效时系统自动签发个人密钥并下发该模型默认配额</b>（无需另行申请）。</span>'+
      '<a href="'+detailHref+'" style="font-size:12px;color:var(--blue);white-space:nowrap;">前往模型详情页 →</a>'+
      '<span class="ta-demo" onclick="toggleDemoAuth()">演示：模拟授权通过</span>';
  }else{
    h='<span class="ta-chip ok">已授权 · 生效中</span>'+
      '<span class="ta-note">授权生效，可直接提交数据运行；每次运行都会写入运行记录（按账号隔离），结果文件可下载留存。'+
      '<b>本页运行计入「被调用次数」（热度），不占用 API 配额</b>；每次运行同时写入<b>调用日志表</b>（与 API 调用同表、按来源字段区分，失败调用不计入）。API 调用的密钥与配额用量见个人中心「我的调用记录与密钥」。</span>'+
      '<span class="ta-demo" onclick="toggleDemoAuth()">演示：回到未授权态</span>';
  }
  box.innerHTML=h;
  syncLock();
}
function syncLock(){
  var lock=lockReason();
  var btn=document.getElementById('btnRun');
  if(btn){btn.disabled=!!lock;btn.textContent=lock?lockBtnText():runLabel();}
  ['colIn','colParam'].forEach(function(id){
    var el=document.getElementById(id);
    if(el)el.classList.toggle('dis',!!lock);
  });
  var ctrls=document.querySelectorAll('#paramBody input,#paramBody select');
  for(var i=0;i<ctrls.length;i++){ctrls[i].disabled=!!lock;}
  var fi=document.getElementById('fileInput');if(fi)fi.disabled=!!lock;
  var tip=document.getElementById('runTip');
  if(!tip)return;
  var base='平台内执行 · 你提交的数据仅用于本次运行 · 结果文件可下载留存';
  if(lock){
    tip.innerHTML='<b style="color:#b42318;">'+lock+'</b><br>'+base;
  }else if(CUR.exec==='async'){
    tip.innerHTML=base+'<br><b>异步任务</b>：提交后生成运行号，可关闭页面；<b>预计耗时 '+(CUR.eta||'约 1–3 分钟')+
      '</b>，进度与结果在本页与个人中心「我的运行记录」查看。';
  }else{
    tip.innerHTML=base+'<br><b>同步运行</b>：提交后先落库再出结果（同步只是耗时极短的异步运行），结果与结果文件同屏展示。';
  }
}

/* ===================================================================
   提交与状态流转（一套状态机）
   =================================================================== */
function errHintOf(){
  return '建议：按模型「输入输出规范」与「服务与接入信息 · 输入介质」核对文件格式、空间参考与参数取值后重新提交；本次失败未产生结果文件，也未占用算力配额。';
}
function baseRecord(c){
  return {
    id:nextId(), model:CUR.name, type:CUR.type, trigger:'运行台 · 提交我的数据',
    ver:selVerOf(CUR).v, status:'running',
    submit:'2026-07-01 10:30:12', finish:'—', dur:'—',
    src:{kind:'files',
      files:FILES.map(function(f){return {name:f.name,size:f.size,fmt:fmtOf(f.name)};}),
      note:'由「模型运行台」提交自有数据后生成；演示态不真实上传，仅记录文件名与大小。'},
    params:CUR.trial.params.map(function(p){
      return {k:p.label,v:String(c.v[p.id])+(p.unit||''),d:p.hint||('接口默认值 '+p.def+(p.unit||''))};
    }),
    tl:[], summary:null, results:[], progress:0, queueAhead:0, progressText:'', errShort:'',
    vals:c.v, brief:'', eta:CUR.eta||'约 1–3 分钟'
  };
}
function submitRun(){
  if(!canRun())return;
  if(!FILES.length){toast('请先提交运行数据：在「① 必填输入数据」选择文件');return;}
  var c=collect(CUR), err=validate(CUR,c.v), rec=baseRecord(c);
  if(err){
    rec.status='fail';rec.errShort=err;rec.err=err;rec.errHint=errHintOf();
    rec.finish='2026-07-01 10:30:20';rec.dur='8 秒（校验失败终止）';
    rec.tl=mkTl('fail',rec.id);rec.brief='失败：'+err;
    upsert(rec);SEL=rec.id;FILES=[];renderAll();
    toast('运行失败：'+err);
    return;
  }
  if(CUR.exec==='async'){
    rec.status='queued';rec.queueAhead=2;rec.progress=0;
    rec.progressText='排队中 · 前面还有 2 个任务';
    rec.tl=mkTl('queued',rec.id);rec.brief=rec.progressText;
    upsert(rec);SEL=rec.id;FILES=[];renderAll();
    toast('已提交运行 '+rec.id+'（异步任务 · 可关闭页面，进度与结果在本页）');
    return;
  }
  rec.status='running';rec.progress=6;rec.progressText='运行中 · 已处理 6%';
  rec.tl=mkTl('running',rec.id);rec.brief=rec.progressText;
  upsert(rec);SEL=rec.id;FILES=[];renderAll();
  runSync(rec);
}
function runSync(rec){
  if(TIMERS[rec.id])return;
  TIMERS[rec.id]=setInterval(function(){
    rec.progress=Math.min(92,(rec.progress||0)+8+Math.round(Math.random()*10));
    rec.progressText='运行中 · 已处理 '+rec.progress+'%';
    rec.brief=rec.progressText;
    upsert(rec);
    if(SEL===rec.id)renderRunPanels();else renderLeft();
  },120);
  setTimeout(function(){
    clearInterval(TIMERS[rec.id]);delete TIMERS[rec.id];
    finishRun(rec);
  },1500);
}
function finishRun(rec){
  var vals=rec.vals||defVals(CUR);
  var h=hash(JSON.stringify(vals)+(rec.id||''));
  var ms=(1.2+(h%180)/100);
  var r=renderResult(CUR,vals,h), bu=bigUnitOf(CUR);
  rec.status='done';rec.progress=100;rec.progressText='已完成';
  rec.dur=ms.toFixed(1)+' 秒';rec.finish='2026-07-01 10:31:12';
  rec.summary={big:bu.big,unit:bu.unit,label:'本次运行输出摘要',
    text:'本次运行输出：'+r.sum+'（演示数据）。运行记录按账号隔离保存在「模型运行台」，也可在个人中心「我的运行记录」查看与下载。'};
  rec.brief=r.sum;
  rec.results=resultFilesOf(CUR);
  rec.tl=mkTl('done',rec.id,rec.results.length);
  upsert(rec);
  if(SEL===rec.id)renderRunPanels();else renderLeft();
  toast('运行完成 · 耗时 '+ms.toFixed(1)+' 秒 · 生成 '+rec.results.length+' 个结果文件');
}
function resumeRuns(){
  myRuns().forEach(function(r){
    if(r.status==='running'&&(!r.results||!r.results.length)){
      r.vals=r.vals||defVals(CUR);
      r.progress=r.progress||20;
      r.progressText='运行中 · 已处理 '+r.progress+'%';
      runSync(r);
    }
  });
}
function cancelRun(){
  var r=selRec();
  if(!r){toast('请先选中一条运行记录');return;}
  if(r.status!=='queued'&&r.status!=='running'){toast('该次运行已结束，无法取消');return;}
  if(TIMERS[r.id]){clearInterval(TIMERS[r.id]);delete TIMERS[r.id];}
  r.status='cancel';r.progress=0;r.progressText='已取消';
  r.cancelText='用户在排队阶段取消运行，未产生结果文件，也未占用算力配额。取消后可随时重新提交。';
  r.dur='排队 40 秒后取消';r.finish='2026-07-01 10:30:40';r.brief=r.cancelText;
  r.tl=[{t:'已提交',at:'2026-07-01 10:30:12',n:'运行台提交自有数据，生成运行号 '+r.id,st:'pass'},
        {t:'排队中',at:'2026-07-01 10:30:13',n:'平台队列等待算力分配',st:'pass'},
        {t:'已取消',at:'2026-07-01 10:30:40',n:'用户在排队阶段取消运行，未占用算力配额',st:'cancel'}];
  upsert(r);renderRunPanels();
  toast('已取消运行 '+r.id+'（演示：状态机流转为「已取消」）');
}
function resubmit(id){
  var r=null;myRuns().forEach(function(x){if(x.id===id)r=x;});
  if(!r){toast('未找到该次运行的输入，请重新选择文件后提交');return;}
  FILES=((r.src&&r.src.files)||[]).map(function(f){return {name:f.name,size:f.size,type:'—'};});
  if(r.vals)PVALS=r.vals;
  renderInput();
  var el=document.getElementById('inputArea');
  if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'});
  toast('已回填该次运行的输入文件与参数，确认后点击「'+runLabel()+'」重新提交');
}

/* ===================================================================
   入口与渲染
   =================================================================== */
function renderAll(){syncSel();renderLeft();renderMain();renderInput();}
function renderRunPanels(){renderLeft();renderMain();}
function render(){
  var q=new URLSearchParams(location.search.slice(1)||location.hash.slice(1));
  var name=q.get('n')||MD[0].name;
  var rid=q.get('run')||q.get('t')||'';    /* 与详情页/列表页/承接页约定：?n=<模型名>&run=<运行号> */
  if(!q.get('n')&&rid){                    /* 旧深链只给运行号时，按运行号反查所属模型 */
    var hit=null;
    loadAll().forEach(function(r){if(r&&r.id===rid)hit=r;});
    if(hit)name=hit.model;
  }
  CUR=MD.filter(function(x){return x.name===name;})[0]||MD[0];
  CUR._v=q.get('v')||null;                 /* ?v=v2.2 直达历史版本（只读） */
  document.title='模型运行台 · '+CUR.name+' — 北大荒智慧农业协同创新平台';
  document.getElementById('crumbModel').textContent=CUR.name;
  document.getElementById('crumbModel').href='模型中心-模型详情 (调整).html#n='+encodeURIComponent(CUR.name);
  ensureSeed();
  if(rid)SEL=rid;                          /* ?run= 指定运行号：直接选中该条运行 */
  syncSel();
  renderAll();
  resumeRuns();
}
render();
</script>

<script id="portal-complete-script">
(function(){
 const dialog=document.getElementById('portalComplete');
 const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 window.portalEscape=escape;
 window.portalModal=function(title,body,footer=''){if(dialog.open)dialog.close();dialog.innerHTML='<div class="pcx-head"><h2 id="pcxTitle">'+escape(title)+'</h2><button type="button" data-pcx-close aria-label="关闭">×</button></div><div class="pcx-body">'+body+'</div><div class="pcx-foot">'+footer+'<button type="button" data-pcx-close>关闭</button></div>';dialog.showModal();};
 window.portalClose=()=>dialog.close();
 function records(){try{return JSON.parse(localStorage.getItem('bdh-consultations-v1')||'[]')}catch{return []}}
 window.portalConsultRecords=function(){const items=records();portalModal('咨询与反馈记录','<p class="pcx-note">仅显示当前浏览器保存的原型记录，未发送至平台。</p>'+(items.length?items.map(x=>'<article class="pcx-record"><strong>'+escape(x.kind)+' · '+escape(x.id)+'</strong><p>'+escape(x.description)+'</p><span>'+escape(x.org)+' · '+escape(x.contact)+' · '+escape(x.time)+'</span><p class="pcx-note">已保存 · 待平台对接（演示状态）</p></article>').join(''):'<p>暂无记录。填写咨询或问题反馈后，可在这里查看。</p>'),'<button onclick="portalConsult()">新增咨询</button>');};
 window.portalConsult=function(kind='机构合作'){
 portalModal(kind==='使用问题'?'问题反馈':'合作咨询',`<p class="pcx-note">原型演示：信息仅保存在当前浏览器，不发送真实消息。</p><form id="pcxForm"><div class="pcx-grid"><label>咨询类型 *<select name="kind">${['机构合作','加入平台','私有化部署','API 与订阅','课题咨询','使用问题'].map(x=>`<option ${x===kind?'selected':''}>${x}</option>`).join('')}</select></label><label>单位名称 *<input name="org" required maxlength="80" placeholder="填写单位全称"></label><label>联系人 *<input name="contact" required maxlength="30" placeholder="填写姓名"></label><label>联系电话 / 邮箱 *<input name="reply" required maxlength="100" placeholder="填写可联系的电话或邮箱"></label><label class="full">咨询内容 *<textarea name="description" required minlength="10" maxlength="2000" placeholder="请说明合作方向、业务需求或遇到的问题（至少10字）"></textarea></label></div><p id="pcxError" class="pcx-error" role="alert" hidden></p></form>`,`<button type="button" onclick="portalConsultRecords()">查看记录</button><button type="submit" class="primary" form="pcxForm">提交</button>`);
 const f=document.getElementById('pcxForm');f.onsubmit=function(e){e.preventDefault();const x=Object.fromEntries(new FormData(f));Object.keys(x).forEach(k=>x[k]=x[k].trim());const err=document.getElementById('pcxError');if(!x.org||!x.contact||x.description.length<10||!(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x.reply)||/^\+?[\d\s()\-]{7,25}$/.test(x.reply))){err.hidden=false;err.textContent='请补全单位、联系人、至少10字的内容，并填写有效电话或邮箱。';return;}x.id='ZX-'+Date.now().toString(36).toUpperCase();x.time=new Date().toLocaleString('zh-CN',{hour12:false});try{localStorage.setItem('bdh-consultations-v1',JSON.stringify([x,...records()]));}catch{err.hidden=false;err.textContent='浏览器无法保存，请保留当前表单后重试。';return;}portalModal('提交记录已保存','<div class="pcx-success"><strong>'+escape(x.id)+'</strong><p>'+escape(x.kind)+' · '+escape(x.org)+'</p><p>您的咨询内容与联系方式已记录。</p></div><p class="pcx-note">此为原型演示记录，未发送至平台。可在「联系支持 → 查看咨询记录」再次查看。</p>','<button class="primary" onclick="portalConsultRecords()">查看记录</button>');};};
 window.portalSaveApplication=function(record){const key='bdh-model-applications-v1';try{const list=JSON.parse(localStorage.getItem(key)||'[]');const item={...record,id:'AP-'+Date.now().toString(36).toUpperCase(),date:new Date().toLocaleDateString('sv-SE'),status:'审核中'};localStorage.setItem(key,JSON.stringify([item,...list]));return item;}catch{return null}};
 window.portalApplicationReceipt=function(item){portalModal('申请记录已保存','<div class="pcx-success"><strong>'+escape(item.id)+'</strong><p>'+escape(item.name)+'</p><p>状态：审核中</p></div><p class="pcx-note">原型演示记录保存在当前浏览器，不启动真实审批或分配资源。</p>','<a class="pcx-link" href="个人中心-高保真原型.html#models?tab=applications">查看申请记录</a>');};
 const routes={'首页':'index.html','模型中心':'模型中心-模型列表页（调整）.html','数据中心':'数据中心-数据集列表页.html','科研开发空间':'科研开发空间-交互原型(10).html','课题中心':'课题中心-高保真原型.html','需求中心':'需求中心-高保真原型 (1).html','个人中心':'个人中心-高保真原型.html','关于平台':'关于平台-平台介绍.html'};
 document.addEventListener('click',e=>{const close=e.target.closest('[data-pcx-close]');if(close){dialog.close();return;}const b=e.target.closest('[data-consult],[data-feedback],[data-consult-records],[data-shell],[data-external]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();if(b.hasAttribute('data-consult-records'))portalConsultRecords();else if(b.hasAttribute('data-consult')||b.hasAttribute('data-feedback'))portalConsult(b.hasAttribute('data-feedback')?'使用问题':'机构合作');else{const key=b.dataset.shell||b.dataset.external;if(routes[key])location.href=routes[key];}},true);
 dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
})();
</script>
