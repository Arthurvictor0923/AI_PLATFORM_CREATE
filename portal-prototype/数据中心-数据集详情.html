<!--
数据中心 · 数据集详情页（魔搭式 · 2026-09-08 用户拍板"按照这个做"）
结构对齐魔搭数据集详情页：
  ① 面包屑 + 页头信息条：图标/名称 + 标签（专区/专题/形态）+ 提供方@ + 【更新·申请次数·规模】统计条；
  ① 面包屑（两级：数据中心／数据名称）+ 页头信息条：图标/名称 + 标签（专区/专题/形态）+ 提供方@ + 【@提供方 | 申请 | 更新 | 规模】无框文本行 + 右侧「申请使用（科研开发空间）」；
  ② Tab 区：数据介绍 / 数据预览（数据文件功能应收敛——数据不出域，文件结构信息并入元数据卡的数据格式/规模，不再单独提供下载/文件Tab）；
  ③ 左主列 README 式：文档标题 + Abstract + 形态角色；预览（表格/影像）；
  ④ 右信息栏：数据卡元数据（仅核心：名称/所属专题/数据形态/作物类型/数据年份；提供方顶部已展示、不设数据格式）+ 红线；
  ⑤ 底部无独立区块（"收录本数据集的合集"已去掉；所属专题已在页头标签与元数据卡展示）。
数据驱动：列表任一张单类卡 ?n=名称 进入渲染。单类卡=申请/授权最小单元。皮肤 V7。
数据形态轴（字典共 8 值，⭐0910 重新界定）：A 单类=地面实测/无人机影像/卫星影像/遥感反演产品/遥感解译产品/业务申报数据；B 聚合=栅格影像合集/结构化表。合集=同质数据的可申请单类数据卡(如 1000 景栅格合集，form=栅格影像合集)；关联=两个合集之间的外键连接说明(如 地块编码+年份)，仅做只读说明提醒，由用户在科研开发空间(科研开发空间)自行按连接键组合，数据中心不做目录 join、不提供联合分析入口。消费视图：geo→富文本+「进入影像查询」；非geo→结构化表部分展示(富文本，无"查看数据样例"按钮)。

=== ⭐2026-09-15 变更（按《看板取数溯源与业务闭环检查》断点清单，只改断点涉及条目，未动皮肤）===
  ① 【断点 B8 · 区域】详情页新增「区域（行政区划）」：页头标签 + 元数据卡行。
     此前详情页无该字段，而列表页已有「区域」筛选维度 → 详情页与筛选维度不一致。
     取值规则：ZONE_REGION（按专题分区）→ CATALOG_REGION（公共数据按条目）→ '全域'。
     口径依据：0910 拍板"后台上架数据时必须界定数据的区域（行政区划）"，字典由后台「参数与字典」维护。
  ② 【断点 B18 · 权属】详情页新增「数据来源 / 权属归属 / 授权范围」三行。
     背景：检查发现两条上传路径权属字段不一致（结题登记＝产权声明；自由上传＝产权/来源/可否对外/用途，

     真实产品中字段来自「成果提交」表单（个人中心·我的成果与提交记录 / 我的上传）。
  ③ 【断点 B4 相关 · 取数口径】页头「申请」计数挂 title 口径说明
     （申请次数＝按数据卡统计，供"资产活性视图"取数；不含已撤回申请）。
  ④ 【待确认·未实现】「开放数据集市 ≥5」的界面落点未定（是否落在"高质量数据集专区"或新增标识），

<style>
:root{
  /* —— 设计变量（《数据中心三类页面前端样式规范》V1.0）—— */
  --brand:#005653; --brand-hover:#004542;
  --brand-soft:#edf6f2; --page-bg:#f4f8f5;
  --surface:#fff; --text:#10213a;
  --text-secondary:#526078; --text-muted:#6b778c;
  --border:#dce5e9; --footer-bg:#00504e;
  --error:#b42318; --disabled-bg:#f1f3f5;
  --radius-sm:4px; --radius-md:8px;
  --control-height:36px; --header-height:64px;
  --content-max:1800px; --layout-gap:16px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --shadow:0 2px 8px rgba(16,33,58,.06);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:var(--font-ui);font-size:14px;line-height:22px;color:var(--text);
  background:var(--page-bg);-webkit-font-smoothing:antialiased;
  min-height:100dvh;display:flex;flex-direction:column;
}
a{color:var(--brand);text-decoration:none;}
a:hover{color:var(--brand-hover);}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;}
input,select,textarea{font:inherit;color:inherit;}
.ico{width:16px;height:16px;flex-shrink:0;display:block;}
.container{width:100%;max-width:var(--content-max);margin:0 auto;padding-inline:clamp(24px,3.65vw,56px);}
.app-main{flex:1;min-width:0;}

/* ==================== 公共导航 ==================== */
.site-header{position:sticky;top:0;z-index:100;height:var(--header-height);background:var(--surface);border-bottom:1px solid var(--border);}
.header-inner{display:flex;align-items:center;gap:var(--s5);height:var(--header-height);}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand span{font-size:22px;line-height:30px;font-weight:600;color:var(--text);white-space:nowrap;}
.main-nav{display:flex;align-items:center;height:var(--header-height);margin-left:var(--s4);flex:1;min-width:0;overflow:hidden;}
.main-nav a,.main-nav button{
  position:relative;display:inline-flex;align-items:center;height:var(--header-height);
  padding:0 16px;font-size:14px;line-height:22px;color:var(--text-secondary);
  white-space:nowrap;background:none;border:0;cursor:pointer;transition:color .2s;
}
.main-nav a:hover,.main-nav button:hover{color:var(--brand);}
.main-nav .active{color:var(--brand);font-weight:600;}
.main-nav .active::after{content:'';position:absolute;left:16px;right:16px;bottom:-1px;height:3px;border-radius:2px 2px 0 0;background:var(--brand);}
.header-actions{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.btn-login{display:inline-flex;align-items:center;justify-content:center;height:var(--control-height);padding:0 16px;font-size:14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;color:var(--text);white-space:nowrap;transition:all .2s;}
.btn-login:hover{color:var(--brand);border-color:var(--brand);}
.btn-brand{display:inline-flex;align-items:center;justify-content:center;height:var(--control-height);padding:0 16px;font-size:14px;font-weight:500;border-radius:var(--radius-sm);background:var(--brand);color:#fff;white-space:nowrap;transition:background .2s;}
.btn-brand:hover{background:var(--brand-hover);color:#fff;}
.u-box{display:flex;align-items:center;gap:8px;position:relative;}
.u-avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.u-name{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--text);cursor:pointer;white-space:nowrap;}
.u-name .u-chev{width:13px;height:13px;color:var(--text-muted);}
.u-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;min-width:176px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:var(--s1);z-index:200;}
.u-menu.open{display:block;}
.u-mi{display:block;padding:8px 12px;font-size:14px;color:var(--text-secondary);border-radius:var(--radius-sm);cursor:pointer;white-space:nowrap;}
.u-mi:hover{background:var(--brand-soft);color:var(--brand);}
.u-mi.out{color:var(--error);}
.u-mi.out:hover{background:#fdf6f4;color:var(--error);}

/* ==================== 面包屑（内容区 32–40px） ==================== */
.crumb{display:flex;align-items:center;gap:8px;height:36px;font-size:14px;color:var(--text-muted);overflow:hidden;}
.crumb a{color:var(--text-secondary);}
.crumb a:hover{color:var(--brand);text-decoration:underline;}
.crumb .sep{color:var(--border);}
.crumb .cur{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ==================== 摘要面板 ==================== */
.summary{display:flex;gap:var(--s5);align-items:flex-start;padding:var(--s5);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);}
/* ⭐0917 摘要卡左侧＝缩略图（与列表页同一套形态映射），不再用单枚类型图标
   —— 示意图（详情页数据预览更新.png）左侧为影像/示意表缩略图，尺寸与列表页卡一致 168×112。
   降级态（无对应素材）退回浅绿底居中线性图标，由 .head-thumb.thumb-tinted 承载。 */
.summary .head-thumb{flex:0 0 168px;width:168px;height:112px;border-radius:var(--radius-md);overflow:hidden;background:var(--brand-soft);border:1px solid var(--border);position:relative;}
.summary .head-thumb img,.summary .head-thumb svg.tt{width:100%;height:100%;object-fit:cover;display:block;}
.summary .head-thumb.thumb-tinted{display:flex;align-items:center;justify-content:center;}
.summary .head-thumb.thumb-tinted .ico-fallback{width:36px;height:36px;color:var(--brand);opacity:.32;}
.summary .head-thumb.tt-tab{background:var(--surface);padding:6px;}
.summary .head-thumb.tt-tab table{width:100%;border-collapse:collapse;font-size:8px;line-height:13px;table-layout:fixed;}
.summary .head-thumb.tt-tab th,.summary .head-thumb.tt-tab td{border:1px solid #e3eced;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.summary .head-thumb.tt-tab th{background:var(--brand-soft);color:var(--text-secondary);font-weight:400;text-align:left;}
.summary .head-thumb.tt-tab td{color:var(--text-muted);}
.summary .head-thumb.tt-tab td.em{color:var(--text);}
.summary .head-thumb .tt-leg{display:flex;gap:8px;width:100%;height:100%;padding:10px;background:#f1f6ee;}
.summary .head-thumb .tt-leg-bar{display:flex;flex-direction:column;flex:0 0 22px;border-radius:3px;overflow:hidden;}
.summary .head-thumb .tt-leg-bar i{flex:1;}
.summary .head-thumb .tt-leg-lab{display:flex;flex-direction:column;justify-content:space-between;font-size:9px;line-height:12px;color:var(--text-secondary);}
.summary .head-left{flex:1;min-width:0;}
.head-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.head-top h1{font-size:26px;line-height:36px;font-weight:600;color:var(--text);overflow-wrap:anywhere;}
.head-desc{margin-top:8px;font-size:14px;line-height:22px;color:var(--text-secondary);}
.head-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.head-sub{margin-top:10px;font-size:14px;line-height:22px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.head-sub .at{color:var(--text-muted);}
.head-sub b{color:var(--text);font-weight:600;}
.head-meta{margin-top:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--text-muted);}
.hm-item{display:inline-flex;align-items:baseline;gap:5px;}
.hm-item .h-v{font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;}
.hm-sep{color:var(--border);}
.head-right{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:220px;padding-top:4px;}
.authorize-note{font-size:12px;line-height:18px;color:var(--text-muted);text-align:right;white-space:nowrap;}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius-sm);background:var(--brand-soft);color:#0f4a45;font-size:12px;line-height:18px;white-space:nowrap;}
.btn-apply{display:inline-flex;align-items:center;justify-content:center;height:var(--control-height);padding:0 20px;font-size:14px;font-weight:500;border-radius:var(--radius-sm);background:var(--brand);color:#fff;white-space:nowrap;transition:background .2s;}
.btn-apply:hover{background:var(--brand-hover);color:#fff;}
.btn-apply.is-pending{background:#a9bdb9;cursor:default;}
.btn-apply.is-pending:hover{background:#a9bdb9;}

/* ==================== 主体：左 65% / 右 35% ==================== */
.detail{display:grid;grid-template-columns:minmax(0,65fr) minmax(320px,35fr);gap:var(--layout-gap);align-items:start;margin-top:var(--layout-gap);padding-bottom:var(--s6);}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);}
.main-col{min-width:0;overflow:hidden;}
.side-col{position:sticky;top:calc(var(--header-height) + 16px);display:flex;flex-direction:column;gap:var(--layout-gap);}

/* 页签（高 44px，选中深绿半粗 + 3px 下划线） */
.tabs{display:flex;align-items:center;gap:var(--s5);height:44px;padding:0 var(--s4);border-bottom:1px solid var(--border);}
.tab{position:relative;height:44px;display:inline-flex;align-items:center;font-size:14px;color:var(--text-secondary);transition:color .2s;}
.tab:hover{color:var(--brand);}
.tab.on{color:var(--brand);font-weight:600;}
.tab.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;border-radius:2px 2px 0 0;background:var(--brand);}
.tabpane{padding:var(--s4) var(--s5) var(--s5);}

/* 文档标题行 */
.doc-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:var(--s4);}
.doc-hd .doc-n{font-size:16px;line-height:24px;font-weight:600;color:var(--text);}
.doc-hd .doc-t{font-size:12px;line-height:18px;color:var(--text-muted);}
.panel-title{font-size:16px;line-height:24px;font-weight:600;color:var(--text);padding:var(--s4) var(--s4) 0;}

/* ==================== 富文本容器（实际内容容器） ==================== */
.rich-text{font-size:14px;line-height:24px;color:var(--text-secondary);}
.rich-text p{margin:0 0 12px;}
.rich-text p:last-child{margin-bottom:0;}
.rich-text h4{font-size:16px;line-height:24px;font-weight:600;color:var(--text);margin:20px 0 8px;}
.rich-text h4:first-child{margin-top:0;}
.rich-text ul,.rich-text ol{margin:0 0 12px;padding-left:20px;}
.rich-text ul{list-style:disc;}
.rich-text ol{list-style:decimal;}
.rich-text li{margin:4px 0;}
.rich-text b,.rich-text strong{color:var(--text);font-weight:600;}
.rich-text img{max-width:100%;height:auto;}
.rich-text table{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:13px;line-height:20px;}
.rich-text th,.rich-text td{border:1px solid var(--border);padding:8px;}
.rich-text th{background:var(--brand-soft);color:var(--text);font-weight:600;text-align:left;white-space:nowrap;}
.rich-text td{color:var(--text-secondary);}
.intro-body{font-size:14px;line-height:24px;color:var(--text-secondary);}
.intro-hint{margin-top:12px;font-size:12px;line-height:18px;color:var(--text-muted);}
.rel-note{margin-top:8px;padding:12px 14px;border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:var(--radius-sm);font-size:14px;line-height:24px;color:var(--text-secondary);}
.rel-note b{color:var(--brand);font-weight:600;}
.sec-title{font-size:16px;line-height:24px;font-weight:600;color:var(--text);margin:20px 0 8px;}

/* ==================== 数据预览（⭐0916 v17.0：按用户新参考示意图重做）
   结构＝ 说明小字 → 样本区（样本标题 / 左图像 + 右「字段 | 样例值」表 / 图注）
          → 「观测描述」+ 正文 → 「图文问答样例」→ 「字段说明」表 → 完整使用条件
   口径：本区为“演示样例，仅展示内容结构，不代表真实观测结果”，故采用**固定演示内容**（非逐条按形态分支）；
        字段说明是“字段字典”的预览子集，完整字典与使用条件指向数据介绍。 */
.pv-intro{margin-bottom:12px;font-size:12px;line-height:18px;color:var(--text-muted);}
.pv-sample{margin-bottom:var(--s5);}
.pv-sample:last-of-type{margin-bottom:0;}
.pv-s-title{font-size:16px;line-height:24px;font-weight:600;color:var(--text);margin:0 0 10px;}
.pv-s-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s4);align-items:start;}
.pv-shot{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--brand-soft);}
.pv-shot img,.pv-shot svg{display:block;width:100%;height:auto;}
.pv-cap{margin-top:6px;font-size:12px;line-height:18px;color:var(--text-muted);}
.pv-scroll{overflow-x:auto;}
.pv-kv{width:100%;border-collapse:collapse;font-size:13px;line-height:20px;}
.pv-kv th,.pv-kv td{border:1px solid var(--border);padding:8px;text-align:left;vertical-align:top;}
.pv-kv th{background:var(--brand-soft);color:var(--text);font-weight:600;white-space:nowrap;}
.pv-kv td{color:var(--text-secondary);}
.pv-kv td.k{color:var(--text-muted);white-space:nowrap;width:38%;}
.pv-kv td.v{color:var(--text);}
/* 图文问答样例 */
.pv-qa{margin:14px 0 0;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--page-bg);}
.pv-qa .q{font-size:14px;line-height:22px;color:var(--text);font-weight:600;}
.pv-qa .a{margin-top:6px;font-size:14px;line-height:22px;color:var(--text-secondary);}
.pv-qa .a b{color:var(--text);font-weight:600;}
.pv-note{margin-top:8px;font-size:12px;line-height:18px;color:var(--text-muted);}
.pv-actions{margin-top:var(--s4);}
.pv-go{display:inline-flex;align-items:center;gap:6px;height:var(--control-height);padding:0 16px;font-size:14px;font-weight:500;border-radius:var(--radius-sm);background:var(--brand);color:#fff;cursor:pointer;transition:background .2s;}
.pv-go:hover{background:var(--brand-hover);color:#fff;}

/* ---- 结构化数据的表格预览（⭐0917 补回：此前统一改成样本区，把结构化数据的表格吃掉了）
   口径：结构化型（地面实测 / 业务申报数据 / 结构化表）→ 表格预览，数据取各条 DS 的 preview 字段；
        表格样式沿用 .rich-text table 体系，但独立命名 .pv-tbl，避免富文本样式外溢。 */
.pv-tbl-wrap{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
/* 窄屏宽表横向滚动：容器内滚动，不撑破页面（overX 恒 0）；
   两侧滚动提示阴影＝纯 radial 渐变，不铺不透明底色，避免遮住表头/悬停底色 */
.pv-tbl-scroll{overflow-x:auto;background:
  radial-gradient(farthest-side at 0 50%, rgba(16,33,58,.13), rgba(16,33,58,0)),
  radial-gradient(farthest-side at 100% 50%, rgba(16,33,58,.13), rgba(16,33,58,0)) 100% 0;
  background-repeat:no-repeat;background-size:14px 100%,14px 100%;background-attachment:scroll,scroll;}
.pv-tbl{width:100%;border-collapse:collapse;font-size:13px;line-height:20px;}
.pv-tbl th,.pv-tbl td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:9px 12px;text-align:left;white-space:nowrap;}
.pv-tbl th:last-child,.pv-tbl td:last-child{border-right:0;}
.pv-tbl tbody tr:last-child td{border-bottom:0;}

/* 统一一级导航 + 0924 统一登录态（登录后出现「个人中心」入口） */
(function () {
  var CFG = window.__BDH_NAV__ || {};
  var ME = CFG.me || "";
  var SELF = !!CFG.self;

  /* ---- 占位提示兜底：优先复用页面自带的 toast ---- */
  function bdhToast(msg) {
    var f = window.showToast || window.toast;
    if (typeof f === "function") { try { f(msg); return; } catch (e) {} }
    var el = document.getElementById("bdhToast");
    if (!el) {
      el = document.createElement("div");
      el.id = "bdhToast";
      el.style.cssText = "position:fixed;left:50%;bottom:40px;transform:translateX(-50%);padding:10px 20px;"
        + "background:rgba(16,33,58,.92);color:#fff;font-size:14px;border-radius:4px;z-index:600;"
        + "transition:opacity .2s;pointer-events:none;";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = "1";
    clearTimeout(window.__bdhToastTimer);
    window.__bdhToastTimer = setTimeout(function () { el.style.opacity = "0"; }, 2600);
  }
  window.bdhToast = bdhToast;

  /* ================= 统一登录态 ================= */
  function authRoots() {
    var out = [];
    var a = document.querySelector(".header-actions");
    if (a) { out.push(a); }
    var m = document.getElementById("bdhMobileMenu") || document.getElementById("mobileMenu");
    if (m) { out.push(m); }
    return out;
  }
  function visibleLogin(el) { return el.querySelector("[data-bdh-login]:not([data-bdh-hidden])"); }

  function mk(tag, cls, txt) {
    var n = document.createElement(tag);
    n.className = cls;
    if (txt) { n.textContent = txt; }
    return n;
  }
  function mkMe() {
    var a = mk("a", "bdh-me", "个人中心");
    a.setAttribute("data-bdh-me", "");
    a.href = ME;
    return a;
  }
  function mkOut() {
    var b = mk("button", "bdh-logout", "退出");
    b.type = "button";
    b.setAttribute("data-bdh-logout", "");
    return b;
  }
  function mkUser() {
    var s = mk("span", "bdh-user");
    s.setAttribute("data-bdh-user", "");
    s.appendChild(mk("span", "bdh-avatar", "张"));
    s.appendChild(mk("span", "bdh-name", "张研究员"));
    return s;
  }
  function clearMine(el) {
    var ns = el.querySelectorAll("[data-bdh-me],[data-bdh-logout],[data-bdh-user]");
    for (var i = 0; i < ns.length; i++) {
      if (ns[i].parentNode) { ns[i].parentNode.removeChild(ns[i]); }
    }
  }
  function insertAfter(anchor, node) {
    anchor.parentNode.insertBefore(node, anchor.nextSibling);
    return node;
  }
  function syncRoot(el) {
    var mobile = el.classList.contains("mobile-menu");
    if (SELF && !mobile) { return; }                  /* 个人中心页桌面不插自链 */
    if (visibleLogin(el)) { clearMine(el); return; }  /* 未登录 */
    if (el.querySelector("[data-bdh-me]")) { return; }/* 已有入口 */

    /* —— 已登录：补「个人中心」入口 —— */
    var hidden = el.querySelector("[data-bdh-login]");
    var nodes = [mkMe()];
    if (!SELF && hidden) { nodes.push(mkOut()); }     /* 本容器有可复原的登录按钮才给「退出」 */

    if (mobile) {
      var last = hidden;
      if (last) { for (var i = 0; i < nodes.length; i++) { last = insertAfter(last, nodes[i]); } }
      else { for (var k = 0; k < nodes.length; k++) { el.appendChild(nodes[k]); } }
      return;
    }
    var ident = el.querySelector(".u-box, .signed-user, .pc-user, .bdh-user");
    if (!ident) {
      ident = mkUser();
      if (hidden && hidden.parentNode === el) { el.insertBefore(ident, hidden); }
      else { el.insertBefore(ident, el.firstChild); }
    }
    var after = ident;
    for (var j = 0; j < nodes.length; j++) { after = insertAfter(after, nodes[j]); }
  }
  function syncAuth() {
    var roots = authRoots();
    for (var i = 0; i < roots.length; i++) { syncRoot(roots[i]); }
  }
  window.bdhSyncAuth = syncAuth;

  function hideLogins() {
    var bs = document.querySelectorAll("[data-bdh-login]");
    for (var i = 0; i < bs.length; i++) {
      bs[i].setAttribute("data-bdh-hidden", "");

  function showLogins() {
    var bs = document.querySelectorAll("[data-bdh-login]");
    for (var i = 0; i < bs.length; i++) {
      bs[i].removeAttribute("data-bdh-hidden");
      bs[i].style.display = "";
    }
  }
  /* doLogout() 会写回旧式登录按钮（.btn-login / onclick=doLogin）⇒ 归一化 */
  function normalizeLogins() {
    var sel = ".header-actions .btn-login,.header-actions .header-btn-login,"
      + ".header-actions a[onclick*='doLogin'],.header-actions button[onclick*='doLogin'],"
      + ".header-actions #login,.header-actions [onclick*='showLoginEntry']";
    var bs = document.querySelectorAll(sel);
    for (var i = 0; i < bs.length; i++) {
      bs[i].setAttribute("data-bdh-login", "");
      bs[i].removeAttribute("onclick");
      bs[i].classList.add("login-link");
    }
  }
  function signIn() {
    if (typeof window.doLogin === "function") { try { window.doLogin(); } catch (e) {} }
    normalizeLogins();
    hideLogins();
    document.body.classList.add("bdh-signed");
    syncAuth();
  }
  function signOut() {
    if (typeof window.doLogout === "function") { try { window.doLogout(); } catch (e) {} }
    normalizeLogins();
    showLogins();
    document.body.classList.remove("bdh-signed");
    syncAuth();
  }
  window.bdhSignIn = signIn;

  /* 包装页面自带登录/登出/重渲染：任何入口登录完都补上「个人中心」 */
  (function () {
    var wrap = function (name, after) {
      var orig = window[name];
      if (typeof orig !== "function") { return; }
      window[name] = function () {
        var r = orig.apply(this, arguments);
        try { after(); } catch (e) {}
        return r;
      };
    };
    wrap("doLogin", function () {
      normalizeLogins(); hideLogins(); document.body.classList.add("bdh-signed"); syncAuth();
    });
    wrap("renderAuthArea", function () { normalizeLogins(); syncAuth(); });
    wrap("doLogout", function () {
      normalizeLogins(); showLogins(); document.body.classList.remove("bdh-signed"); syncAuth();
    });
  })();

  function initAuth() {
    if (SELF) { hideLogins(); }
    normalizeLogins();
    syncAuth();
  }

  /* ---- 委托：登录 / 退出 / 占位提示 / 移动菜单 ---- */
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || !t.closest) { return; }
    var lb = t.closest("[data-bdh-login]");
    if (lb) {
      e.preventDefault();
      /* 门户页把「关闭菜单」挂在 #mobileMenu 上，冒泡时先于本监听执行 ⇒
         不能靠 .open 类判断，改看「点击是否发生在移动菜单内」，
         登录后同步把菜单重新展开，好让用户立刻看到新出现的「个人中心」入口 */
      var menu = document.getElementById("bdhMobileMenu") || document.getElementById("mobileMenu");
      var inMenu = !!(menu && (menu === lb || menu.contains(lb)));
      signIn();
      if (inMenu && menu) {
        setTimeout(function () {
          menu.classList.add("open");
          var tg = document.getElementById("bdhMenuToggle") || document.getElementById("menuToggle");
          if (tg) { tg.setAttribute("aria-expanded", "true"); }
        }, 0);
      }
      return;
    }
    if (t.closest("[data-bdh-logout]")) { e.preventDefault(); signOut(); return; }
    var tt = t.closest("[data-bdh-toast]");
    if (tt) { e.preventDefault(); bdhToast(tt.getAttribute("data-bdh-toast")); return; }
    var m = t.closest("#bdhMenuToggle");
    if (m) {
      var mu = document.getElementById("bdhMobileMenu");
      if (mu) {
        var open = mu.classList.toggle("open");
        m.setAttribute("aria-expanded", open ? "true" : "false");
        m.setAttribute("aria-label", open ? "关闭菜单" : "打开菜单");

    }
  });
  document.addEventListener("keydown", function (e) {

    var menu = document.getElementById("bdhMobileMenu");
    var m = document.getElementById("bdhMenuToggle");
    if (menu && menu.classList.contains("open")) {
      menu.classList.remove("open");
      if (m) { m.setAttribute("aria-expanded", "false"); m.focus(); }
    }
  });

  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", initAuth); }
  else { initAuth(); }
})();

        '</section>';
      /* 字段说明（字段字典的预览子集） */
      out+='<section class="pv-sample">'+
        '<h4 class="pv-s-title">字段说明</h4>'+
        '<div class="pv-scroll"><table class="pv-kv"><thead><tr><th>字段</th><th>含义</th><th>格式</th></tr></thead><tbody>'+
        P.fields.map(function(r){return '<tr><td class="k">'+r[0]+'</td><td class="v">'+r[1]+'</td><td class="v">'+r[2]+'</td></tr>';}).join('')+
        '</tbody></table></div>'+
        '<p class="pv-note">'+P.fieldsNote+'</p>'+
        '</section>';
    }
    /* ③ 影像类数据：两种形态之后统一给「进入影像查询」入口（不改业务流） */
    if(geo){
      out+='<div class="pv-actions"><span class="pv-go" data-name="'+d.name+'" data-form="'+d.form+'" data-zn="'+zn+'" onclick="openMapEngineFromEl(this)">进入影像查询 →</span></div>';
    }
    return out;
  }
  function openMapEngine(name, form, region){
    location.href='map-engine.html#ds='+encodeURIComponent(name)+'&product='+encodeURIComponent(form)+'&region='+encodeURIComponent(region||'');
  }
  function openMapEngineFromEl(el){
    openMapEngine(el.getAttribute('data-name'), el.getAttribute('data-form'), el.getAttribute('data-zn'));
  }
  /* Tab 切换 */
  var curTab='intro';
  function switchTab(t){
    curTab=t;
    document.querySelectorAll('.tabs .tab').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-t')===t);});
    ['intro','preview'].forEach(function(p){document.getElementById('pane-'+p).style.display=(p===t)?'':'none';});
  }

  /* ===== 数据介绍（富文本由个人中心维护，详情页仅展示；关键参数按数据合集类型针对性列举，供开发沟通） ===== */
  /* 关键参数按数据形态（数据合集名）派生，作为介绍正文的一部分展示；非平台自动抓取，实际由提供方在个人中心填写 */
  function keyParamsOf(d){
    var y=String(d.year);
    if(d.form==='地面实测'){
      return [['观测方式','网格化地面定点实测'],['核心指标','株高 / LAI / 叶绿素SPAD / 物候期'],['样本规模', d.scale||'—'],['采集年份', y]];
    }
    if(d.form==='业务申报数据'){
      return [['内容','申报主体 / 地块 / 作物 / 面积（脱敏）'],['用途','与遥感实测比对核查'],['采集年份', y]];
    }
    if(d.form==='无人机影像'){
      return [['分辨率','≥5cm（正射）'],['航高','按飞行任务'],['覆盖地块', (d.scale&&d.scale!=='≥5cm')?d.scale:'—'],['采集年份', y]];
    }
    if(d.form==='卫星影像'){
      return [['传感器','多源（GF 系列 / Sentinel-2 / Landsat-8 等）'],['时相','关键物候期'],['坐标系','CGCS2000'],['更新频率','多时相']];
    }
    if(d.form==='遥感反演产品'){
      return [['分辨率','与源影像一致'],['坐标系','CGCS2000'],['更新频率','随源影像迭代'],['空间形态','栅格']];
    }
    if(d.form==='遥感解译产品'){
      return [['精度','图斑级'],['坐标系','CGCS2000'],['时相','关键期 / 年度'],['空间形态','矢量图斑']];
    }
    if(d.form==='栅格影像合集'){
      return [['分辨率','逐景一致'],['时相','全生育期多期'],['坐标系','CGCS2000'],['规模', d.scale||'—']];
    }
    if(d.form==='结构化表'){
      return [['主键','地块编码 + 年份'],['字段','作物 / 实测产量 / 影像时间戳'],['记录规模', d.scale||'—']];
    }
    return [['数据形态', d.form],['年份', y]];
  }
  function introHtml(d){
    var rows=keyParamsOf(d), li='';
    rows.forEach(function(r){ li+='<li>'+r[0]+'：'+r[1]+'</li>'; });
    return '<p>'+d.desc+'</p>'+
      '<h4>关键参数</h4>'+
      '<ul>'+li+'</ul>';
  }
  function buildIntroEditor(d){
    return ''+
      '<div class="intro-body rich-text" id="introBody">'+introHtml(d)+'</div>'+
      '<div class="intro-hint">数据介绍（含关键参数）由数据提供方在「个人中心 · 我发布的数据」中以富文本编辑维护，数据中心仅做展示。</div>';
  }

  function render(){
    var q=new URLSearchParams(location.search.slice(1)||location.hash.slice(1));
    var name=q.get('n')||'作物长势 · 地面实测数据';
    var d=DS.filter(function(x){return x.name===name;})[0]||DS[0];
    CUR_D=d;
    var zn=zoneNameOf(d.zone);

    document.title='数据详情 · '+d.name+' — 北大荒智慧农业协同创新平台';
    document.getElementById('crumbName').textContent=d.name;

    /* ⭐0915：hm 支持第三参 title——用于挂计数口径说明（断点 B4 相关的取数口径） */
    function hm(v,l,t){return '<span class="hm-item"'+(t?' title="'+t+'"':'')+'><span class="h-v">'+v+'</span><span class="h-l">'+l+'</span></span>';}
    document.getElementById('headBox').innerHTML=
      /* ⭐0917 摘要卡左侧＝缩略图（形态随数据形态变化），对齐示意图；降级态退回浅绿底线框图 */
      headThumbHtml(d)+
      '<div class="head-left">'+
        '<div class="head-top"><h1>'+d.name+'</h1></div>'+
        (d.desc?'<p class="head-desc">'+d.desc+'</p>':'')+
        '<div class="head-tags">'+
          (zn?'<span class="tag">'+zn+'</span>':'')+
          '<span class="tag" title="区域（行政区划）——后台上架数据时必须界定">'+regionOf(d)+'</span>'+
          '<span class="tag">'+d.form+'</span>'+
          '<span class="tag">'+d.crop.join('/')+'</span>'+
          '<span class="tag">'+d.year+'</span>'+
        '</div>'+
        '<div class="head-sub"><span class="at">提供方</span><b>'+d.owner+'</b></div>'+
        '<div class="head-meta">'+hm(String(d.apply),'次申请','申请次数＝本数据卡被申请的次数（按数据卡统计，供资产活性取数）；不含已撤回申请')+'<span class="hm-sep">|</span>'+hm(d.upd,'更新')+'</div>'+
      '</div>'+
      /* ⭐0917 授权说明对齐示意图：摘要卡内只作一行短句；完整授权范围见右栏「数据基本信息」 */
      '<div class="head-right" id="applyWrap">'+applyBtnHtml(d)+
        '<p class="authorize-note">'+authNote()+'</p></div>';

    document.getElementById('pane-intro').innerHTML=
      '<div class="doc-hd"><span class="doc-n">'+d.name+'</span><span class="doc-t">'+d.title+'</span></div>'+
      buildIntroEditor(d)+
      (d.relNote?'<div class="sec-title">关联说明</div><div class="rel-note">'+d.relNote+'</div>':'')
    document.getElementById('pane-preview').innerHTML = renderPreview(d, zn);

    var meta='';
    function kv(k,v){meta+='<div class="kv"><span class="k">'+k+'</span><span class="v">'+(v||'—')+'</span></div>';}
    kv('数据名称','<b>'+d.name+'</b>');
    if(zn)kv('所属专题',zn);
    kv('数据形态',d.form);
    kv('作物类型',d.crop.join('/')||'—');
    kv('数据年份',String(d.year));
    /* ⭐0915 新增三行（断点 B8 / B18）：与列表页筛选维度、与「成果提交」表单字段对齐 */
    kv('区域（行政区划）',regionOf(d));
    kv('数据来源',originOf(d));
    kv('权属归属',holderOf(d));
    kv('授权范围','仅限平台「科研开发空间」内使用；不下载、不出域、不向第三方分发');
    document.getElementById('metaBox').innerHTML=meta;
    if(q.get('apply')==='1'){ applyUse(); }

    if(q.get('use')==='1'){ startUse(); }
  }
  render();
  </script>

<style id="portal-complete-style">
#portalComplete{width:min(700px,calc(100vw - 32px));max-height:88vh;margin:auto;padding:0;border:1px solid #d9e5df;border-radius:10px;background:#fff;color:#173b32;box-shadow:0 20px 70px #12362a44;font:14px/1.65 "Microsoft YaHei",sans-serif}#portalComplete::backdrop{background:#102a2466}#portalComplete *{box-sizing:border-box}#portalComplete .pcx-head{display:flex;align-items:center;justify-content:space-between;padding:20px 26px;border-bottom:1px solid #e3ebe7}#portalComplete h2{font-size:20px;margin:0}#portalComplete h3{font-size:16px;margin:18px 0 8px}#portalComplete .pcx-body{padding:20px 26px}#portalComplete .pcx-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}#portalComplete label{display:block;color:#334e45;font-weight:500}#portalComplete label.full{grid-column:1/-1}#portalComplete input:not([type=checkbox]),#portalComplete select,#portalComplete textarea{display:block;width:100%;margin-top:7px;padding:9px 11px;border:1px solid #cadbd2;border-radius:5px;background:#fff;color:#213e33;font:inherit}#portalComplete textarea{min-height:104px;resize:vertical}#portalComplete .pcx-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 26px;border-top:1px solid #e3ebe7;background:#f8fbf9}#portalComplete button,#portalComplete .pcx-link{padding:8px 15px;border:1px solid #cbded3;border-radius:5px;color:#215b45;background:white;cursor:pointer;font:inherit;text-decoration:none}#portalComplete button.primary{color:white;background:#216348;border-color:#216348}#portalComplete .pcx-note{font-size:12px;color:#718479;margin:10px 0}#portalComplete .pcx-success{padding:16px;background:#edf7f0;border:1px solid #d1e5d8;border-radius:6px}#portalComplete .pcx-record{padding:14px 0;border-bottom:1px solid #e3ebe7}#portalComplete .pcx-error{color:#ad302b}#portalComplete table{border-collapse:collapse;width:100%}#portalComplete td,#portalComplete th{padding:9px;border-bottom:1px solid #e3ebe7;text-align:left}#portalComplete pre{white-space:pre-wrap;word-break:break-word;background:#f3f7f5;padding:14px}#portalComplete [hidden]{display:none!important}@media(max-width:550px){#portalComplete .pcx-grid{grid-template-columns:1fr}}
</style>
<dialog id="portalComplete" aria-labelledby="pcxTitle"></dialog>
<script id="portal-complete-script">
(function(){
 const dialog=document.getElementById('portalComplete');
 const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 window.portalEscape=escape;
 window.portalModal=function(title,body,footer=''){if(dialog.open)dialog.close();dialog.innerHTML='<div class="pcx-head"><h2 id="pcxTitle">'+escape(title)+'</h2><button type="button" data-pcx-close aria-label="关闭">×</button></div><div class="pcx-body">'+body+'</div><div class="pcx-foot">'+footer+'<button type="button" data-pcx-close>关闭</button></div>';dialog.showModal();};
 window.portalClose=()=>dialog.close();
 function records(){try{return JSON.parse(localStorage.getItem('bdh-consultations-v1')||'[]')}catch{return []}}
 window.portalConsultRecords=function(){const items=records();portalModal('咨询与反馈记录','<p class="pcx-note">仅显示当前浏览器保存的原型记录，未发送至平台。</p>'+(items.length?items.map(x=>'<article class="pcx-record"><strong>'+escape(x.kind)+' · '+escape(x.id)+'</strong><p>'+escape(x.description)+'</p><span>'+escape(x.org)+' · '+escape(x.contact)+' · '+escape(x.time)+'</span><p class="pcx-note">已保存 · 待平台对接（演示状态）</p></article>').join(''):'<p>暂无记录。填写咨询或问题反馈后，可在这里查看。</p>'),'<button onclick="portalConsult()">新增咨询</button>');};
 window.portalConsult=function(kind='机构合作'){
 portalModal(kind==='使用问题'?'问题反馈':'合作咨询',`<p class="pcx-note">原型演示：信息仅保存在当前浏览器，不发送真实消息。</p><form id="pcxForm"><div class="pcx-grid"><label>咨询类型 *<select name="kind">${['机构合作','加入平台','私有化部署','API 与订阅','课题咨询','使用问题'].map(x=>`<option ${x===kind?'selected':''}>${x}</option>`).join('')}</select></label><label>单位名称 *<input name="org" required maxlength="80" placeholder="填写单位全称"></label><label>联系人 *<input name="contact" required maxlength="30" placeholder="填写姓名"></label><label>联系电话 / 邮箱 *<input name="reply" required maxlength="100" placeholder="填写可联系的电话或邮箱"></label><label class="full">咨询内容 *<textarea name="description" required minlength="10" maxlength="2000" placeholder="请说明合作方向、业务需求或遇到的问题（至少10字）"></textarea></label></div><p id="pcxError" class="pcx-error" role="alert" hidden></p></form>`,`<button type="button" onclick="portalConsultRecords()">查看记录</button><button type="submit" class="primary" form="pcxForm">提交</button>`);
 const f=document.getElementById('pcxForm');f.onsubmit=function(e){e.preventDefault();const x=Object.fromEntries(new FormData(f));Object.keys(x).forEach(k=>x[k]=x[k].trim());const err=document.getElementById('pcxError');if(!x.org||!x.contact||x.description.length<10||!(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x.reply)||/^\+?[\d\s()\-]{7,25}$/.test(x.reply))){err.hidden=false;err.textContent='请补全单位、联系人、至少10字的内容，并填写有效电话或邮箱。';return;}x.id='ZX-'+Date.now().toString(36).toUpperCase();x.time=new Date().toLocaleString('zh-CN',{hour12:false});try{localStorage.setItem('bdh-consultations-v1',JSON.stringify([x,...records()]));}catch{err.hidden=false;err.textContent='浏览器无法保存，请保留当前表单后重试。';return;}portalModal('提交记录已保存','<div class="pcx-success"><strong>'+escape(x.id)+'</strong><p>'+escape(x.kind)+' · '+escape(x.org)+'</p><p>您的咨询内容与联系方式已记录。</p></div><p class="pcx-note">此为原型演示记录，未发送至平台。可在「联系支持 → 查看咨询记录」再次查看。</p>','<button class="primary" onclick="portalConsultRecords()">查看记录</button>');};};
 window.portalSaveApplication=function(record){const key='bdh-model-applications-v1';try{const list=JSON.parse(localStorage.getItem(key)||'[]');const item={...record,id:'AP-'+Date.now().toString(36).toUpperCase(),date:new Date().toLocaleDateString('sv-SE'),status:'审核中'};localStorage.setItem(key,JSON.stringify([item,...list]));return item;}catch{return null}};
 window.portalApplicationReceipt=function(item){portalModal('申请记录已保存','<div class="pcx-success"><strong>'+escape(item.id)+'</strong><p>'+escape(item.name)+'</p><p>状态：审核中</p></div><p class="pcx-note">原型演示记录保存在当前浏览器，不启动真实审批或分配资源。</p>','<a class="pcx-link" href="个人中心-高保真原型.html#models?tab=applications">查看申请记录</a>');};
 const routes={'首页':'index.html','模型中心':'模型中心-模型列表页（调整）.html','数据中心':'数据中心-数据集列表页.html','科研开发空间':'科研开发空间-交互原型(10).html','课题中心':'课题中心-高保真原型.html','需求中心':'需求中心-高保真原型 (1).html','个人中心':'个人中心-高保真原型.html','关于平台':'关于平台-平台介绍.html'};
 document.addEventListener('click',e=>{const close=e.target.closest('[data-pcx-close]');if(close){dialog.close();return;}const b=e.target.closest('[data-consult],[data-feedback],[data-consult-records],[data-shell],[data-external]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();if(b.hasAttribute('data-consult-records'))portalConsultRecords();else if(b.hasAttribute('data-consult')||b.hasAttribute('data-feedback'))portalConsult(b.hasAttribute('data-feedback')?'使用问题':'机构合作');else{const key=b.dataset.shell||b.dataset.external;if(routes[key])location.href=routes[key];}},true);
 dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();}});
})();
</script>
