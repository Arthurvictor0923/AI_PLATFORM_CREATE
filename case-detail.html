html, body {

  color: rgba(0,0,0,0.88); background-color: #F7F9FD;

}
a { color: #2f54eb; text-decoration: none; transition: color 0.3s; }
a:hover { color: #597ef7; }
ul, ol { list-style: none; }
img { display: block; max-width: 100%; }
button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
::-webkit-scrollbar { width: 8px; height: 8px; }

.header-right { display: flex; align-items: center; gap: 12px; padding-right: 50px; flex-shrink: 0; }
.header-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 6px; color: rgba(0,0,0,0.65); font-size: 16px; transition: all 0.2s; cursor: pointer; position: relative; }
.header-btn:hover { background: rgba(0,0,0,0.06); color: rgba(0,0,0,0.88); }
.header-btn .badge-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #ff4d4f; border: 1px solid #fff; }
.notif-popover{display:none;position:absolute;top:100%;right:40px;margin-top:4px;background:#fff;border-radius:8px;width:340px;max-height:400px;overflow-y:auto;box-shadow:0 6px 16px 0 rgba(0,0,0,0.08),0 3px 6px -4px rgba(0,0,0,0.12),0 9px 28px 8px rgba(0,0,0,0.05);z-index:100}
.notif-popover.visible{display:block}
.header-btn-login, .header-btn-register {
  display: inline-flex; align-items: center; justify-content: center;
  height: 32px; padding: 4px 15px; font-size: 14px; border-radius: 6px;
  cursor: pointer; white-space: nowrap; transition: all 0.2s;
}
.header-btn-login { border: 1px solid #d9d9d9; background: #fff; color: rgba(0,0,0,0.88); box-shadow: 0 2px 0 rgba(0,0,0,0.02); }
.header-btn-login:hover { color: #597ef7; border-color: #597ef7; }
.header-btn-register { border: 1px solid transparent; background: #2f54eb; color: #fff; box-shadow: 0 2px 0 rgba(47,84,235,0.1); }
.header-btn-register:hover { background: #597ef7; }
.avatar-sm { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg,#7566FF,#2F54EB); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
#headerAuthOut, #headerAuthIn { display: inline-flex; align-items: center; gap: 12px; }
.dropdown-wrap { position: relative; display: inline-flex; }
.dropdown-menu { display: none; position: absolute; top: 100%; right: 0; margin-top: 4px; background: #fff; border-radius: 8px; min-width: 180px; padding: 4px; box-shadow: 0 6px 16px 0 rgba(0,0,0,0.08), 0 3px 6px -4px rgba(0,0,0,0.12), 0 9px 28px 8px rgba(0,0,0,0.05); z-index: 100; }
.dropdown-menu.visible { display: block; }
.dropdown-item { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 6px; font-size: 14px; color: rgba(0,0,0,0.88); cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.dropdown-item:hover { background: rgba(0,0,0,0.04); }
.dropdown-item.danger { color: #ff4d4f; }
.dropdown-item.danger:hover { background: #fff2f0; }
.dropdown-divider { height: 1px; background: rgba(5,5,5,0.06); margin: 4px 0; }

/* ============================================================
   PAGE WRAP
   ============================================================ */
.page-wrap { padding-top: 60px; }

/* ============================================================
   BREADCRUMB
   ============================================================ */
.breadcrumb-bar {
  max-width: 1200px; margin: 0 auto; padding: 16px 50px 0;
  display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(0,0,0,0.45);
}
.breadcrumb-bar a { color: rgba(0,0,0,0.45); }
.breadcrumb-bar a:hover { color: #2f54eb; }
.breadcrumb-bar .bc-sep { color: rgba(0,0,0,0.25); }
.breadcrumb-bar .bc-current { color: rgba(0,0,0,0.88); font-weight: 500; }

/* ============================================================
   HERO BANNER
   ============================================================ */
.detail-hero {
  max-width: 1200px; margin: 16px auto 0; padding: 0 50px;
}
.detail-hero-inner {
  background: #fff; border-radius: 12px; border: 1px solid rgba(5,5,5,0.06);
  overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.02);
}
.dh-visual {
  height: 180px; position: relative; display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.dh-visual.vis-a { background: linear-gradient(135deg, #eef2ff 0%, #d6e4ff 100%); }
.dh-visual.vis-b { background: linear-gradient(135deg, #e6fffb 0%, #b5f5ec 100%); }
.dh-visual.vis-c { background: linear-gradient(135deg, #f6ffed 0%, #d9f7be 100%); }
.dh-visual.vis-d { background: linear-gradient(135deg, #fff7e6 0%, #ffe7ba 100%); }
.dh-visual.vis-e { background: linear-gradient(135deg, #f0f5ff 0%, #adc6ff 100%); }
.dh-visual .dh-icon { font-size: 64px; position: relative; z-index: 1; opacity: 0.6; }
.dh-visual .dh-img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: center 35%;
}
.dh-info { padding: 28px 32px 24px; }
.dh-info .dh-status {
  display: inline-flex; padding: 2px 10px; border-radius: 4px;
  font-size: 12px; font-weight: 500; margin-bottom: 12px;
}
.dh-status.delivered { background: #d9f7be; color: #52c41a; }
.dh-status.ongoing { background: #d6e4ff; color: #2f54eb; }
.dh-info h1 { font-size: 26px; font-weight: 700; color: rgba(0,0,0,0.88); line-height: 1.35; margin-bottom: 14px; }
.dh-meta { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; font-size: 13px; color: rgba(0,0,0,0.45); }
.dh-meta-item { display: flex; align-items: center; gap: 4px; }
.dh-meta-divider { width: 1px; height: 14px; background: rgba(0,0,0,0.1); border-radius: 1px; }
.dh-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(5,5,5,0.05); }
.dh-tag { padding: 2px 10px; border-radius: 4px; font-size: 12px; background: rgba(47,84,235,0.06); color: #2f54eb; }

/* ============================================================
   MAIN CONTENT — two columns
   ============================================================ */
.detail-content {
  max-width: 1200px; margin: 24px auto 0; padding: 0 50px 60px;
  display: flex; gap: 24px; align-items: flex-start;
}

/* --- Left column --- */
.detail-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 24px; }

/* Section card */
.detail-section {
  background: #fff; border-radius: 10px; border: 1px solid rgba(5,5,5,0.06);
  padding: 28px 32px; box-shadow: 0 1px 4px rgba(0,0,0,0.02);
}
.ds-heading {
  display: flex; align-items: center; gap: 8px; margin-bottom: 18px;
  font-size: 17px; font-weight: 600; color: rgba(0,0,0,0.88);
}
.ds-heading::before {
  content: ''; display: inline-block; width: 2px; height: 14px;
  background: #2f54eb; border-radius: 1px; flex-shrink: 0;
}
.ds-body { font-size: 14px; color: rgba(0,0,0,0.65); line-height: 1.85; }
.ds-body p { margin-bottom: 12px; }
.ds-body p:last-child { margin-bottom: 0; }

/* Results stat cards */
.results-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px; margin-top: 8px;
}
.result-stat {
  background: #fafbfc; border: 1px solid rgba(5,5,5,0.05);
  border-radius: 8px; padding: 16px 18px; text-align: center;
  transition: all 0.2s;
}
.result-stat:hover { border-color: rgba(47,84,235,0.12); box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.result-stat .rs-val { font-size: 24px; font-weight: 700; color: #2f54eb; line-height: 1.3; }
.result-stat .rs-val.accent { color: #23ada4; }
.result-stat .rs-lbl { font-size: 12px; color: rgba(0,0,0,0.45); margin-top: 4px; line-height: 1.5; }

/* Solution subsections */
.sol-sub { margin-bottom: 20px; }
.sol-sub:last-child { margin-bottom: 0; }
.sol-sub-title { font-size: 15px; font-weight: 600; color: rgba(0,0,0,0.88); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }

/* --- Right column (sidebar) --- */
.detail-sidebar { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 24px; position: sticky; top: 84px; }

/* Info card */
.info-card {
  background: #fff; border-radius: 10px; border: 1px solid rgba(5,5,5,0.06);
  padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.02);
}
.info-card h4 { font-size: 15px; font-weight: 600; color: rgba(0,0,0,0.88); margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
.info-card h4::before { content: ''; display: inline-block; width: 2px; height: 12px; background: #2f54eb; border-radius: 1px; flex-shrink: 0; }
.info-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid rgba(5,5,5,0.04); font-size: 13px; }
.info-row:last-child { border-bottom: none; }
.info-row .ir-lbl { color: rgba(0,0,0,0.45); flex-shrink: 0; margin-right: 12px; }
.info-row .ir-val { color: rgba(0,0,0,0.88); text-align: right; font-weight: 500; }

/* Related cases card */
.related-card {
  background: #fff; border-radius: 10px; border: 1px solid rgba(5,5,5,0.06);
  padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.02);
}
.related-card h4 { font-size: 15px; font-weight: 600; color: rgba(0,0,0,0.88); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
.related-card h4::before { content: ''; display: inline-block; width: 2px; height: 12px; background: #2f54eb; border-radius: 1px; flex-shrink: 0; }
.rel-item {
  display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px;
  cursor: pointer; transition: all 0.2s; margin-bottom: 6px; border: 1px solid transparent;
}
.rel-item:hover { background: rgba(47,84,235,0.04); border-color: rgba(47,84,235,0.08); }
.rel-item:last-child { margin-bottom: 0; }
.rel-visual {
  width: 48px; height: 48px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
}
.rel-visual.rv-a { background: linear-gradient(135deg, #eef2ff, #d6e4ff); }
.rel-visual.rv-b { background: linear-gradient(135deg, #e6fffb, #b5f5ec); }
.rel-visual.rv-c { background: linear-gradient(135deg, #f6ffed, #d9f7be); }
.rel-visual.rv-d { background: linear-gradient(135deg, #fff7e6, #ffe7ba); }
.rel-visual.rv-e { background: linear-gradient(135deg, #f0f5ff, #adc6ff); }
.rel-info { flex: 1; min-width: 0; }
.rel-info .rel-title { font-size: 13px; font-weight: 500; color: rgba(0,0,0,0.88); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; transition: color 0.2s; }
.rel-item:hover .rel-title { color: #2f54eb; }
.rel-info .rel-org { font-size: 11px; color: rgba(0,0,0,0.35); margin-top: 2px; }

/* ============================================================
   FOOTER
   ============================================================ */
.footer { background: #001529; color: rgba(255,255,255,0.65); padding: 48px 50px 24px; font-size: 13px; }
.footer-inner { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 40px; }
.footer-col h4 { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.85); margin-bottom: 16px; }
.footer-col p, .footer-col a { font-size: 13px; color: rgba(255,255,255,0.45); line-height: 2.2; display: block; text-decoration: none; }
.footer-col a:hover { color: #597ef7; }
.footer-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.footer-logo span { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.85); }
.footer-bot { max-width: 1200px; margin: 36px auto 0; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.08); text-align: center; font-size: 12px; color: rgba(255,255,255,0.25); line-height: 1.8; }

/* ============================================================
   TOAST
   ============================================================ */
.toast { position: fixed; top: 76px; right: 24px; z-index: 2000; padding: 10px 16px; border-radius: 6px; font-size: 14px; display: none; align-items: center; gap: 8px; animation: toastIn 0.3s cubic-bezier(0.78,0.14,0.15,0.86); box-shadow: 0 6px 16px 0 rgba(0,0,0,0.08), 0 3px 6px -4px rgba(0,0,0,0.12); }
.toast.visible { display: flex; }
.toast-info { background: #f0f5ff; border: 1px solid #d6e4ff; color: #2f54eb; }
@keyframes toastIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }

/* ============================================================
   NOT FOUND STATE
   ============================================================ */
.not-found { text-align: center; padding: 80px 20px; }
.not-found .nf-icon { font-size: 64px; margin-bottom: 16px; }
.not-found .nf-text { font-size: 16px; color: rgba(0,0,0,0.45); margin-bottom: 16px; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 900px) {
  .detail-content { flex-direction: column; padding: 24px 20px 40px; }
  .detail-sidebar { width: 100%; position: static; }
  .detail-hero { padding: 0 20px; }
  .dh-visual { height: 130px; }
  .dh-info { padding: 20px; }
  .dh-info h1 { font-size: 20px; }
  .breadcrumb-bar { padding: 12px 20px 0; }
  .results-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
  .results-grid { grid-template-columns: 1fr; }
  .dh-meta { gap: 10px; }
  .footer-inner { grid-template-columns: 1fr 1fr; gap: 24px; }
  .top-nav-menu-wrap { display: none; }
  .header-right { padding-right: 16px; }
}
</style>
</head>

  background: '<p>2023年8月初，台风"杜苏芮"北上过境黑龙江省，建三江垦区遭遇大范围强风暴雨，导致大面积玉米出现不同程度的倒伏灾害。传统的倒伏评估依赖农业技术人员逐地块踏查，耗时长、成本高，且受主观经验影响大，无法在灾后黄金窗口期内完成全域评估。作为北大荒集团玉米核心产区，建三江87万亩玉米的灾情数据直接关系到保险定损、灾后复产方案制定和国家粮食安全统计的准确性。因此，急需一套快速、客观、高精度的倒伏面积遥感智能提取方案。</p>',
  solution: '<div class="sol-sub"><div class="sol-sub-title">📡 数据源与预处理</div><p>紧急调用欧空局Sentinel-2多光谱卫星影像（空间分辨率10m），选取灾后3日内的无云影像，经大气校正、几何精校正后，提取红、绿、蓝、近红外、红边等10个波段构建多光谱特征集。</p></div><div class="sol-sub"><div class="sol-sub-title">🧠 模型选型与训练</div><p>采用DeepLabV3+语义分割架构，以ResNet-50为骨干网络，在历史倒伏样本集（含2019年"利奇马"、2020年"巴威"两次台风倒伏标注数据）上进行迁移学习微调。针对倒伏区域与非倒伏区域在近红外与红边波段反射率的显著差异，引入注意力机制增强倒伏特征提取能力。</p></div><div class="sol-sub"><div class="sol-sub-title">📊 后处理与出图</div><p>分割结果经形态学后处理（膨胀+腐蚀）消除碎斑，按农场管理区边界裁剪，自动统计各地块倒伏面积与倒伏率，生成分级受灾专题图（轻度/中度/重度），以GeoJSON格式对接保险定损系统。</p></div>',

function renderPage() {
  // Parse case ID from URL
  var params = new URLSearchParams(window.location.search);
  var id = parseInt(params.get('id')) || 0;
  var c = ALL_CASES.find(function(x){ return x.id === id; });

  if (!c) {
    document.getElementById('pageContent').innerHTML =
      '<div class="not-found"><div class="nf-icon">🔍</div><div class="nf-text">案例不存在，请返回案例中心浏览</div><a class="btn btn-primary" href="case-center.html">返回案例中心</a></div>';
    document.title = '案例不存在 — 北大荒智慧农业协同创新平台';
    return;
  }

  document.title = c.title + ' — 案例详情 — 北大荒智慧农业协同创新平台';

  var detail = CASE_DETAILS[id];
  if (!detail) { detail = {background:'<p>该案例详情正在整理中，请稍后查看。</p>',solution:'',results:[],company:''}; }

  // Build results HTML
  var resultsHtml = '';
  if (detail.results && detail.results.length > 0) {
    resultsHtml = '<div class="results-grid">' + detail.results.map(function(r){
      return '<div class="result-stat"><div class="rs-val' + (r.clazz ? ' ' + r.clazz : '') + '">' + r.val + '</div><div class="rs-lbl">' + r.lbl + '</div></div>';
    }).join('') + '</div>';
  }

  // Build solution HTML
  var solutionHtml = detail.solution || '';

  // Build related cases (same industry, exclude current)
  var related = ALL_CASES.filter(function(x){ return x.id !== id && x.industry === c.industry; });
  if (related.length < 3) {
    // Add cases from other industries if needed
    var others = ALL_CASES.filter(function(x){ return x.id !== id && x.industry !== c.industry; });
    related = related.concat(others.slice(0, 3 - related.length));
  }
  related = related.slice(0, 4);

  var relatedHtml = related.map(function(r){
    return '<div class="rel-item" onclick="window.location.href=\'case-detail.html?id=' + r.id + '\'">' +
      '<div class="rel-visual rv-' + r.vis + '">' + r.icon + '</div>' +
      '<div class="rel-info"><div class="rel-title">' + r.title + '</div><div class="rel-org">' + r.org + '</div></div>' +
      '</div>';
  }).join('');

  var html = '';

  // Breadcrumb
  html += '<div class="breadcrumb-bar">';
  html += '<a href="portal.html">首页</a><span class="bc-sep">/</span>';
  html += '<a href="case-center.html">案例中心</a><span class="bc-sep">/</span>';
  html += '<span class="bc-current">案例详情</span>';
  html += '</div>';

  // Hero
  html += '<div class="detail-hero">';
  html += '<div class="detail-hero-inner">';
  html += '<div class="dh-visual vis-' + c.vis + '">';
  if (c.img) {
    html += '<img class="dh-img" src="' + c.img + '" alt="' + c.title + '">';
  } else {
    html += '<span class="dh-icon">' + c.icon + '</span>';
  }
  html += '</div>';
  html += '<div class="dh-info">';
  html += '<span class="dh-status ' + c.status + '">' + c.statusText + '</span>';
  html += '<h1>' + c.title + '</h1>';
  html += '<div class="dh-meta">';
  html += '<span class="dh-meta-item">🏢 ' + c.org + '</span>';
  html += '<span class="dh-meta-divider"></span>';
  html += '<span class="dh-meta-item">📍 ' + c.location + '</span>';
  html += '<span class="dh-meta-divider"></span>';
  html += '<span class="dh-meta-item">📂 ' + c.industry + '</span>';
  html += '</div>';
  html += '<div class="dh-tags">' + c.tags.map(function(t){ return '<span class="dh-tag">' + t + '</span>'; }).join('') + '</div>';
  html += '</div>';
  html += '</div>';
  html += '</div>';

  // Main content
  html += '<div class="detail-content">';

  // Left column
  html += '<div class="detail-main">';

  // Business background
  html += '<section class="detail-section">';
  html += '<div class="ds-heading">业务背景</div>';
  html += '<div class="ds-body">' + detail.background + '</div>';
  html += '</section>';

  // Technical solution
  if (solutionHtml) {
    html += '<section class="detail-section">';
    html += '<div class="ds-heading">技术方案</div>';
    html += '<div class="ds-body">' + solutionHtml + '</div>';
    html += '</section>';
  }

  // Results
  html += '<section class="detail-section">';
  html += '<div class="ds-heading">落地效果</div>';
  html += '<div class="ds-body">' + resultsHtml + '</div>';
  html += '</section>';

  // Company intro
  if (detail.company) {
    html += '<section class="detail-section">';
    html += '<div class="ds-heading">机构简介</div>';
    html += '<div class="ds-body">' + detail.company + '</div>';
    html += '</section>';
  }

  html += '</div>'; // end detail-main

  // Right column
  html += '<div class="detail-sidebar">';

  // Info card
  html += '<div class="info-card">';
  html += '<h4>案例信息</h4>';
  html += '<div class="info-row"><span class="ir-lbl">所属行业</span><span class="ir-val">' + c.industry + '</span></div>';
  html += '<div class="info-row"><span class="ir-lbl">实施机构</span><span class="ir-val">' + c.org + '</span></div>';
  html += '<div class="info-row"><span class="ir-lbl">实施地点</span><span class="ir-val">' + c.location + '</span></div>';
  html += '<div class="info-row"><span class="ir-lbl">项目状态</span><span class="ir-val" style="color:' + (c.status==='delivered'?'#52c41a':'#2f54eb') + '">' + c.statusText + '</span></div>';
  html += '</div>';

  // Related cases
  if (relatedHtml) {
    html += '<div class="related-card">';
    html += '<h4>相关案例</h4>';
    html += relatedHtml;
    html += '</div>';
  }

  // Back button
  html += '<a class="btn btn-default" href="case-center.html" style="width:100%">← 返回案例中心</a>';

  html += '</div>'; // end detail-sidebar

  html += '</div>'; // end detail-content

  document.getElementById('pageContent').innerHTML = html;
}

  {icon:'📊',text:'数据集「作物长势样本集」上传完成，已通过审核',time:'3 小时前',unread:true},
  {icon:'🔔',text:'平台算力资源扩容完成，GPU 可用额度提升 50%',time:'昨天',unread:false},
  {icon:'📝',text:'2026 Q2 平台使用报告已发布，点击查看',time:'2 天前',unread:false}
];
function renderNotifs(){
  document.getElementById('notifList').innerHTML = NOTIFS.map(function(n){
    return '<div style="padding:10px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5;transition:background 0.2s" onmouseover="this.style.background=\'rgba(0,0,0,0.02)\'" onmouseout="this.style.background=\'\'" onclick="toast(\'功能开发中\',\'info\')"><span style="font-size:16px">'+n.icon+'</span><span style="flex:1;color:rgba(0,0,0,0.65)">'+n.text+'</span><span style="font-size:11px;color:rgba(0,0,0,0.35);white-space:nowrap">'+n.time+'</span>'+(n.unread?'<span style="width:6px;height:6px;border-radius:50%;background:#ff4d4f;flex-shrink:0;margin-top:5px"></span>':'')+'</div>';
  }).join('');
}
renderNotifs();
function toggleNotifPopover(){ document.getElementById('notifPopover').classList.toggle('visible'); closeUserMenu(); }
function markAllRead(){ NOTIFS.forEach(function(n){ n.unread=false; }); renderNotifs(); document.getElementById('notifBtn').querySelector('.badge-dot').style.display='none'; }
document.addEventListener('click',function(e){ var popover=document.getElementById('notifPopover'),btn=document.getElementById('notifBtn'); if(popover&&popover.classList.contains('visible')&&!popover.contains(e.target)&&e.target!==btn&&!btn.contains(e.target)){ popover.classList.remove('visible'); }});

// ===================================================================
// USER DROPDOWN
// ===================================================================
function toggleUserMenu(){ document.getElementById('userDropdown').classList.toggle('visible'); var np=document.getElementById('notifPopover'); if(np) np.classList.remove('visible'); }
function closeUserMenu(){ document.getElementById('userDropdown').classList.remove('visible'); }
document.addEventListener('click', function(e){ var wrap = document.getElementById('userDropdownWrap'); if(wrap && !wrap.contains(e.target)){ closeUserMenu(); } });
function confirmLogout(e){ e.stopPropagation(); closeUserMenu(); if(confirm('确定退出登录？')){ try { localStorage.removeItem('luoshu_logged_in'); } catch(e){} switchAuthState(false); toast('已退出登录','info'); } }

// ===================================================================
// TOAST
// ===================================================================
function toast(msg, type){
  var el = document.getElementById('toast');
  el.textContent = (type==='error'?'⚠ ':'') + msg;
  el.className = 'toast visible toast-' + (type || 'info');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('visible'); }, 4000);
}
</script>
