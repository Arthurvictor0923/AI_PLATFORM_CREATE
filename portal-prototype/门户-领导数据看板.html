      {id:'u-li',name:'李晓',login:'li.xiao',kind:'member',orgId:'org-hla',org,ownerId:'u-zhang'},
      {id:'u-wang',name:'王宁',login:'wang.ning',kind:'member',orgId:'org-hla',org,ownerId:'u-zhang'},
      {id:'u-zhao',name:'赵晨',login:'zhao.chen',kind:'member',orgId:'org-hla',org,ownerId:'u-zhang'},
      {id:'u-chen',name:'陈老师',login:'chen.research',kind:'leader',orgId:'org-hla',org,ownerId:null},
      {id:'u-sun',name:'孙悦',login:'sun.yue',kind:'member',orgId:'org-hla',org,ownerId:'u-chen'},
      {id:'u-liu',name:'刘老师',login:'liu.research',kind:'leader',orgId:'org-hla',org,ownerId:null}
    ],
    teams: [
      {id:'t-rice',name:'寒地水稻研究团队',ownerId:'u-zhang',orgId:'org-hla',org,description:'多源遥感与作物监测方法研究',memberIds:['u-zhang','u-li','u-wang'],spaceIds:['1','2','5','7']},
      {id:'t-disaster',name:'农业灾害研究团队',ownerId:'u-zhang',orgId:'org-hla',org,description:'农田旱情与土壤墒情研究',memberIds:['u-zhang','u-li'],spaceIds:['3','4']},
      {id:'t-yield',name:'粮食产量研究团队',ownerId:'u-chen',orgId:'org-hla',org,description:'区域作物产量分析与验证',memberIds:['u-chen','u-sun','u-zhang'],spaceIds:['6']}
    ],
    invitations: []
  };
  const clone = x => JSON.parse(JSON.stringify(x));
  function read() {try {const s=JSON.parse(localStorage.getItem(KEY));if(s?.schema===1&&Array.isArray(s.accounts)&&Array.isArray(s.teams))return s;}catch{}return clone(seed);}
  function save(s) {try {localStorage.setItem(KEY,JSON.stringify(s));}catch {throw Error('保存失败，请检查浏览器存储后重试。');}window.dispatchEvent(new CustomEvent('portal-org-change'));}
  if(!localStorage.getItem(KEY))save(clone(seed));
  const existing=read();if(!existing.accounts.some(a=>a.id===adminDemo.id)){existing.accounts.push(clone(adminDemo));save(existing);}
  function current() {const s=read();return s.accounts.find(a=>a.id===localStorage.getItem(SESSION))||s.accounts.find(a=>a.id==='u-zhang')||s.accounts[0];}
  const newId = p => p+'-'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));
  function leader() {const a=current();if(a.kind!=='leader')throw Error('仅负责人可以管理成员账号和创建团队。');return a;}
  function managedTeam(s,id) {const t=s.teams.find(t=>t.id===id);if(!t||t.ownerId!==current().id)throw Error('仅当前团队负责人可以管理该团队。');return t;}
  function memberEligible(t,a) {return !!a&&a.orgId===t.orgId&&a.kind==='member'&&a.ownerId===t.ownerId;}
  const O = window.PortalOrg = {
    KEY, SESSION, read, current,
    isLogged:()=>!!localStorage.getItem(SESSION),
    signOut:()=>{localStorage.removeItem(SESSION);window.dispatchEvent(new CustomEvent('portal-account-change'));},
    account:id=>read().accounts.find(a=>a.id===id),
    team:id=>read().teams.find(t=>t.id===id),
    isLeader:()=>current().kind==='leader',
    canViewDashboard:()=>!!localStorage.getItem(SESSION)&&current().kind==='admin'&&current().permissions?.includes('dashboard:view'),
    roleLabel:a=>a.kind==='admin'?'管理员':a.kind==='leader'?'负责人':'成员',
    myTeams:()=>read().teams.filter(t=>t.memberIds.includes(current().id)),
    managedAccounts:()=>read().accounts.filter(a=>a.kind==='member'&&a.ownerId===current().id),
    canViewTeam:id=>!!read().teams.find(t=>t.id===id&&t.memberIds.includes(current().id)),
    canManageTeam:id=>!!read().teams.find(t=>t.id===id&&t.ownerId===current().id),
    spaceTeam:id=>read().teams.find(t=>(t.spaceIds||[]).includes(String(id))),
    spaceMembers(id) {const s=read(),t=this.spaceTeam(id);return t?t.memberIds.filter(a=>(s.spaceMembers?.[String(id)]||t.memberIds).includes(a)):[];},
    canViewSpace(id) {const t=this.spaceTeam(id);return !!t&&this.canViewTeam(t.id)&&this.spaceMembers(id).includes(current().id);},
    setSpaceMembers(id,ids) {const s=read(),t=this.spaceTeam(id);if(!t||!this.canManageSpace(id))throw Error('仅本团队负责人可以管理空间成员。');if(ids.some(a=>!t.memberIds.includes(a)))throw Error('只能选择当前团队成员。');s.spaceMembers??={};s.spaceMembers[String(id)]=[...new Set([t.ownerId,...ids])];save(s);},
    canManageSpace(id) {const t=this.spaceTeam(id);return !!t&&this.canManageTeam(t.id);},
    select(id) {if(!read().accounts.some(a=>a.id===id))throw Error('账号不存在。');localStorage.setItem(SESSION,id);window.dispatchEvent(new CustomEvent('portal-account-change'));},
    createMember(fields) {
      const a=leader(),s=read(),name=String(fields.name||'').trim(),login=String(fields.login||'').trim();
      if(!name||!login)throw Error('请填写姓名和登录账号。');
      if(/\s/.test(login))throw Error('登录账号不能包含空格。');
      if(s.accounts.some(x=>x.login.toLowerCase()===login.toLowerCase()))throw Error('登录账号已存在，请使用其他账号；已有成员无需重复创建。');
      if(!String(fields.password||'').trim())throw Error('请填写初始密码。');
      const member={id:newId('u'),name,login,kind:'member',orgId:a.orgId,org:a.org,ownerId:a.id};
      s.accounts.push(member);save(s);return member; // Password is deliberately not stored by this prototype.
    },
    updateProfile(name) {const s=read(),a=s.accounts.find(x=>x.id===current().id);if(!String(name).trim())throw Error('请填写姓名。');a.name=String(name).trim();save(s);},
    editMember(id,name) {leader();const s=read(),a=s.accounts.find(a=>a.id===id&&a.ownerId===current().id&&a.kind==='member');if(!a)throw Error('只能维护自己关联的成员账号。');if(!String(name).trim())throw Error('请填写姓名。');a.name=String(name).trim();save(s);},
    createTeam(fields) {const a=leader(),s=read(),name=String(fields.name||'').trim();if(!name)throw Error('请填写团队名称。');const t={id:newId('t'),name,description:String(fields.description||'').trim(),orgId:a.orgId,org:a.org,ownerId:a.id,memberIds:[a.id],spaceIds:[]};s.teams.push(t);save(s);return t;},
    addMembers(id,ids) {const s=read(),t=managedTeam(s,id);if(!ids.length)throw Error('请选择要添加的成员。');if(ids.some(id=>!memberEligible(t,s.accounts.find(a=>a.id===id))))throw Error('只能添加本机构且归属当前负责人的普通成员。');t.memberIds=[...new Set([...t.memberIds,...ids])];save(s);},
    removeMember(id,accountId) {const s=read(),t=managedTeam(s,id);if(accountId===t.ownerId)throw Error('不能移除团队负责人。');t.memberIds=t.memberIds.filter(x=>x!==accountId);save(s);},
    invite(id,accountId) {
      const s=read(),t=managedTeam(s,id),a=s.accounts.find(a=>a.id===accountId);
      if(!a||a.kind!=='leader'||a.orgId!==t.orgId||a.id===current().id)throw Error('只能邀请本机构已有的独立负责人。');
      if(t.memberIds.includes(a.id))throw Error('该负责人已加入当前团队。');
      if(s.invitations.some(i=>i.teamId===id&&i.to===accountId&&i.status==='pending'))throw Error('邀请已发出，请等待对方回应。');
      const i={id:newId('inv'),teamId:id,from:current().id,to:accountId,status:'pending',time:new Date().toLocaleString('zh-CN')};s.invitations.push(i);save(s);return i;
    },
    answer(id,decision) {
      const s=read(),i=s.invitations.find(x=>x.id===id),a=current();if(!i||i.to!==a.id||i.status!=='pending')throw Error('该邀请已处理或不属于当前账号。');
      if(!['accepted','declined'].includes(decision))throw Error('无效操作。');
      const t=s.teams.find(t=>t.id===i.teamId);if(!t||a.kind!=='leader'||a.orgId!==t.orgId)throw Error('当前账号不符合团队邀请条件。');
      if(decision==='accepted')t.memberIds=[...new Set([...t.memberIds,a.id])];i.status=decision;i.processedAt=new Date().toISOString();save(s);
    },
    cancelInvite(id) {const s=read(),i=s.invitations.find(x=>x.id===id);if(!i||i.status!=='pending')throw Error('邀请已处理。');managedTeam(s,i.teamId);i.status='cancelled';save(s);},
    escape:v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
  };
  window.PrototypeAccounts.connectPortal(O);
})();

if(location.protocol==="file:"&&!PortalOrg.isLogged())PortalOrg.select("u-admin");

  try {

function sourceValue(value) {
  return typeof value === 'string' || typeof value === 'number' ? String(value).trim() : '';
}

function sourceText(html) {
  const value = sourceValue(html);
  if (!value.includes('<') && !value.includes('&')) return value;
  const template = document.createElement('template');
  template.innerHTML = value.replace(/<br\b[^>]*>|<\/(?:p|li|h[1-6]|div|tr)>/gi, '\n');
  template.content.querySelectorAll('script,style,iframe,object').forEach(node => node.remove());
  return template.content.textContent.trim();
}

function normalizeDemand(record) {
  const id = sourceValue(record.id);
  const title = sourceValue(record.title || record.name);
  const status = sourceValue(record.status || record.st);
  return {
    id, title, no: sourceValue(record.no) || id,
    status: DEMAND_STATUS.get(status) || status || '—',
    publisher: sourceValue(record.publisher || record.org),
    problem: sourceText(record.problem || record.content?.[0] || record.summary),
    applicationResults: Array.isArray(record.applicationResults) ? record.applicationResults : null
  };
}

function readApplicationSources() {
  const canRead = window.PortalOrg?.canViewDashboard?.();
  const portalRows = canRead ? readLandingSource(LANDING_KEYS.portalDemands) : null;
  const adminRows = canRead ? readLandingSource(LANDING_KEYS.adminDemands)?.rows : null;
  const reviews = canRead ? readLandingSource(LANDING_KEYS.outcomes) : null;
  const caseRows = canRead ? readLandingSource(LANDING_KEYS.cases) : null;
  if (![portalRows, adminRows, reviews, caseRows].some(Array.isArray)) {
    return {
      demo: true,
      demands: DEMO_DEMANDS.map(normalizeDemand),
      models: FIXTURE.outcomes.filter(row => row.kind === '模型').map(row => ({
        id: row.id, no: row.resource || row.id, group: row.resource || row.id,
        name: row.name, version: CATALOG.models.find(model => model.id === row.resource)?.ver || 'v1.1',
        demandId: DEMO_OUTCOME_LINKS.get(row.id), project: row.project, year: projBy(row.project)?.year
      })),
      cases: DEMO_CASES
    };
  }

  const demands = new Map();
  // Model submissions reference the portal demand ID. A portal record takes priority
  // for that same ID. Separate demand records never get matched by their title.
  for (const rows of [adminRows, portalRows]) {
    if (!Array.isArray(rows)) continue;
    for (const record of rows) {
      if (!record) continue;
      const demand = normalizeDemand(record);
      if (!demand.id || !demand.title) continue;
      const previous = demands.get(demand.id);
      demand.applicationResults ??= previous?.applicationResults;
      demands.set(demand.id, demand);
    }
  }

  const catalog = readLandingSource(LANDING_KEYS.modelCatalog);
  const newModels = readLandingSource(LANDING_KEYS.modelService)?.newRows;
  const catalogByKey = new Map();
  for (const rows of [newModels, catalog]) {
    if (!Array.isArray(rows)) continue;
    for (const row of rows) {
      if (row?.key && !row.deleted) catalogByKey.set(sourceValue(row.key), row);
    }
  }
  const catalogByOutcome = new Map([...catalogByKey.values()].filter(row => row.outcomeId)
    .map(row => [sourceValue(row.outcomeId), row]));
  const projects = readLandingSource(LANDING_KEYS.projects);
  const projectByCode = new Map((Array.isArray(projects) ? projects : []).filter(Boolean)
    .map(row => [sourceValue(row.code || row.id), row]));
  const models = (Array.isArray(reviews) ? reviews : []).filter(row =>
    row?.id && row.kind === 'model' && row.status === '已通过').map(row => {
    const data = row.metadata || {};
    const model = catalogByOutcome.get(sourceValue(row.id)) ||
      catalogByKey.get(sourceValue(row.acceptedAssetId || row.assetId));
    const project = sourceValue(row.projectCode || data.projectCode || data.sourceProjectId);
    const projectRow = projectByCode.get(project);
    const year = Number(sourceValue(projectRow?.year || projectRow?.batch || projectRow?.yb).match(/^\d{4}/)?.[0]) ||
      projBy(project)?.year;
    const no = sourceValue(data.modelNo || model?.no);
    return {
      id: sourceValue(row.id), no, group: sourceValue(model?.modelId) || no || sourceValue(row.id),
      name: sourceValue(row.name || data.name || model?.name),
      version: sourceValue(data.version || row.version || model?.ver),
      demandId: sourceValue(data.sourceDemandId), project,
      projectName: sourceValue(projectRow?.name || projectRow?.title), year

function applicationRows() {

  const modelsById = new Map(models.map(model => [model.id, model]));
  const demandById = new Map(applicationSources.demands.map(demand => [demand.id, demand]));
  const rows = new Map();
  const rowId = (demand, model) => JSON.stringify(['demand', demand.id, model.group]);

  // An existing link explains which demand a model addresses.
  for (const model of models) {
    const demand = demandById.get(model.demandId);
    if (!demand) continue;
    const id = rowId(demand, model);
    if (!rows.has(id)) rows.set(id, {id, source: DEMAND_SOURCE, title: demand.title, demand, model, result: '', date: ''});
  }

  // Adoption is supplied by the demand side. It also supports reuse of a model
  // that originated from a different demand. One demand/model pair is one record.
  for (const demand of applicationSources.demands) {
    for (const entry of demand.applicationResults || []) {
      if (entry?.adopted !== true) continue;
      const model = modelsById.get(sourceValue(entry.outcomeId));
      const result = sourceText(entry.summary);
      if (!model || !result) continue;
      const id = rowId(demand, model);
      const date = sourceValue(entry.confirmedAt);
      const previous = rows.get(id);
      if (previous?.result && previous.date > date) continue;
      rows.set(id, {id, source: DEMAND_SOURCE, title: demand.title, demand, model, result, date});
    }
  }
  const sorted = [...rows.values()].sort((a, b) => Number(!!b.result) - Number(!!a.result) ||

function calendarMonthsBefore(value, months) {
  const date = new Date(value + 'T00:00:00Z');
  const day = date.getUTCDate();
  date.setUTCDate(1);
  date.setUTCMonth(date.getUTCMonth() - months);
  const monthEnd = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth() + 1, 0)).getUTCDate();
  date.setUTCDate(Math.min(day, monthEnd));
  return date.toISOString().slice(0, 10);
}

        if(trial)return '';
        let rows=[];try{rows=JSON.parse(localStorage.getItem('bdh-model-applications-v1')||'[]');}catch{}
        const authorized=rows.some(r=>(r.applicantId||'u-zhang')===O.current().id&&r.name===CUR.name&&['已通过','approved'].includes(r.status));
        return authorized?'':'当前模型尚未取得在线使用授权';
      });
      if(typeof DEMO_AUTH!=='undefined')DEMO_AUTH=trial;
      window.renderAll?.();window.syncLock?.();prune();
    }
    if(file.startsWith('数据中心')){
      wrap('renderCtx',(old,args,ctx)=>{const r=old.apply(ctx,args);if(!O.isLeader()||PrototypeAccounts.grant('data')!=='review')document.querySelectorAll('[onclick*="applyZoneAll"]').forEach(n=>n.remove());return r;});window.renderCtx?.();window.renderAll?.();prune();
      if(!O.isLeader()){
        document.querySelectorAll('[onclick*="applyZoneAll"]').forEach(b=>{b.disabled=true;b.title='数据由负责人为科研空间申请';});
        wrap('renderZoneList',(old,args,ctx)=>{const r=old.apply(ctx,args);document.querySelectorAll('[onclick*="applyZoneAll"]').forEach(b=>{b.disabled=true;b.title='数据由负责人为科研空间申请';});return r;});
      }
      if(typeof applyBtnHtml==='function'){wrap('applyBtnHtml',(old,args,ctx)=>O.isLeader()&&PrototypeAccounts.grant('data')!=='deny'?old.apply(ctx,args):'');window.renderHeadRight?.();prune();}
    }
    if(file==='科研开发空间-交互原型(10).html'){
      const all=spaces.slice(),scope=new URLSearchParams(location.search).get('team');
      spaces=all.filter(s=>O.canViewSpace(s.id)&&(!scope||O.spaceTeam(s.id)?.id===scope)).map(s=>({...s,team:O.spaceTeam(s.id).name,role:O.canManageSpace(s.id)?'负责人':'成员'}));
      permission=O.isLeader()?'owner':'member';if(!O.isLeader()||!O.myTeams().some(t=>t.ownerId===O.current().id))todos=[];
      const btn=q('#apply');if(btn)btn.hidden=!O.isLeader()||PrototypeAccounts.grant('space')==='deny';
      const oldApply=window.apply;window.apply=function(){
        if(!O.isLeader()){notice('科研空间和算力由负责人申请。');return;}
        const own=O.myTeams().filter(t=>t.ownerId===O.current().id);if(!own.length){notice('请先在个人中心创建团队。');return;}
        oldApply();const select=q('#application-team');if(select)select.innerHTML=own.map(t=>`<option value="${O.escape(t.name)}" data-id="${t.id}">${O.escape(t.name)}</option>`).join('');
        const form=q('#apply-form'),submit=form?.onsubmit;
        if(form&&submit)form.onsubmit=function(ev){if(!O.isLeader()||!O.canManageTeam(select.selectedOptions[0]?.dataset.id)){ev.preventDefault();notice('当前账号不能为该团队申请空间。');return;}const before=new Set(spaces.map(s=>String(s.id)));const r=submit.call(this,ev);const added=spaces.filter(s=>!before.has(String(s.id)));if(added.length){const db=O.read(),t=db.teams.find(t=>t.id===select.selectedOptions[0].dataset.id);t.spaceIds=[...new Set([...(t.spaceIds||[]),...added.map(s=>String(s.id))])];localStorage.setItem(O.KEY,JSON.stringify(db));}return r;};
      };if(btn)btn.onclick=window.apply;
      window.render();
    }
    if(file==='科研开发空间-详情页(9).html'||file==='科研开发空间-IDE编辑页.html'){
      const id=new URLSearchParams(location.search).get('id')||'1';
      if(!O.canViewSpace(id)){
        const main=document.querySelector('main')||document.querySelector('.app');if(main)main.innerHTML='<section style="padding:72px;text-align:center;background:white"><h2>当前账号无权访问该科研空间</h2><p style="margin:18px">请从已加入团队的科研空间进入。</p><a href="个人中心-高保真原型.html#teams">返回我的团队</a></section>';
        ['renderAll','enterEnvironment','openFile','submitResult','mountResources','manageMembers','archiveSpace','startInstance','stopInstance','submitRun'].forEach(name=>{if(typeof window[name]==='function')window[name]=()=>notice('当前账号无权访问该科研空间。');});
      }else if(file==='科研开发空间-详情页(9).html'){
        space.role=O.canManageSpace(id)?'负责人':'成员';space.team=O.spaceTeam(id).name;
        window.renderMembers=function(){const t=O.spaceTeam(id);members=O.spaceMembers(id).map(accountId=>{const a=O.account(accountId);return {id:a.id,name:a.name,role:a.id===t.ownerId?'负责人':'成员',note:a.kind==='leader'&&a.id!==t.ownerId?'受邀负责人':'团队协作'};});q('#member-count').textContent=members.length+' 人';q('#members').innerHTML=members.map(m=>`<div class="member-row"><span class="member-avatar">${O.escape(m.name[0])}</span><span class="member-name">${O.escape(m.name)}${m.id===O.current().id?'（我）':''}<small>${m.note}</small></span><span class="role ${m.role==='成员'?'member':''}">${m.role}</span></div>`).join('');};
        window.manageMembers=function(){if(!O.canManageSpace(id)||!canManage())return;const t=O.spaceTeam(id),selected=O.spaceMembers(id);openDialog('管理协作成员',`<form id="otSpaceMembers"><div class="modal-body"><p class="hint">从本团队成员中选择科研空间协作人员。</p>${t.memberIds.map(accountId=>{const a=O.account(accountId);return `<label class="file-choice"><input type="checkbox" name="memberIds" value="${a.id}" ${selected.includes(a.id)?'checked':''} ${a.id===t.ownerId?'disabled':''}>${O.escape(a.name)}${a.id===t.ownerId?' · 团队负责人':''}</label>`;}).join('')}</div>${formFooter('保存成员')}</form>`);q('#otSpaceMembers').onsubmit=ev=>{ev.preventDefault();try{O.setSpaceMembers(id,new FormData(ev.target).getAll('memberIds'));closeModal();window.renderMembers();notice('空间成员已保存');}catch(e){notice(e.message);}};};
        window.renderAll();const old=window.renderHeading;window.renderHeading=function(){old();document.querySelectorAll('.heading-meta b').forEach(b=>{if(b.textContent==='张三')b.textContent=O.account(O.spaceTeam(id).ownerId).name;});};window.renderHeading();
      }
    }

  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();

</script>
<script src="assets/prototype-nav.js"></script>
<script src="assets/portal-role-ui.js"></script>
</body>
